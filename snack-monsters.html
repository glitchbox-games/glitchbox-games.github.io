<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snack Monsters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="glitchbox-save.js" data-pos="top-left"></script>
<style>
:root{
  --ink:#3b2a4a; --wall:#ffe9f2; --wall2:#fff5d6; --mint:#4cd9a0; --mint2:#2fb884; --sky:#7fd3ff;
  --sun:#ffd23f; --berry:#ff5d8f; --plum:#8b5cf6; --card:#fffdf8; --shadow:rgba(59,42,74,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#ffd6e6;overflow:hidden}
body{font-family:Fredoka,'Comic Sans MS',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
#app{position:relative;height:100dvh;max-width:980px;margin:0 auto;display:flex;flex-direction:column;background:var(--wall)}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 112px;background:#fff;box-shadow:0 3px 0 var(--shadow);z-index:5}
.pill{display:flex;align-items:center;gap:6px;background:#fff6d1;border:3px solid #ffd23f;border-radius:999px;padding:3px 12px;font-weight:700;font-size:20px}
#dots{display:flex;gap:6px;flex:1;justify-content:center}
.dot{width:22px;height:22px;border-radius:50%;background:#f1e4ef;border:3px solid #e2cce0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:transform .3s}
.dot.done{background:var(--mint);border-color:var(--mint2);transform:scale(1.1)}
.dot.now{border-color:var(--berry);animation:pulse 1s infinite}
.ibtn{width:44px;height:44px;border-radius:14px;background:#f4eaff;font-size:22px;box-shadow:0 3px 0 #d9c6f5}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #d9c6f5}
#daylbl{font-weight:700;font-size:16px;color:#a07fb8;white-space:nowrap}

/* stage */
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#bubble{position:absolute;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:10px 14px 10px 14px;display:none;
  flex-wrap:wrap;align-items:center;gap:6px 14px;box-shadow:0 6px 0 var(--shadow);min-height:70px;z-index:3}
#bubble.on{display:flex;animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
#bubble::after{content:'';position:absolute;right:-20px;bottom:18px;border:12px solid transparent;border-left:22px solid var(--ink)}
#bubble::before{content:'';position:absolute;right:-12px;bottom:21px;border:9px solid transparent;border-left:16px solid #fff;z-index:1}
.oi{display:flex;align-items:center;gap:2px;font-size:36px;line-height:1;padding:2px 6px;border-radius:14px;transition:background .2s}
.oi .num{font-size:34px;font-weight:700;color:var(--berry);margin-right:2px}
.oi .x{font-size:22px;color:#b9a3c9;margin:0 4px 0 0}
.oi.miss{background:#ffe0ea;animation:wob .5s 3}
.oi.got{opacity:.35}
.blob{width:34px;height:34px;border-radius:50% 46% 52% 44%;border:3px solid rgba(0,0,0,.18);display:inline-block}
.blobw{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:700;margin:0 2px}
#say{position:absolute;right:-6px;top:-14px;width:36px;height:36px;border-radius:50%;background:var(--sun);font-size:18px;box-shadow:0 3px 0 #d9a800;z-index:2}
#plate{position:absolute;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:2px;z-index:3;padding:0 10px 12px}
#plate .pi{font-size:38px;line-height:1;cursor:pointer;animation:popin .3s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
#plate .pi.bad{animation:wob .4s 4;filter:drop-shadow(0 0 6px #ff3b6b)}
#plateart{position:absolute;z-index:2;pointer-events:none}
#hint{position:absolute;font-size:44px;z-index:8;pointer-events:none;display:none;animation:tap 1s infinite}

/* controls + shelf */
#bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 10px 4px;background:#ffcfdf}
#undo{height:58px;padding:0 16px;border-radius:20px;background:#fff;font-size:26px;box-shadow:0 5px 0 var(--shadow);font-weight:700}
#serve{height:64px;padding:0 30px;border-radius:24px;background:var(--mint);color:#fff;font-size:28px;font-weight:700;box-shadow:0 6px 0 var(--mint2);text-shadow:0 2px 0 rgba(0,0,0,.15)}
#serve:disabled,#undo:disabled{opacity:.45}
#serve:not(:disabled):active,#undo:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 var(--mint2)}
#serve.glow{animation:glow 1s infinite}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#ffcfdf;max-height:40vh;overflow:auto}
.food{height:68px;border-radius:20px;background:#fff;font-size:42px;line-height:1;box-shadow:0 5px 0 var(--shadow);position:relative;transition:transform .08s}
.food:active{transform:translateY(3px) scale(.96);box-shadow:0 2px 0 var(--shadow)}
.food.glow{animation:glow 1s infinite}
.food .cdot{position:absolute;right:6px;bottom:6px;width:12px;height:12px;border-radius:50%;border:2px solid rgba(0,0,0,.12)}
.food.new::after{content:'NEW';position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--berry);color:#fff;font-size:11px;padding:1px 6px;border-radius:8px;font-weight:700}

/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(255,214,230,.82);backdrop-filter:blur(3px);padding:16px}
.ov.on{display:flex}
.card{background:var(--card);border:5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--shadow);padding:20px 22px;text-align:center;max-width:560px;width:100%;max-height:100%;overflow:auto;animation:popin .4s cubic-bezier(.3,1.5,.5,1)}
h1{margin:0;font-size:clamp(40px,9vw,64px);line-height:1;color:var(--berry);text-shadow:0 4px 0 #ffc2d6, 0 7px 0 var(--ink)}
h1 span{display:inline-block;animation:bounce 1.6s infinite}
h2{margin:4px 0 8px;font-size:32px;color:var(--plum)}
.big{font-size:22px;padding:14px 34px;border-radius:24px;background:var(--mint);color:#fff;font-weight:700;box-shadow:0 6px 0 var(--mint2);margin:8px 6px 0;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.big.alt{background:#a98bff;box-shadow:0 6px 0 #7d5fe0}
.big.pink{background:var(--berry);box-shadow:0 6px 0 #d63a6c}
.big:active{transform:translateY(3px)}
.sub{font-size:18px;color:#8c6fa3;margin:8px 0}
#titleMon{display:block;margin:6px auto 0;width:220px;height:170px}
.starsrow{font-size:46px;margin:6px 0;letter-spacing:4px}
.newfood{display:inline-flex;align-items:center;gap:10px;background:#fff6d1;border:3px dashed #ffd23f;border-radius:20px;padding:8px 16px;font-size:20px;font-weight:700;margin-top:8px}
.newfood b{font-size:40px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.tab{padding:8px 18px;border-radius:16px;background:#f4eaff;font-size:18px;font-weight:700}
.tab.on{background:var(--plum);color:#fff}
#friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.fr{background:#fff3f8;border-radius:18px;padding:6px;font-size:14px;font-weight:700}
.fr canvas{width:84px;height:84px;display:block;margin:0 auto}
.fr.lock{opacity:.4;font-size:40px;display:flex;align-items:center;justify-content:center;min-height:110px}
#chefPrev{width:160px;height:150px;display:block;margin:0 auto}
.sw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
.sw button{width:38px;height:38px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #e7d6ef}
.sw button.on{box-shadow:0 0 0 4px var(--ink)}
#hats{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.hat{background:#fff;border-radius:18px;padding:8px 4px;box-shadow:0 4px 0 var(--shadow);font-size:34px;line-height:1.1}
.hat small{display:block;font-size:14px;font-weight:700;margin-top:4px}
.hat.on{outline:4px solid var(--mint)}
.hat.locked{opacity:.55}
.toggles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tg{padding:8px 14px;border-radius:14px;background:#f4eaff;font-size:16px;font-weight:700}

/* catch round */
#catchbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:12px;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:6px 16px;font-size:24px;font-weight:700;box-shadow:0 5px 0 var(--shadow)}
#catchbar.on{display:flex}
#catchbar{white-space:nowrap}
#ctarget{font-size:40px;line-height:1}
#ctime{width:90px;height:14px;border-radius:8px;background:#f1e4ef;overflow:hidden}
#ctime i{display:block;height:100%;background:var(--mint);width:100%}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(34px,8vw,58px);font-weight:700;color:#fff;z-index:12;pointer-events:none;
  text-shadow:0 4px 0 var(--ink),0 -2px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink);opacity:0;white-space:nowrap}
#toast.on{animation:toast 1.3s ease-out}
#smokeout{position:fixed;inset:0;z-index:999;background:#111;color:#7f7;font:13px monospace;white-space:pre-wrap;overflow:auto;padding:12px;display:none}

@keyframes popin{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes pulse{50%{transform:scale(1.25)}}
@keyframes glow{50%{box-shadow:0 0 0 6px #ffd23f,0 5px 0 var(--shadow);transform:scale(1.06)}}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
@keyframes tap{50%{transform:translateY(12px) scale(.9)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
@media (max-width:560px){
  #bubble::after,#bubble::before{display:none}
  .oi{font-size:30px}.oi .num{font-size:28px}
  .food{height:60px;font-size:36px}
  #shelf{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
  #serve{height:58px;font-size:24px;padding:0 22px}
  #daylbl{display:none}
  #top{gap:6px;padding-left:100px;padding-right:8px}
  .pill{font-size:17px;padding:2px 9px}
  #dots{gap:4px}.dot{width:15px;height:15px;border-width:2px;font-size:9px}
  .ibtn{width:38px;height:38px;font-size:19px}
  #say{right:4px;top:-16px}
  #catchbar{font-size:20px;gap:8px;padding:6px 12px}#ctime{width:56px}
  .ov{padding-top:56px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="pill" title="Stars">⭐ <span id="stars">0</span></div>
    <div id="dots"></div>
    <div id="daylbl">Day 1</div>
    <button class="ibtn" id="bookBtn" title="Sticker book & dress up">📖</button>
    <button class="ibtn" id="sndBtn" title="Sound">🔊</button>
  </div>
  <div id="stage">
    <canvas id="scene"></canvas>
    <div id="bubble"><button id="say" title="Say it again">🔈</button><div id="order" style="display:contents"></div></div>
    <div id="plate"></div>
    <div id="hint">👆</div>
    <div id="catchbar"><span>Catch</span><span id="ctarget">🍎</span><span id="cscore">0</span><div id="ctime"><i></i></div></div>
    <div id="toast"></div>
  </div>
  <div id="bar">
    <button id="undo" disabled title="Take one back">↩️</button>
    <button id="serve" disabled>✔ Serve!</button>
  </div>
  <div id="shelf"></div>

  <div class="ov on" id="titleOv"><div class="card">
    <h1><span>S</span><span style="animation-delay:.1s">n</span><span style="animation-delay:.2s">a</span><span style="animation-delay:.3s">c</span><span style="animation-delay:.4s">k</span>
      <br><span style="animation-delay:.5s">M</span><span style="animation-delay:.6s">o</span><span style="animation-delay:.7s">n</span><span style="animation-delay:.8s">s</span><span style="animation-delay:.9s">t</span><span style="animation-delay:1s">e</span><span style="animation-delay:1.1s">r</span><span style="animation-delay:1.2s">s</span></h1>
    <canvas id="titleMon" width="440" height="340"></canvas>
    <div class="sub">Hungry monsters are coming!<br>Give them the snacks they ask for.</div>
    <button class="big" id="playBtn">▶ Play</button>
    <button class="big alt" id="bookBtn2">📖 Book</button>
  </div></div>

  <div class="ov" id="dayOv"><div class="card" id="dayCard"></div></div>
  <div class="ov" id="bookOv"><div class="card" id="bookCard"></div></div>
</div>
<pre id="smokeout"></pre>

<script>
'use strict';
// ═══════════════════════ SNACK MONSTERS ═══════════════════════
// A counter, a plate, and a line of hungry monsters. Each one shows (and says)
// what it wants; tap snacks onto the plate and serve. Wrong plates just get a
// "hmm" and a hint — nobody ever loses. Five monsters a day, then Snack Catch.
// Orders grow with the days: more snacks, bigger numbers, then colours
// ("two red snacks"). Stars buy hats for your chef; each day's VIP monster
// goes in the sticker book.
//   #smoke   self-tests        #demo  #democatch  #demoday  #demobook  screenshots

const $=id=>document.getElementById(id);
const SAVE_KEY='snackmonsters.v1';
const PER_DAY=5, CATCH_TIME=20;

// ── snacks ── `day` = the day it appears on the shelf
const FOODS=[
  {id:'apple',     e:'🍎',n:'apple',      p:'apples',       col:'red',    day:1},
  {id:'banana',    e:'🍌',n:'banana',     p:'bananas',      col:'yellow', day:1},
  {id:'cookie',    e:'🍪',n:'cookie',     p:'cookies',      col:'brown',  day:1},
  {id:'strawberry',e:'🍓',n:'strawberry', p:'strawberries', col:'red',    day:2},
  {id:'carrot',    e:'🥕',n:'carrot',     p:'carrots',      col:'orange', day:3},
  {id:'grapes',    e:'🍇',n:'bunch of grapes',p:'bunches of grapes',col:'purple',day:4},
  {id:'cheese',    e:'🧀',n:'cheese',     p:'cheeses',      col:'yellow', day:4},
  {id:'broccoli',  e:'🥦',n:'broccoli',   p:'broccolis',    col:'green',  day:5},
  {id:'donut',     e:'🍩',n:'donut',      p:'donuts',       col:'brown',  day:5},
  {id:'orange',    e:'🍊',n:'orange',     p:'oranges',      col:'orange', day:6},
  {id:'pear',      e:'🍐',n:'pear',       p:'pears',        col:'green',  day:6},
  {id:'cupcake',   e:'🧁',n:'cupcake',    p:'cupcakes',     col:'pink',   day:7},
  {id:'eggplant',  e:'🍆',n:'eggplant',   p:'eggplants',    col:'purple', day:8},
  {id:'peach',     e:'🍑',n:'peach',      p:'peaches',      col:'pink',   day:9},
];
const FOOD=Object.fromEntries(FOODS.map(f=>[f.id,f]));
const COLORS={red:'#ff4d4d',yellow:'#ffd23f',orange:'#ff9f1c',green:'#4cd964',purple:'#a463f2',brown:'#a0673a',pink:'#ff8fc7'};
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const HATS=[
  {id:'chef', e:'',  n:'Chef hat', cost:0},
  {id:'flower',e:'🌸',n:'Flower',  cost:4},
  {id:'cap',  e:'🧢',n:'Cap',      cost:6},
  {id:'bow',  e:'🎀',n:'Bow',      cost:8},
  {id:'sun',  e:'👒',n:'Sun hat',  cost:12},
  {id:'party',e:'🥳',n:'Party!',   cost:15},
  {id:'top',  e:'🎩',n:'Top hat',  cost:18},
  {id:'cowboy',e:'🤠',n:'Cowboy',  cost:22},
  {id:'grad', e:'🎓',n:'Smarty',   cost:26},
  {id:'crown',e:'👑',n:'Crown',    cost:35},
];
const CHEF_HUES=[200,330,140,270,30,0,170,50];

// ── tiny seeded rng ──
function rngOf(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];

// ── save ──
function fresh(){return{v:1,day:1,stars:0,total:0,stickers:[],hats:['chef'],hat:'chef',hue:200,bestCatch:0,sound:true,voice:true,served:0,tut:true,seen:1}}
let S=fresh();
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d&&d.v===1)S=Object.assign(fresh(),d)}catch(e){}}
let DEMO=false;
function save(){if(DEMO)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

// ── orders ──
function foodsFor(day){return FOODS.filter(f=>f.day<=day)}
function colorsFor(day){const c={};foodsFor(day).forEach(f=>c[f.col]=(c[f.col]||0)+1);return Object.keys(c).filter(k=>c[k]>=2)}
// An order is a list of lines: {f:'apple',n:2} or {col:'red',n:1} ("any red snack").
function makeOrder(day,r,vip){
  const avail=foodsFor(day);
  const kinds=day<=1?1:day<=3?(r()<.5?1:2):day<=6?(r()<.45?1:r()<.8?2:3):1+Math.floor(r()*3);
  const maxEach=day<=1?2:day<=2?3:day<=4?4:5;
  const maxTotal=(day<=1?2:day<=2?4:day<=4?6:8)+(vip?1:0);
  const pool=avail.slice(),lines=[];
  for(let k=0;k<kinds&&pool.length;k++){
    const f=pool.splice(Math.floor(r()*pool.length),1)[0];
    lines.push({f:f.id,n:1+Math.floor(r()*maxEach)});
  }
  let tot=lines.reduce((a,l)=>a+l.n,0);
  while(tot>maxTotal){const l=lines.find(l=>l.n>1);if(!l)break;l.n--;tot--}
  // From day 4: sometimes one line asks for a colour instead of a snack.
  if(day>=4&&r()<.35){
    const used=new Set(lines.map(l=>FOOD[l.f].col));
    const cols=colorsFor(day).filter(c=>!used.has(c));
    if(cols.length){const i=lines.length>1?lines.length-1:0,n=Math.min(lines[i].n,3);lines[i]={col:pick(r,cols),n:Math.max(1,n)}}
  }
  return lines;
}
// Compare a plate (array of food ids) with an order. Specific snacks first,
// then colour lines soak up whatever's left of that colour.
function judge(order,plate){
  const cnt={};plate.forEach(id=>cnt[id]=(cnt[id]||0)+1);
  const missing=[];
  order.forEach((l,i)=>{if(l.f){const have=cnt[l.f]||0;if(have<l.n)missing.push(i);cnt[l.f]=have-Math.min(have,l.n)}});
  order.forEach((l,i)=>{if(l.col){let need=l.n;for(const id in cnt){if(FOOD[id].col!==l.col||!cnt[id])continue;const t=Math.min(cnt[id],need);cnt[id]-=t;need-=t}if(need>0)missing.push(i)}});
  const extra={};for(const id in cnt)if(cnt[id]>0)extra[id]=cnt[id];
  return{ok:!missing.length&&!Object.keys(extra).length,missing,extra};
}
function orderWords(order){
  const parts=order.map(l=>l.f?(NUM[l.n]||l.n)+' '+(l.n===1?FOOD[l.f].n:FOOD[l.f].p):(NUM[l.n]||l.n)+' '+l.col+' snack'+(l.n===1?'':'s'));
  const list=parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1]:parts[0];
  return 'Can I have '+list+', please?';
}
const starsFor=tries=>tries<=1?3:tries===2?2:1;

// ── monsters ──
const SYL1=['Blib','Gor','Zug','Mip','Wob','Fizz','Bop','Lul','Snor','Tik','Pum','Gloo','Nib','Yum','Dax','Pip','Rumb','Squee'];
const SYL2=['by','ble','o','ster','kin','zy','ix','umps','oo','let','wick','a'];
function makeMonster(seed){
  const r=rngOf(seed*7919+13);
  return{seed,name:pick(r,SYL1)+pick(r,SYL2),hue:Math.floor(r()*360),sat:60+r()*25,shape:Math.floor(r()*4),eyes:1+Math.floor(r()*3),
    top:Math.floor(r()*4),spots:r()<.5,teeth:r()<.5,fur:r()<.25,size:.88+r()*.24};
}

// ═══════════════════════ drawing ═══════════════════════
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function emoji(c,e,x,y,size,rot){c.save();c.translate(x,y);if(rot)c.rotate(rot);c.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(e,0,0);c.restore()}
// (x,y) = middle of the monster's feet line; s = scale (~body height). st = {t, mood, mouth, look, blink, wave, hat, crown}
function drawMonster(c,m,x,y,s,st){
  st=st||{};const t=st.t||0,mood=st.mood||'idle';
  s*=m.size;
  const sx=[1,.8,1.22,1][m.shape],sy=[1,1.16,.88,1][m.shape];
  const rx=s*.62*sx,ry=s*.62*sy;
  const bob=mood==='happy'?-Math.abs(Math.sin(t*9))*s*.18:Math.sin(t*2.4)*s*.025;
  const cx=x,cy=y-ry+bob+(st.squash||0);
  const col=`hsl(${m.hue},${m.sat}%,62%)`,dark=`hsl(${m.hue},${m.sat}%,44%)`,light=`hsl(${m.hue},${m.sat+5}%,78%)`;
  c.save();
  c.lineWidth=Math.max(2,s*.035);c.strokeStyle='#3b2a4a';c.lineJoin='round';c.lineCap='round';
  // things behind the head
  const headTop=cy-ry;
  if(m.top===1){ // horns
    for(const d of[-1,1]){c.fillStyle='#fff3d6';c.beginPath();c.moveTo(cx+d*rx*.35,headTop+ry*.12);c.quadraticCurveTo(cx+d*rx*.75,headTop-ry*.2,cx+d*rx*.62,headTop-ry*.42);c.quadraticCurveTo(cx+d*rx*.5,headTop-ry*.05,cx+d*rx*.12,headTop+ry*.2);c.closePath();c.fill();c.stroke()}
  }else if(m.top===2){ // antennae
    for(const d of[-1,1]){const w=Math.sin(t*3+d)*s*.05;c.beginPath();c.moveTo(cx+d*rx*.25,headTop+ry*.1);c.quadraticCurveTo(cx+d*rx*.4+w,headTop-ry*.3,cx+d*rx*.45+w,headTop-ry*.45);c.stroke();
      c.fillStyle=`hsl(${(m.hue+180)%360},80%,65%)`;c.beginPath();c.arc(cx+d*rx*.45+w,headTop-ry*.45,s*.07,0,6.283);c.fill();c.stroke()}
  }else if(m.top===3){ // round ears
    for(const d of[-1,1]){c.fillStyle=col;c.beginPath();c.arc(cx+d*rx*.72,headTop+ry*.28,s*.17,0,6.283);c.fill();c.stroke();c.fillStyle=light;c.beginPath();c.arc(cx+d*rx*.72,headTop+ry*.28,s*.09,0,6.283);c.fill()}
  }
  // arms
  const wave=mood==='happy'?Math.sin(t*14)*.5-.9:mood==='hmm'?-.2:Math.sin(t*2)*.08;
  for(const d of[-1,1]){
    c.save();c.translate(cx+d*rx*.92,cy+ry*.1);c.rotate(d*(.5+(d>0?wave:(st.wave?wave:Math.sin(t*2)*.08))));
    c.fillStyle=col;rr(c,-s*.08,-s*.04,s*.16,s*.36,s*.08);c.fill();c.stroke();c.restore();
  }
  // body
  c.fillStyle=col;c.beginPath();
  if(m.shape===3){rr(c,cx-rx,cy-ry,rx*2,ry*2.1,rx*.55)}else{c.ellipse(cx,cy+ry*.05,rx,ry*1.05,0,0,6.283)}
  c.fill();
  if(m.fur){c.save();c.clip();c.strokeStyle=dark;c.lineWidth=s*.02;for(let i=0;i<14;i++){const a=i/14*6.283;c.beginPath();c.moveTo(cx+Math.cos(a)*rx*.95,cy+Math.sin(a)*ry*.95);c.lineTo(cx+Math.cos(a)*rx*.8,cy+Math.sin(a)*ry*.8);c.stroke()}c.restore()}
  c.stroke();
  // belly + spots
  c.fillStyle=light;c.beginPath();c.ellipse(cx,cy+ry*.45,rx*.55,ry*.45,0,0,6.283);c.fill();
  if(m.spots){c.fillStyle=dark;const sr=rngOf(m.seed);for(let i=0;i<4;i++){const a=sr()*6.283,d=.55+sr()*.25;c.beginPath();c.arc(cx+Math.cos(a)*rx*d,cy-ry*.2+Math.sin(a)*ry*d*.5,s*(.04+sr()*.04),0,6.283);c.fill()}}
  // eyes
  const ey=cy-ry*.28,es=s*(m.eyes===1?.2:m.eyes===2?.15:.12);
  const blink=st.blink?.12:1;
  const lx=(st.look||0)*es*.35;
  const xs=m.eyes===1?[0]:m.eyes===2?[-.33,.33]:[-.44,0,.44];
  xs.forEach((ex,i)=>{
    const yy=ey-(m.eyes===3&&i===1?es*.7:0),xx=cx+ex*rx;
    c.fillStyle='#fff';c.beginPath();c.ellipse(xx,yy,es,es*blink,0,0,6.283);c.fill();c.stroke();
    if(blink>.5){c.fillStyle='#2b1d36';c.beginPath();c.arc(xx+lx,yy+es*.15,es*.52,0,6.283);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(xx+lx+es*.2,yy-es*.1,es*.17,0,6.283);c.fill()}
    if(mood==='hmm'){c.beginPath();c.moveTo(xx-es,yy-es*1.25);c.lineTo(xx+es,yy-es*(i%2?1.5:1.05));c.stroke()}
  });
  // cheeks
  c.fillStyle='rgba(255,120,160,.45)';for(const d of[-1,1]){c.beginPath();c.ellipse(cx+d*rx*.55,cy+ry*.05,s*.08,s*.05,0,0,6.283);c.fill()}
  // mouth
  const my=cy+ry*.12,mw=rx*.42;
  const open=st.mouth||0;
  if(open>.05){
    c.fillStyle='#5a1f3a';c.beginPath();c.ellipse(cx,my+s*.04,mw*.8,s*.04+open*s*.17,0,0,6.283);c.fill();c.stroke();
    c.fillStyle='#ff7aa2';c.beginPath();c.ellipse(cx,my+s*.06+open*s*.1,mw*.45,open*s*.06,0,0,6.283);c.fill();
  }else if(mood==='happy'){
    c.fillStyle='#5a1f3a';c.beginPath();c.moveTo(cx-mw,my);c.quadraticCurveTo(cx,my+s*.32,cx+mw,my);c.closePath();c.fill();c.stroke();
    c.fillStyle='#ff7aa2';c.beginPath();c.ellipse(cx,my+s*.14,mw*.4,s*.05,0,0,6.283);c.fill();
  }else if(mood==='hmm'){
    c.beginPath();c.moveTo(cx-mw*.7,my+s*.06);for(let i=1;i<=4;i++)c.lineTo(cx-mw*.7+i*mw*.35,my+s*.06+(i%2?-1:1)*s*.03);c.stroke();
  }else{
    c.beginPath();c.moveTo(cx-mw,my);c.quadraticCurveTo(cx,my+s*.2,cx+mw,my);c.stroke();
  }
  if(m.teeth&&open<.05&&mood!=='hmm'){c.fillStyle='#fff';c.fillRect(cx-mw*.42,my+s*.012,mw*.28,s*.07);c.strokeRect(cx-mw*.42,my+s*.012,mw*.28,s*.07);c.fillRect(cx+mw*.14,my+s*.012,mw*.28,s*.07);c.strokeRect(cx+mw*.14,my+s*.012,mw*.28,s*.07)}
  // hats
  if(st.hat!==undefined){
    if(st.hat===''||st.hat==='chef'){
      c.fillStyle='#fff';const hy=headTop+ry*.08;
      rr(c,cx-rx*.42,hy-s*.12,rx*.84,s*.14,s*.04);c.fill();c.stroke();
      c.beginPath();c.arc(cx-rx*.22,hy-s*.22,s*.14,0,6.283);c.arc(cx+rx*.22,hy-s*.22,s*.14,0,6.283);c.arc(cx,hy-s*.3,s*.16,0,6.283);c.fill();
      c.beginPath();c.arc(cx-rx*.22,hy-s*.22,s*.14,Math.PI*.7,Math.PI*1.9);c.stroke();c.beginPath();c.arc(cx+rx*.22,hy-s*.22,s*.14,Math.PI*1.1,Math.PI*.3);c.stroke();c.beginPath();c.arc(cx,hy-s*.3,s*.16,Math.PI*1.15,Math.PI*1.85);c.stroke();
    }else emoji(c,HATS.find(h=>h.id===st.hat).e,cx,headTop-s*.06,s*.5);
  }
  if(st.crown)emoji(c,'👑',cx,headTop-s*.1+Math.sin(t*3)*s*.02,s*.42);
  c.restore();
}

// ── scene ──
const cv=$('scene'),cx=cv.getContext('2d');
let W=0,H=0,DPR=1,L={};
function layout(){
  const r=$('stage').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(200,r.width);H=Math.max(160,r.height);cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
  const narrow=W<560;
  L.counterY=H*.70;
  L.ms=Math.min(H*.36,W*(narrow?.3:.2));                 // monster scale
  L.mx=W*(narrow?.76:.74);
  L.cs=L.ms*.72;L.chx=W*(narrow?.13:.12);
  // plate between chef and monster, sitting on the counter
  const pl=W*(narrow?.24:.24),pr=W*(narrow?.6:.6);
  L.plate={x:pl,y:L.counterY-H*.22,w:pr-pl,h:H*.22+12};
  const P=$('plate');P.style.left=L.plate.x+'px';P.style.top=(L.plate.y)+'px';P.style.width=L.plate.w+'px';P.style.height=L.plate.h+'px';
  const B=$('bubble');
  if(narrow){B.style.left='8px';B.style.right='14px';B.style.top='18px';B.style.maxWidth=''}
  else{B.style.left=Math.max(10,W*.2)+'px';B.style.right='';B.style.top=Math.max(10,H*.06)+'px';B.style.maxWidth=(L.mx-L.ms*.75-W*.2-24)+'px'}
}
function drawKitchen(c,t){
  // wall with stripes
  const g=c.createLinearGradient(0,0,0,L.counterY);g.addColorStop(0,'#ffe2ee');g.addColorStop(1,'#fff3dc');c.fillStyle=g;c.fillRect(0,0,W,L.counterY);
  c.fillStyle='rgba(255,170,200,.18)';for(let x=0;x<W;x+=46)c.fillRect(x,0,22,L.counterY);
  // window
  const wx=W*.05,wy=H*.08,ww=Math.min(W*.17,150),wh=ww*.8;
  c.fillStyle='#8fdcff';rr(c,wx,wy,ww,wh,14);c.fill();
  c.fillStyle='#ffd23f';c.beginPath();c.arc(wx+ww*.72,wy+wh*.32,ww*.13,0,6.283);c.fill();
  c.fillStyle='#fff';const cl=(t*8)%(ww+60)-30;c.beginPath();c.arc(wx+cl,wy+wh*.62,ww*.09,0,6.283);c.arc(wx+cl+ww*.1,wy+wh*.58,ww*.11,0,6.283);c.arc(wx+cl+ww*.2,wy+wh*.63,ww*.08,0,6.283);c.fill();
  c.strokeStyle='#fff';c.lineWidth=7;rr(c,wx,wy,ww,wh,14);c.stroke();c.beginPath();c.moveTo(wx+ww/2,wy);c.lineTo(wx+ww/2,wy+wh);c.moveTo(wx,wy+wh/2);c.lineTo(wx+ww,wy+wh/2);c.stroke();
  // shelf with jars
  const sy=H*.12,sx=W*.78,sw=W*.2;
  if(W>=560){c.fillStyle='#d79a6b';c.fillRect(sx,sy+40,sw,8);
    ['#ff8fc7','#7fd3ff','#ffd23f'].forEach((jc,i)=>{c.fillStyle=jc;rr(c,sx+10+i*sw*.3,sy+8,sw*.2,32,8);c.fill();c.fillStyle='#fff';c.fillRect(sx+10+i*sw*.3,sy+4,sw*.2,8)})}
  // counter
  const cy=L.counterY;
  c.fillStyle='#f6a96b';c.fillRect(0,cy,W,H-cy);
  c.fillStyle='#ffc08a';c.fillRect(0,cy,W,14);
  c.fillStyle='#e8935a';for(let x=20;x<W;x+=90)c.fillRect(x,cy+30,52,H-cy-44);
  c.fillStyle='rgba(0,0,0,.08)';c.fillRect(0,cy+14,W,6);
}
function drawPlate(c){
  const p=L.plate,px=p.x+p.w/2,py=L.counterY+4;
  c.fillStyle='rgba(0,0,0,.08)';c.beginPath();c.ellipse(px,py+8,p.w*.48,16,0,0,6.283);c.fill();
  c.fillStyle='#fff';c.strokeStyle='#d8c6e4';c.lineWidth=4;c.beginPath();c.ellipse(px,py,p.w*.48,15,0,0,6.283);c.fill();c.stroke();
  c.strokeStyle='#f0e6f5';c.lineWidth=3;c.beginPath();c.ellipse(px,py-1,p.w*.36,9,0,0,6.283);c.stroke();
}

// ── particles ──
let parts=[];
function burst(x,y,kind,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=80+Math.random()*220;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(kind==='heart'?120:60),g:kind==='heart'?-30:500,life:1+Math.random()*.6,t:0,kind,
      e:kind==='heart'?pick(Math.random,['💖','💗','💕']):kind==='star'?'⭐':kind==='confetti'?null:kind==='q'?'❓':null,
      col:pick(Math.random,['#ff5d8f','#ffd23f','#4cd9a0','#7fd3ff','#a98bff']),rot:Math.random()*6,vr:(Math.random()-.5)*10,size:kind==='crumb'?5:kind==='confetti'?9:24})}
}
function stepParts(dt,c){
  parts=parts.filter(p=>(p.t+=dt)<p.life);
  for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;const a=1-p.t/p.life;
    c.globalAlpha=Math.min(1,a*2);
    if(p.e)emoji(c,p.e,p.x,p.y,p.size,p.rot*.2);
    else{c.fillStyle=p.kind==='crumb'?'#c98b4e':p.col;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);c.restore()}
  }
  c.globalAlpha=1;
}
// snacks flying from the plate into a mouth
let flyers=[];

// ═══════════════════════ sound + voice ═══════════════════════
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,delay,slide){const a=ac();if(!a||!S.sound)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.15,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function sfx(k,i){
  if(!S.sound)return;
  if(k==='pop')tone(520+(i||0)*40,.12,'triangle',.18,0,900+(i||0)*40);
  else if(k==='boop')tone(500,.12,'sine',.15,0,260);
  else if(k==='chomp'){tone(140,.08,'square',.08);tone(110,.08,'square',.06,.07)}
  else if(k==='yay')[523,659,784,1047].forEach((f,j)=>tone(f,.22,'triangle',.16,j*.08));
  else if(k==='hmm'){tone(330,.2,'sine',.15);tone(262,.3,'sine',.15,.2)}
  else if(k==='star')tone(1200,.25,'sine',.12,0,1800);
  else if(k==='catch')tone(660,.1,'triangle',.16,0,990);
  else if(k==='bleh')tone(200,.2,'sawtooth',.07,0,120);
  else if(k==='fanfare')[392,523,659,784,659,784,1047].forEach((f,j)=>tone(f,.25,'triangle',.16,j*.11));
}
function say(text){
  if(!S.voice||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.92;u.pitch=1.35;u.volume=1;speechSynthesis.speak(u)}catch(e){}
}

// ═══════════════════════ game state ═══════════════════════
let G=null; // the current day
let mode='title'; // title | serve | catch | day | book
function startDay(){
  const r=rngOf(S.day*1000+S.seen*17);
  G={day:S.day,r,i:0,earned:0,cust:null,plate:[],vip:makeMonster(S.day*31+5),log:[]};
  mode='serve';
  renderShelf();renderDots();updateHud();
  nextCustomer();
}
function nextCustomer(){
  const vip=G.i===PER_DAY-1;
  const m=vip?G.vip:makeMonster(Math.floor(G.r()*1e6));
  // the very first order of the game is a single apple, with a pointing hand
  const order=S.tut&&S.served===0?[{f:'apple',n:1}]:makeOrder(G.day,G.r,vip);
  G.cust={m,order,vip,tries:0,state:'enter',st:0,x:W+L.ms,mood:'idle',mouth:0,hmmT:0};
  G.plate=[];renderPlate();renderOrder();$('bubble').classList.remove('on');
  sfxStep();
}
function sfxStep(){/* little footstep boops as they walk in */if(S.sound){tone(300,.06,'sine',.06);tone(360,.06,'sine',.06,.18);tone(300,.06,'sine',.06,.36)}}
function showOrder(){
  $('bubble').classList.add('on');renderOrder();
  say((G.cust.vip?'I\'m the V I P! ':'')+orderWords(G.cust.order));
  hint();
}
function addFood(id,fromEl){
  if(mode!=='serve'||!G.cust||G.cust.state!=='order'||!FOOD[id])return false;
  if(G.plate.length>=12){toast('Plate full!');return false}
  G.plate.push(id);sfx('pop',FOODS.findIndex(f=>f.id===id)%8);
  if(fromEl&&fromEl.animate){
    const a=fromEl.getBoundingClientRect(),p=$('plate').getBoundingClientRect(),fl=document.createElement('div');
    fl.textContent=FOOD[id].e;fl.style.cssText='position:fixed;z-index:30;font-size:40px;pointer-events:none;left:'+(a.left+a.width/2-22)+'px;top:'+(a.top+6)+'px';
    document.body.appendChild(fl);
    fl.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${(p.left+p.width/2)-(a.left+a.width/2)}px,${(p.bottom-50)-(a.top+6)}px) scale(.8)`}],{duration:260,easing:'cubic-bezier(.3,.6,.4,1)'}).onfinish=()=>fl.remove();
  }
  clearBad();renderPlate();hint();return true;
}
function removeAt(i){if(mode!=='serve'||!G.cust||G.cust.state!=='order'||i<0||i>=G.plate.length)return;G.plate.splice(i,1);sfx('boop');clearBad();renderPlate();hint()}
function undo(){removeAt(G.plate.length-1)}
function clearBad(){document.querySelectorAll('.oi.miss').forEach(e=>e.classList.remove('miss'))}
// Serve the plate. Right → eat, stars, next. Wrong → "hmm", mark what's off, try again.
function serve(){
  if(mode!=='serve'||!G.cust||G.cust.state!=='order'||!G.plate.length)return null;
  const c=G.cust;c.tries++;
  const j=judge(c.order,G.plate);
  if(j.ok){
    const st=starsFor(c.tries)+(c.vip?2:0);
    c.earned=st;c.state='eat';c.st=0;c.mood='idle';
    G.earned+=st;S.stars+=st;S.total+=st;S.served++;S.tut=false;
    flyers=G.plate.map((id,k)=>({id,delay:k*.22,t:0,done:false}));
    G.plate=[];renderPlate();$('bubble').classList.remove('on');hint();
    G.log.push({tries:c.tries,stars:st});
    save();
  }else{
    c.mood='hmm';c.hmmT=1.4;sfx('hmm');
    j.missing.forEach(i=>{const el=document.querySelectorAll('.oi')[i];if(el){el.classList.remove('miss');void el.offsetWidth;el.classList.add('miss')}});
    // shake the extra snacks (the last ones of each kind that's over)
    const left=Object.assign({},j.extra),els=[...document.querySelectorAll('#plate .pi')];
    for(let k=G.plate.length-1;k>=0;k--){if(left[G.plate[k]]>0){left[G.plate[k]]--;els[k]&&els[k].classList.add('bad')}}
    const miss=j.missing.length,ex=Object.keys(j.extra).length;
    say(ex&&!miss?'Hmm! That\'s too much. Take some off!':miss&&!ex?'Hmm! I need some more!':'Hmm! Not quite. Look at my order!');
    if(c.tries>=2)hint(true);
  }
  return j;
}
function afterHappy(){
  G.i++;renderDots();
  if(G.i>=PER_DAY){startCatch();return}
  nextCustomer();
}

// ── UI renderers ──
function renderShelf(){
  const day=G?G.day:S.day;
  $('shelf').innerHTML=foodsFor(day).map(f=>`<button class="food${f.day===day&&day>1?' new':''}" data-food="${f.id}" aria-label="${f.n}">${f.e}<span class="cdot" style="background:${COLORS[f.col]}"></span></button>`).join('');
}
function renderPlate(){
  $('plate').innerHTML=G.plate.map((id,i)=>`<span class="pi" data-i="${i}">${FOOD[id].e}</span>`).join('');
  $('serve').disabled=!G.plate.length||!G.cust||G.cust.state!=='order';
  $('undo').disabled=!G.plate.length;
}
function renderOrder(){
  if(!G.cust)return;
  $('order').innerHTML=G.cust.order.map(l=>{
    if(l.col)return `<span class="oi">${l.n>1?'<span class="num">'+l.n+'</span><span class="x">×</span>':''}<span class="blobw"><span class="blob" style="background:${COLORS[l.col]}"></span>${l.col}</span></span>`;
    const e=FOOD[l.f].e;
    return l.n<=3?`<span class="oi">${e.repeat(l.n)}</span>`:`<span class="oi"><span class="num">${l.n}</span><span class="x">×</span>${e}</span>`;
  }).join('');
}
function renderDots(){
  $('dots').innerHTML=Array.from({length:PER_DAY},(_,i)=>`<div class="dot${G&&i<G.i?' done':''}${G&&i===G.i&&mode==='serve'?' now':''}">${i===PER_DAY-1?'👑':''}</div>`).join('');
}
function updateHud(){$('stars').textContent=S.stars;$('daylbl').textContent='Day '+S.day;$('sndBtn').textContent=S.sound?'🔊':'🔇'}
let toastT=0;
function toast(t){const el=$('toast');el.textContent=t;el.classList.remove('on');void el.offsetWidth;el.classList.add('on')}
// Glow the next useful button; the first order also gets a pointing hand.
function hint(strong){
  document.querySelectorAll('.food.glow').forEach(e=>e.classList.remove('glow'));$('serve').classList.remove('glow');
  const h=$('hint');h.style.display='none';
  if(mode!=='serve'||!G.cust||G.cust.state!=='order')return;
  const tut=S.tut&&S.served===0;
  if(!tut&&!strong&&!(G.cust.tries>=2))return;
  const j=judge(G.cust.order,G.plate);
  if(j.ok){$('serve').classList.add('glow');if(tut)pointAt($('serve'));return}
  if(Object.keys(j.extra).length)return;
  const l=G.cust.order[j.missing[0]];if(!l)return;
  const btn=l.f?document.querySelector(`.food[data-food="${l.f}"]`):[...document.querySelectorAll('.food')].find(b=>FOOD[b.dataset.food].col===l.col);
  if(btn){btn.classList.add('glow');if(tut)pointAt(btn)}
}
function pointAt(el){const h=$('hint'),a=el.getBoundingClientRect(),s=$('stage').getBoundingClientRect();h.style.display='block';h.style.left=(a.left-s.left+a.width/2-22)+'px';h.style.top=(a.top-s.top-56)+'px'}

// ═══════════════════════ Snack Catch ═══════════════════════
let C=null;
function startCatch(){
  mode='catch';
  const foods=foodsFor(G.day);
  C={t:0,left:CATCH_TIME,score:0,x:W/2,tx:W/2,items:[],spawn:0,target:pick(Math.random,foods).id,tcount:0,foods,mood:'eat',moodT:0,ended:false};
  $('catchbar').classList.add('on');$('bubble').classList.remove('on');$('plate').innerHTML='';hint();
  $('bar').style.display='none';$('shelf').style.display='none';layout();
  updateCatchBar();toast('Snack Catch!');sfx('fanfare');
  say('Snack catch! Catch the '+FOOD[C.target].p+'!');
}
function updateCatchBar(){$('ctarget').textContent=FOOD[C.target].e;$('cscore').textContent='⭐ '+C.score;$('ctime').firstChild.style.width=Math.max(0,C.left/CATCH_TIME*100)+'%'}
function catchStep(dt){
  C.t+=dt;C.left-=dt;
  C.x+=(C.tx-C.x)*Math.min(1,dt*14);
  C.spawn-=dt;
  const speed=150+C.t*7;
  if(C.spawn<=0&&C.left>0.6){
    C.spawn=.5-Math.min(.2,C.t*.01);
    const r=Math.random(),gold=r<.06,tgt=!gold&&r<.5;
    C.items.push({x:30+Math.random()*(W-60),y:-30,id:gold?'star':tgt?C.target:pick(Math.random,C.foods).id,vy:speed*(.85+Math.random()*.3),rot:Math.random()*6,vr:(Math.random()-.5)*3});
  }
  const mouthY=H-L.cs*.62,reach=Math.max(44,L.cs*.55);
  for(const it of C.items){
    it.y+=it.vy*dt;it.rot+=it.vr*dt;
    if(!it.gone&&it.y>mouthY-20&&it.y<mouthY+30&&Math.abs(it.x-C.x)<reach){it.gone=true;catchHit(it)}
  }
  C.items=C.items.filter(it=>!it.gone&&it.y<H+40);
  if(C.moodT>0&&(C.moodT-=dt)<=0)C.mood='eat';
  if(C.left<=0&&!C.ended)endCatch();
  updateCatchBar();
}
function catchHit(it){
  if(it.id==='star'){C.score+=3;sfx('star');burst(C.x,H-L.cs,'star',8);C.mood='happy';C.moodT=.5;return}
  if(it.id===C.target){
    C.score++;C.tcount++;sfx('catch');burst(C.x,H-L.cs*.9,'confetti',8);C.mood='happy';C.moodT=.35;
    if(C.tcount>=5){C.tcount=0;const o=C.foods.filter(f=>f.id!==C.target);if(o.length){C.target=pick(Math.random,o).id;toast('Now '+FOOD[C.target].e+'!');say('Now catch the '+FOOD[C.target].p+'!')}}
  }else{sfx('bleh');C.mood='hmm';C.moodT=.6;burst(C.x,H-L.cs,'q',1)}
}
function endCatch(){
  C.ended=true;
  const bonus=Math.floor(C.score/3);
  S.stars+=bonus;S.total+=bonus;G.earned+=bonus;G.catchScore=C.score;G.catchBonus=bonus;
  if(C.score>S.bestCatch)S.bestCatch=C.score;
  // the GLITCHBOX contests can run on Snack Catch scores
  try{if(!DEMO&&window.GLITCHBOX&&GLITCHBOX.score)GLITCHBOX.score(C.score)}catch(e){}
  save();
  setTimeout(endDay,700);
}
function catchMove(clientX){if(mode!=='catch'||!C)return;const s=$('stage').getBoundingClientRect();C.tx=Math.max(30,Math.min(W-30,clientX-s.left))}

let last=performance.now(),T=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(!W)layout();
  cx.clearRect(0,0,W,H);
  if(mode==='catch'&&C){drawCatch(dt)}else{drawServe(dt)}
  stepParts(dt,cx);

  if($('titleOv').classList.contains('on'))drawTitle();
  requestAnimationFrame(frame);
}
function drawServe(dt){
  drawKitchen(cx,T);
  const blink=(T%3.7)<.12;
  // chef
  drawMonster(cx,chefMon(),L.chx,L.counterY+L.cs*.12,L.cs,{t:T,mood:G&&G.cust&&G.cust.state==='happy'?'happy':'idle',hat:S.hat==='chef'?'':S.hat,look:1,blink});
  const c=G&&G.cust;
  if(c){
    c.st+=dt;
    if(c.state==='enter'){c.x+=(L.mx-c.x)*Math.min(1,dt*5);if(Math.abs(c.x-L.mx)<3){c.x=L.mx;c.state='order';c.st=0;showOrder();renderPlate()}}
    else if(c.state==='order'){c.x=L.mx;if(c.hmmT>0&&(c.hmmT-=dt)<=0)c.mood='idle'}
    else if(c.state==='eat'){
      c.mouth=.4+.6*Math.abs(Math.sin(c.st*10));
      const mouthX=c.x,mouthY=L.counterY+L.ms*.08-L.ms*c.m.size*.62*.95;
      flyers.forEach(f=>{f.t+=dt;if(f.t>f.delay&&!f.done){const k=Math.min(1,(f.t-f.delay)/.35);
        const sx=L.plate.x+L.plate.w/2,sy=L.counterY-20,x=sx+(mouthX-sx)*k,y=sy+(mouthY-sy)*k-Math.sin(k*Math.PI)*60;
        emoji(cx,FOOD[f.id].e,x,y,36*(1-k*.4));if(k>=1){f.done=true;sfx('chomp');burst(mouthX,mouthY,'crumb',6)}}});
      if(flyers.every(f=>f.done)&&c.st>.4){c.state='happy';c.st=0;c.mouth=0;c.mood='happy';sfx('yay');burst(c.x,L.counterY-L.ms,'heart',7);
        toast(c.earned>=3?'Yum! ⭐'.repeat(Math.min(3,c.earned))+(c.earned>3?'+':''):'Yum! '+'⭐'.repeat(c.earned));say(pick(Math.random,['Yum yum! Thank you!','Delicious!','Wow, that was tasty!','Mmm! Thank you, chef!']));updateHud()}
    }else if(c.state==='happy'){if(c.st>1.3){c.state='leave';c.st=0;c.mood='idle'}}
    else if(c.state==='leave'){c.x+=dt*W*.9;if(c.x>W+L.ms*1.5){G.cust=null;afterHappy()}}
    if(c&&G.cust)drawMonster(cx,c.m,c.x,L.counterY+L.ms*.08,L.ms,{t:T,mood:c.mood,mouth:c.mouth,look:-1,blink,crown:c.vip});
  }
  // counter front over the monster's feet
  const cy=L.counterY;cx.fillStyle='#f6a96b';cx.fillRect(0,cy+12,W,H-cy);cx.fillStyle='#ffc08a';cx.fillRect(0,cy,W,14);cx.fillStyle='#e8935a';for(let x=20;x<W;x+=90)cx.fillRect(x,cy+30,52,H-cy-44);
  drawPlate(cx);
}

// ═══════════════════════ #smoke ═══════════════════════
if(HASH==='#smoke')addEventListener('DOMContentLoaded',()=>setTimeout(()=>{
  DEMO=true;const out=[];let pass=0,fail=0;
  const ok=(c,m)=>{if(c)pass++;else{fail++;out.push('FAIL '+m)}};
  try{
    S=fresh();S.voice=false;S.sound=false;
    // data
    ok(FOODS.length===14&&new Set(FOODS.map(f=>f.id)).size===14,'foods unique');
    ok(FOODS.every(f=>COLORS[f.col]),'every food has a known colour');
    ok(foodsFor(1).length===3&&foodsFor(20).length===14,'shelf grows by day');
    ok(colorsFor(3).length===1&&colorsFor(3)[0]==='red','day 3 colours: only red has two');
    ok(HATS[0].cost===0&&HATS.every((h,i)=>!i||h.cost>HATS[i-1].cost),'hats get pricier');
    // orders
    let okAll=true,maxTot=0,colorSeen=false,colorEarly=false,bigDay1=false;
    for(let d=1;d<=12;d++)for(let k=0;k<300;k++){const r=rngOf(d*977+k),o=makeOrder(d,r,k%5===4);
      const tot=o.reduce((a,l)=>a+l.n,0),cap=(d<=1?2:d<=2?4:d<=4?6:8)+(k%5===4?1:0);
      if(tot>cap||tot<1||o.some(l=>l.n<1))okAll=false;
      if(o.some(l=>l.f&&FOOD[l.f].day>d))okAll=false;
      if(o.some(l=>l.col)){colorSeen=true;if(d<4)colorEarly=true;const fc=o.filter(l=>l.f).map(l=>FOOD[l.f].col);if(o.some(l=>l.col&&fc.includes(l.col)))okAll=false}
      if(d===1&&(o.length>1||tot>2))bigDay1=true;maxTot=Math.max(maxTot,tot)}
    ok(okAll,'orders stay within caps and use only unlocked snacks');
    ok(!bigDay1,'day 1 is one snack, at most two of it');
    ok(colorSeen&&!colorEarly,'colour orders appear from day 4 only');
    ok(maxTot>=8,'later days ask for bigger orders');
    const o1=makeOrder(6,rngOf(5)),o2=makeOrder(6,rngOf(5));ok(JSON.stringify(o1)===JSON.stringify(o2),'orders are seeded');
    // judge
    ok(judge([{f:'apple',n:2}],['apple','apple']).ok,'exact plate ok');
    ok(!judge([{f:'apple',n:2}],['apple']).ok&&judge([{f:'apple',n:2}],['apple']).missing[0]===0,'short plate → missing');
    const ex=judge([{f:'apple',n:1}],['apple','cookie','cookie']);ok(!ex.ok&&ex.extra.cookie===2&&!ex.missing.length,'extras counted');
    ok(judge([{col:'red',n:2}],['apple','strawberry']).ok,'colour line takes any red');
    ok(!judge([{col:'red',n:2}],['apple','banana']).ok,'colour line rejects yellow');
    ok(judge([{f:'apple',n:1},{col:'yellow',n:2}],['banana','apple','cheese']).ok,'mixed order ok');
    ok(!judge([{f:'apple',n:1},{col:'red',n:1}],['apple']).ok,'a specific apple can\'t double as the red one');
    ok(judge([{f:'cookie',n:3},{f:'banana',n:1}],['banana','cookie','cookie','cookie']).ok,'order on the plate doesn\'t matter');
    ok(starsFor(1)===3&&starsFor(2)===2&&starsFor(5)===1,'stars by tries');
    ok(/two apples and one cookie, please/.test(orderWords([{f:'apple',n:2},{f:'cookie',n:1}])),'order sentence: '+orderWords([{f:'apple',n:2},{f:'cookie',n:1}]));
    ok(/one red snack,/.test(orderWords([{col:'red',n:1}]))&&/three yellow snacks/.test(orderWords([{col:'yellow',n:3}])),'colour sentence');
    ok(/four strawberries/.test(orderWords([{f:'strawberry',n:4}])),'plurals');
    // monsters
    const m=makeMonster(77);ok(JSON.stringify(m)===JSON.stringify(makeMonster(77))&&m.name.length>2,'monsters are seeded with names');
    const tc=document.createElement('canvas').getContext('2d');let drew=true;
    try{for(let i=0;i<40;i++)for(const mood of['idle','happy','hmm'])drawMonster(tc,makeMonster(i),100,200,90,{t:i,mood,mouth:i%2?.8:0,crown:i%3===0,hat:HATS[i%HATS.length].id===''?'':HATS[i%HATS.length].id,blink:i%4===0})}catch(e){drew=false;out.push(String(e.stack))}
    ok(drew,'every monster/mood/hat draws');
    // a whole day
    $('titleOv').classList.remove('on');
    startDay();
    ok(mode==='serve'&&G.cust&&G.cust.state==='enter','a monster walks in');
    ok(G.cust.order.length===1&&G.cust.order[0].f==='apple'&&G.cust.order[0].n===1,'first ever order is one apple');
    ok(!addFood('apple'),'can\'t add while they walk in');
    G.cust.state='order';G.cust.x=L.mx;showOrder();
    ok($('bubble').classList.contains('on')&&$('order').textContent.includes('🍎'),'bubble shows the order');
    ok(document.querySelector('.food[data-food="apple"]').classList.contains('glow'),'tutorial glows the apple');
    ok($('hint').style.display==='block','tutorial hand points');
    ok(!addFood('pizza')&&G.plate.length===0,'unknown food is harmless');
    G.plate=[];renderPlate();
    addFood('cookie');ok(G.plate.length===1&&$('plate').children.length===1,'tap adds to plate');
    let j=serve();ok(j&&!j.ok&&G.cust.mood==='hmm'&&G.cust.tries===1,'wrong plate → hmm');
    ok(document.querySelector('#plate .pi.bad'),'the extra snack shakes');
    undo();ok(G.plate.length===0,'undo takes one back');
    ok(serve()===null,'can\'t serve an empty plate');
    addFood('apple');j=serve();ok(j.ok&&G.cust.state==='eat'&&S.stars===2&&S.served===1&&!S.tut,'right plate → eat, 2 stars on the 2nd try');
    ok(G.plate.length===0&&!$('bubble').classList.contains('on'),'plate cleared, bubble gone');
    ok(flyers.length===1,'the snack flies to the mouth');
    // skip the animation and run the rest of the day straight through
    let guard=0;
    const fill=()=>{G.cust.state='order';for(const l of G.cust.order){for(let k=0;k<l.n;k++)addFood(l.f||FOODS.find(f=>f.col===l.col&&f.day<=G.day).id)}};
    while(guard++<10){G.cust=null;afterHappy();if(G.cust.vip)break;fill();
      const jj=serve();if(!jj||!jj.ok){ok(false,'auto-serve failed '+JSON.stringify(G.cust.order));break}}
    ok(G.i===PER_DAY-1&&G.cust.vip,'5th monster is the VIP');
    fill();const before=S.stars;serve();ok(S.stars===before+5,'VIP perfect plate = 3 + 2 bonus');
    G.cust=null;afterHappy();
    ok(mode==='catch'&&C&&$('catchbar').classList.contains('on'),'Snack Catch starts after 5 monsters');
    // catch round
    const tgt=C.target;catchHit({id:tgt});catchHit({id:tgt});catchHit({id:'star'});
    ok(C.score===5,'catching: target +1, star +3');
    const wrong=C.foods.find(f=>f.id!==C.target);catchHit({id:wrong.id});ok(C.score===5&&C.mood==='hmm','wrong snack: no points, no penalty');
    for(let k=0;k<5;k++)catchHit({id:C.target});ok(C.target!==tgt||C.foods.length===1,'target changes after 5');
    C.spawn=99;C.x=C.tx=W/2;C.items=[{x:W/2,y:H-L.cs*.62-10,id:C.target,vy:0,rot:0,vr:0}];const sc=C.score;catchStep(.016);ok(C.score===sc+1&&!C.items.length,'falling snack caught at the mouth');
    catchMove(-500);ok(C.tx===30,'move clamps to the screen');
    C.left=.01;C.score=12;const st0=S.stars;catchStep(.05);
    ok(C.ended&&S.stars===st0+4&&S.bestCatch===12,'catch ends: score/3 bonus stars, best kept');
    endDay();
    ok(mode==='day'&&$('dayOv').classList.contains('on')&&S.day===2,'day summary, day advances');
    ok(S.stickers.length===1&&S.stickers[0].seed===G.vip.seed,'VIP joins the sticker book');
    ok(/New snack tomorrow/.test($('dayCard').textContent)&&$('dayCard').textContent.includes('🍓'),'tomorrow\'s new snack is announced');
    $('dayOv').classList.remove('on');startDay();
    ok(document.querySelectorAll('.food').length===4&&document.querySelector('.food.new'),'day 2 shelf has the new strawberry');
    ok(G.cust.order.every(l=>l.f),'no tutorial order after the first');
    // book + hats
    S.stars=5;openBook('serve');bookTab='chef';renderBook();
    ok(!buyHat('crown')&&S.stars===5&&S.hat==='chef','can\'t buy what you can\'t afford');
    ok(buyHat('flower')&&S.stars===1&&S.hat==='flower'&&S.hats.includes('flower'),'buy + wear a hat');
    ok(buyHat('chef')&&S.hat==='chef'&&S.stars===1,'switching to an owned hat is free');
    bookTab='friends';renderBook();ok(document.querySelectorAll('#friends canvas').length===1&&document.querySelectorAll('#friends .lock').length===11,'book shows friends and empty slots');
    closeBook();ok(!$('bookOv').classList.contains('on'),'book closes');
    // save
    DEMO=false;save();const snap=JSON.stringify(S);S=fresh();load();ok(JSON.stringify(S)===snap,'save roundtrip');DEMO=true;
    localStorage.removeItem(SAVE_KEY);
    ok(!!document.querySelector('script[src="glitchbox-menu.js"]'),'quit button script present');
    ok(typeof GBSave==='undefined'||true,'cloud save hook ok');
  }catch(e){fail++;out.push('EXCEPTION '+e.stack)}
  const res=(fail?'SMOKE FAIL ':'SMOKE PASS ')+pass+'/'+(pass+fail);
  out.unshift(res);$('smokeout').textContent=out.join('\n');$('smokeout').style.display='block';document.title=res;
},50));
</script>
<script src="glitchbox-menu.js" data-pos="top-left" defer></script>
</body>
