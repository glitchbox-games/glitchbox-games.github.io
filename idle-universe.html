<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idle Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="glitchbox-save.js" data-pos="bottom-left"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#03040a;--panel:#080a16;--panel2:#0d1022;--line:rgba(140,160,255,.12);
  --text:#dfe4ff;--muted:#7680a8;--dim:#454c70;
  --gold:#ffd36a;--cyan:#6ee7ff;--violet:#b28cff;--pink:#ff7ad9;--green:#7dffb0;--red:#ff6b7a;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit}
#app{display:grid;grid-template-columns:1fr 430px;grid-template-rows:auto 1fr;height:100vh}
/* top bar */
#top{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:10px 18px;background:linear-gradient(180deg,#070915,#04050c);border-bottom:1px solid var(--line);position:relative;z-index:3}
#logo{font-family:Orbitron;font-weight:900;font-size:15px;letter-spacing:3px;background:linear-gradient(90deg,#fff,#b28cff,#6ee7ff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#era{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
#era b{color:var(--violet);font-weight:700}
#ticker{flex:1;overflow:hidden;white-space:nowrap;font-size:13px;color:#9aa3cf;font-style:italic;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
#ticker span{display:inline-block;transition:opacity .6s}
.topbtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:15px;cursor:pointer}
.topbtn:hover{border-color:var(--violet)}
/* stage */
#stage{position:relative;overflow:hidden;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;display:block}
#hud{position:absolute;left:0;right:0;top:18px;text-align:center;pointer-events:none;z-index:2}
#energy{font-family:Orbitron;font-weight:700;font-size:40px;letter-spacing:1px;text-shadow:0 0 24px rgba(178,140,255,.6)}
#energy small{font-size:16px;color:var(--muted);font-weight:500;margin-left:6px;letter-spacing:2px}
#eps{font-size:15px;color:var(--cyan);margin-top:2px;letter-spacing:1px}
#buffs{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.buff{font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(255,211,106,.12);border:1px solid rgba(255,211,106,.4);color:var(--gold)}
#hint{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-size:14px;color:rgba(220,225,255,.55);letter-spacing:3px;pointer-events:none;animation:pulse 2.4s infinite;z-index:2}
@keyframes pulse{50%{opacity:.25}}
#floaters{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.fl{position:absolute;font-family:Orbitron;font-weight:700;font-size:16px;color:#fff;text-shadow:0 0 10px var(--violet);animation:flt 1.1s ease-out forwards;white-space:nowrap}
.fl.gold{color:var(--gold);font-size:20px;text-shadow:0 0 14px #f90}
@keyframes flt{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-80px);opacity:0}}
/* side panel */
#side{min-width:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:none;padding:12px 4px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;position:relative;font-weight:600}
.tab.on{color:var(--text);border-bottom-color:var(--violet)}
.tab .dot{position:absolute;top:8px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);display:none}
.tab .dot.show{display:block}
#pane{flex:1;overflow-y:auto;padding:12px;min-height:0}
#pane::-webkit-scrollbar{width:8px}#pane::-webkit-scrollbar-thumb{background:#1e2342;border-radius:4px}
.buyrow{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.buyrow span{font-size:11px;color:var(--muted);letter-spacing:2px;margin-right:auto}
.qbtn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:600}
.qbtn.on{border-color:var(--violet);color:#fff;background:#1a1640}
/* buildings */
.bld{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-bottom:7px;cursor:pointer;transition:transform .08s,border-color .15s,opacity .15s;position:relative;overflow:hidden}
.bld:hover{border-color:rgba(178,140,255,.45)}
.bld:active{transform:scale(.985)}
.bld.no{opacity:.5;cursor:default}
.bld.locked{opacity:.35;cursor:default;filter:grayscale(1)}
.bld .ic{font-size:28px;text-align:center;filter:drop-shadow(0 0 8px rgba(178,140,255,.4))}
.bld .nm{font-weight:700;font-size:15px}
.bld .cs{font-size:13px;color:var(--gold);margin-top:1px}
.bld.no .cs{color:var(--red)}
.bld .ds{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.bld .ow{font-family:Orbitron;font-size:26px;font-weight:700;color:rgba(255,255,255,.18)}
.bld .bar{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--violet),var(--cyan));opacity:.6}
/* upgrades */
.sect{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin:10px 2px 8px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.ug{aspect-ratio:1;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;position:relative;transition:transform .08s}
.ug:hover{border-color:var(--gold);transform:translateY(-2px)}
.ug.no{opacity:.45}
.ug.own{opacity:.9;border-color:rgba(125,255,176,.25);cursor:default}
.ug .tier{position:absolute;bottom:2px;right:5px;font-size:9px;font-family:Orbitron;color:var(--gold)}
/* tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;max-width:290px;background:#0b0e20f2;border:1px solid rgba(178,140,255,.4);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;box-shadow:0 10px 40px #000a;display:none}
#tip h4{font-size:14px;margin-bottom:3px}
#tip .c{color:var(--gold);font-size:12px}
#tip .q{color:var(--muted);font-style:italic;font-size:12px;margin-top:5px}
#tip .e{color:var(--green);font-size:12.5px;margin-top:3px}
/* cosmos */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.card h3{font-family:Orbitron;font-size:14px;letter-spacing:2px;margin-bottom:6px}
.card p{font-size:13px;color:#aab2da;line-height:1.45}
.big{font-family:Orbitron;font-size:28px;font-weight:700;color:var(--violet);text-shadow:0 0 18px rgba(178,140,255,.5)}
.btn{display:inline-block;background:linear-gradient(135deg,#3b1f8f,#1c2a7a);border:1px solid #6d5cff;border-radius:10px;padding:10px 16px;font-weight:700;letter-spacing:1.5px;cursor:pointer;font-size:13px;text-transform:uppercase}
.btn:hover{filter:brightness(1.25)}
.btn[disabled]{opacity:.35;cursor:default;filter:none}
.btn.red{background:linear-gradient(135deg,#6b1028,#3a0a2a);border-color:#ff4d7a}
.tree{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.node{background:#0a0c1c;border:1px solid var(--line);border-radius:10px;padding:9px;cursor:pointer;font-size:12px;line-height:1.35}
.node b{display:block;font-size:13px;margin-bottom:2px}
.node .k{color:var(--violet);font-family:Orbitron;font-size:11px;margin-top:4px}
.node.own{border-color:rgba(125,255,176,.5);background:#0b1a16}
.node.own .k{color:var(--green)}
.node.lock{opacity:.35;cursor:default}
.node.can{border-color:rgba(178,140,255,.6);box-shadow:0 0 14px rgba(178,140,255,.15)}
/* stats / achievements */
.stat{display:flex;justify-content:space-between;font-size:13px;padding:6px 2px;border-bottom:1px solid #12152a}
.stat span:first-child{color:var(--muted)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.ac{aspect-ratio:1;border-radius:10px;background:#090b18;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;filter:grayscale(1);opacity:.25}
.ac.got{filter:none;opacity:1;border-color:rgba(255,211,106,.4);background:#14110a}
/* modal */
#modal{position:fixed;inset:0;background:rgba(2,3,8,.82);backdrop-filter:blur(6px);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#mbox{background:#0a0c1c;border:1px solid rgba(178,140,255,.35);border-radius:16px;padding:24px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 90px #000}
#mbox h2{font-family:Orbitron;font-size:20px;letter-spacing:3px;margin-bottom:10px}
#mbox p{color:#aab2da;line-height:1.5;margin-bottom:12px;font-size:14px}
.laws{display:grid;gap:8px;margin:12px 0}
.law{background:#0d1022;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.law:hover{border-color:var(--violet);background:#141236}
.law b{font-size:15px}.law .g{color:var(--green);font-size:13px;margin-top:3px}.law .bd{color:var(--red);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea{width:100%;height:90px;background:#05060e;border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:11px;padding:8px;font-family:monospace}
/* toast */
#toasts{position:fixed;right:446px;bottom:16px;z-index:45;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:#0b0e20f2;border:1px solid rgba(255,211,106,.45);border-radius:10px;padding:9px 14px;font-size:13px;animation:tin .35s ease-out;box-shadow:0 8px 30px #000a;max-width:300px}
.toast b{color:var(--gold)}
@keyframes tin{from{transform:translateY(16px);opacity:0}}
/* ending */
#ending{position:fixed;inset:0;z-index:60;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px}
#ending.show{display:flex}
#ending .ln{font-family:Orbitron;color:#cfd6ff;font-size:18px;letter-spacing:2px;opacity:0;margin:8px 0;transition:opacity 1.6s}
#ending .ln.v{opacity:1}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 46vh minmax(0,1fr)}
  #top{gap:10px;padding:8px 12px}
  #logo{font-size:12px;letter-spacing:2px}
  #era{font-size:10px;letter-spacing:1px;margin-right:auto;overflow:hidden;text-overflow:ellipsis}
  .buyrow span{display:none}
  #top{grid-column:1}
  #ticker{display:none}
  #side{border-left:none;border-top:1px solid var(--line)}
  #energy{font-size:28px}
  #toasts{right:12px;bottom:auto;top:60px}
  .tab{font-size:10px;letter-spacing:.5px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="logo">IDLE UNIVERSE</div>
    <div id="era">Era · <b id="eraName">The Void</b></div>
    <div id="ticker"><span id="tick"></span></div>
    <button class="topbtn" id="sndBtn" title="Sound">🔊</button>
    <button class="topbtn" id="optBtn" title="Options">⚙️</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"><div id="energy">0<small>ENERGY</small></div><div id="eps">0 per second</div><div id="buffs"></div></div>
    <div id="hint">TAP THE SINGULARITY</div>
    <div id="floaters"></div>
  </div>
  <div id="side">
    <div id="tabs">
      <button class="tab on" data-t="build">Build</button>
      <button class="tab" data-t="ups">Upgrades<i class="dot" id="dotUps"></i></button>
      <button class="tab" data-t="cosmos">Cosmos<i class="dot" id="dotCos"></i></button>
      <button class="tab" data-t="stats">Stats</button>
      <button class="tab" data-t="ach">Trophies</button>
    </div>
    <div id="pane"></div>
  </div>
</div>
<div id="tip"></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toasts"></div>
<div id="ending"></div>
<pre id="smokeout" style="display:none"></pre>

<script>
'use strict';
/* ═══════════════════════════ NUMBERS ═══════════════════════════ */
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg','Uvg','Dvg','Tvg','Qavg','Qivg','Sxvg','Spvg','Ocvg','Novg','Tg'];
function fmt(n,dec){
 if(!isFinite(n)) return '∞';
 if(n<0) return '-'+fmt(-n,dec);
 if(n<1000){ return n<10&&dec!==0&&n%1? n.toFixed(1) : Math.floor(n).toLocaleString('en-US'); }
 const e=Math.floor(Math.log10(n)), t=Math.floor(e/3);
 if(sciOn()||t>=SUF.length){ return (n/10**e).toFixed(2)+'e'+e; }
 const v=n/10**(t*3);
 return (v>=100?v.toFixed(1):v>=10?v.toFixed(2):v.toFixed(3))+' '+SUF[t];
}
function sciOn(){ try{ return S.opts.sci; }catch(e){ return 0; } }
function fmtTime(s){ s=Math.floor(s); if(s<60) return s+'s'; if(s<3600) return Math.floor(s/60)+'m '+(s%60)+'s'; if(s<86400) return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m'; return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h'; }

/* ═══════════════════════════ DATA ═══════════════════════════ */
// The ladder of creation. Each rung is ~10x pricier and ~6-7x stronger than the last,
// so the newest building is always the best deal per energy — until upgrades say otherwise.
const B=[
 {id:'foam',  n:'Quantum Foam',      ic:'💫',base:15,     r:0.1,   era:'The Void',           d:'Virtual particles blink in and out. Some forget to leave.'},
 {id:'quark', n:'Quark Soup',        ic:'🔴',base:100,    r:1,     era:'Quark Epoch',        d:'A trillion-degree broth. Do not stir.'},
 {id:'proton',n:'Proton Forge',      ic:'⚛️',base:1100,   r:8,     era:'Hadron Epoch',       d:'Three quarks walk into a bar. They never leave.'},
 {id:'hydro', n:'Hydrogen Cloud',    ic:'☁️',base:12e3,   r:47,    era:'Recombination',      d:'The universe goes transparent. You can finally see.'},
 {id:'neb',   n:'Nebula',            ic:'🌫️',base:13e4,   r:400,   era:'The Dark Ages',      d:'A nursery the size of a thousand solar systems.'},
 {id:'star',  n:'Star',              ic:'⭐',base:14e5,   r:3000,  era:'First Light',        d:'Gravity squeezes until something ignites.'},
 {id:'nova',  n:'Supernova Remnant', ic:'💥',base:2e7,    r:35e3,  era:'Stellar Forges',     d:'Every atom of iron in your blood came from one of these.'},
 {id:'planet',n:'Planet',            ic:'🪐',base:33e7,   r:44e4,  era:'Planetary Age',      d:'Leftover dust, rolled into balls. Surprisingly popular.'},
 {id:'life',  n:'Living World',      ic:'🌍',base:51e8,   r:52e5,  era:'Age of Life',        d:'Chemistry that started copying itself. Things got out of hand.'},
 {id:'civ',   n:'Civilization',      ic:'🏙️',base:75e9,   r:6e7,  era:'Age of Minds',       d:'Matter that looks up and asks why. You owe it an answer.'},
 {id:'dyson', n:'Dyson Sphere',      ic:'🌞',base:1e12,   r:6e8,   era:'Kardashev II',       d:'Why let starlight escape when you could keep it?'},
 {id:'clust', n:'Galaxy Cluster',    ic:'🌌',base:14e12,  r:65e8,  era:'Cosmic Web',         d:'A thousand galaxies, bound by dark matter and spite.'},
 {id:'sim',   n:'Simulation',        ic:'🖥️',base:17e13,  r:6e10,  era:'The Simulation',     d:'A universe inside your universe. It is idling too.'},
];
const NB=B.length;
const RATE_K=4;   // global pace dial: every building's output is scaled by this
// Era backgrounds: hot bright plasma early, a dark middle age, then starlight returns.
const ERA_BG=[['#05030a','#0c0618'],['#1a0805','#3a1308'],['#1a0620','#30103a'],['#06101f','#0d1d36'],['#030409','#090a16'],['#050714','#121634'],['#0a0614','#1c0f2c'],['#04080f','#0b1626'],['#030c0b','#0a1f1c'],['#05060f','#0f1430'],['#0d0803','#24180a'],['#04030c','#120b26'],['#020806','#04140c']];

// Upgrade names per building, in tier order. Past the list we fall back to Mk numerals.
const TIER_AT=[1,5,25,50,100,150,200,250];
const TIER_COST=[10,50,500,5e4,5e6,5e8,5e10,5e12];
const TNAMES={
 foam:['Uncertainty Principle','Vacuum Fluctuation','Casimir Plates','Zero-Point Harvest','Planck Lattice','Foam Weaving','Spacetime Lace','Quantum Overflow'],
 quark:['Color Charge','Gluon Glue','Up & Down','Strange Attractors','Charm Offensive','Top Shelf','Bottom Line','Asymptotic Freedom'],
 proton:['Strong Force','Isospin','Neutron Spare Parts','Deuterium Bond','Baryon Assembly Line','Nucleosynthesis','Mass Gap','Proton Decay Insurance'],
 hydro:['Electron Capture','Lyman Alpha','21-cm Whisper','Cold Clumps','Jeans Instability','Molecular Clouds','Hydrogen Rain','Cosmic Dawn'],
 neb:['Pillars of Creation','Bok Globules','Shockwave Seeding','Emission Glow','Dust Lanes','Protostellar Disks','Stellar Wombs','Orion Protocol'],
 star:['Main Sequence','Proton-Proton Chain','CNO Cycle','Red Giant Phase','Helium Flash','Blue Supergiants','Wolf-Rayet Winds','Population III'],
 nova:['Core Collapse','Iron Catastrophe','r-Process','Neutron Star Mergers','Magnetars','Kilonova Gold','Shock Fronts','Hypernova'],
 planet:['Accretion','Hot Jupiters','Goldilocks Zone','Tidal Locking','Plate Tectonics','Magnetospheres','Ring Systems','Rogue Worlds'],
 life:['RNA World','Photosynthesis','Cambrian Explosion','Eyes','Symbiosis','Flowering','Warm Blood','Panspermia'],
 civ:['Fire','Writing','Printing Press','Steam Engine','Transistor','Internet','Fusion Power','Hive Mind'],
 dyson:['Swarm Satellites','Statite Shells','Matrioshka Brain','Stellar Lifting','Shkadov Thruster','Star Tap','Nicoll-Dyson Beam','Total Capture'],
 clust:['Dark Matter Halo','Galactic Filaments','Great Attractor','Intracluster Medium','Galaxy Cannibalism','Bullet Collision','Laniakea','Cosmic Web Spinning'],
 sim:['Hello World','Recursion','Garbage Collection','Overclock','Cloud Universe','Nested Instances','Root Access','Source Code'],
};
// Synergies: building A gets +x% per building B owned.
const SYN=[
 {id:'syn0',n:'Gluon Seeding',a:1,b:0,p:.02,req:[0,50,1,25],cost:9e3,q:'The foam feeds the soup. Physicists call this "cheating".'},
 {id:'syn1',n:'Stellar Nurseries',a:5,b:4,p:.02,req:[4,25,5,10],cost:8e7,q:'Each nebula is a crib for a dozen stars.'},
 {id:'syn2',n:'Second Generation',a:6,b:5,p:.01,req:[5,50,6,10],cost:3e9,q:'Stars that die rich leave rich children.'},
 {id:'syn3',n:'Heavy Element Rain',a:7,b:6,p:.02,req:[6,25,7,10],cost:4e10,q:'Planets made of dead stars. Recycling at its finest.'},
 {id:'syn4',n:'Panspermia',a:8,b:7,p:.02,req:[7,50,8,10],cost:6e11,q:'Life hitches a ride on every rock it can.'},
 {id:'syn5',n:'Galactic Internet',a:9,b:9,p:.005,req:[9,25,9,25],cost:1e14,q:'Each civilization is a little smarter for every other one it can hear.'},
 {id:'syn6',n:'Stellar Engineering',a:10,b:5,p:.005,req:[10,10,5,100],cost:2e15,q:'Every star is an unbuilt Dyson sphere.'},
 {id:'syn7',n:'Recursive Cosmos',a:12,b:11,p:.03,req:[11,25,12,5],cost:5e17,q:'The simulation simulates clusters that run simulations.'},
];
// Click upgrades: x2 the tap, and a slice of passive income per tap.
const CLICKUPS=[
 {id:'c0',n:'Fingertip Fusion',ic:'👆',cost:100,  x:2,p:0,  req:()=>S.clicks>=30,q:'Your touch runs hot.'},
 {id:'c1',n:'Pressure Points',ic:'✋',cost:1e3,  x:2,p:0,  req:()=>S.clicks>=150,q:'Squeeze harder. The universe is soft.'},
 {id:'c2',n:'Big Bang Reflex',ic:'💥',cost:5e4,  x:1,p:.01,req:()=>S.clicks>=400,q:'Every tap is a little genesis.'},
 {id:'c3',n:'Creator\'s Hand',ic:'🖐️',cost:5e6,  x:1,p:.01,req:()=>S.clicks>=1000,q:'You are not tapping the universe. You are conducting it.'},
 {id:'c4',n:'Prime Mover',ic:'☝️',cost:5e8,  x:1,p:.01,req:()=>S.clicks>=2500,q:'Before the first cause, there was you, tapping.'},
 {id:'c5',n:'Omnipotent Poke',ic:'🫵',cost:5e11, x:1,p:.01,req:()=>S.clicks>=5000,q:'One finger. Infinite consequences.'},
 {id:'c6',n:'Touch of Eternity',ic:'✨',cost:5e14, x:1,p:.01,req:()=>S.clicks>=9000,q:'Time itself flinches.'},
];

const SAVE_KEY='idle-universe-v1';
function fresh(keep){
 const s={
  e:0, run:0, all:0, clicks:0, clicksAll:0, comets:0, cometsAll:0,
  owned:Array(NB).fill(0), ups:{}, ach:{}, tree:{}, dm:0, dmTotal:0, crunches:0,
  law:'std', lawsSeen:['std'], pendingLaw:false, playRun:0, playAll:0, bestEps:0,
  flags:{}, opts:{sound:1,sci:0,oracle:1,arch:1,qty:1}, buffs:[], last:Date.now(), ended:0,
 };
 if(keep){ for(const k of ['all','clicksAll','cometsAll','ach','tree','dm','dmTotal','crunches','lawsSeen','playAll','bestEps','flags','opts','ended']) s[k]=keep[k]; }
 return s;
}
let S=fresh();
let EPS=0, CLICK=1, MULT=[], GMUL=1;

/* ═══════════════════════════ ECONOMY ═══════════════════════════ */
const has=id=>!!S.ups[id], tree=id=>!!S.tree[id];
function scale(){ if(S.law==='cheap') return 1.12; return tree('rebate')?1.14:1.15; }
function costMul(){ return tree('infl')?0.9:1; }
function upCostMul(){ return (S.law==='cheap'?3:1)*costMul(); }
function bCost(i,n=1,owned=S.owned[i]){
 const s=scale(), c0=B[i].base*costMul()*s**owned;
 return n===1?c0:c0*(s**n-1)/(s-1);
}
function maxBuy(i){
 const s=scale(), c0=B[i].base*costMul()*s**S.owned[i];
 if(S.e<c0) return 0;
 return Math.floor(Math.log(S.e*(s-1)/c0+1)/Math.log(s));
}
function lawMul(i){
 switch(S.law){
  case 'grav': return (i===4||i===5||i===11)?3:(i<=2?.5:1);
  case 'fert': return (i===8||i===9)?4:(i===10?.5:1);
  case 'obs':  return .7;
  case 'rich': return i<=3?10:(i>=5?.8:1);
 } return 1;
}
function tiersOwned(i){ let n=0; for(let t=0;t<8;t++) if(S.ups['t'+i+'_'+t]) n++; return n; }
function achBonus(){ return 1+Object.keys(S.ach).length*(tree('echo')?.02:.01); }
function dmBonus(){ return 1+S.dmTotal*(tree('immune')?.15:.10); }
function recalc(){
 GMUL=dmBonus()*achBonus();
 for(const g of GLOBALUPS) if(has(g.id)) GMUL*=g.m;
 if(tree('second')) GMUL*=3;
 if(S.law==='fast') GMUL*=.85;
 if(S.law==='vac') GMUL*=2.5;
 let eps=0;
 for(let i=0;i<NB;i++){
  let m=2**tiersOwned(i)*lawMul(i);
  for(const s of SYN) if(s.a===i&&has(s.id)) m*=1+s.p*S.owned[s.b];
  MULT[i]=m;
  eps+=B[i].r*S.owned[i]*m*RATE_K;
 }
 EPS=eps*GMUL*buffMul('frenzy');
 let cx=1, cp=0;
 for(const c of CLICKUPS) if(has(c.id)){ cx*=c.x; cp+=c.p; }
 if(tree('heat')){ cx*=3; cp+=.01; }
 if(S.law==='obs'){ cx*=10; cp+=.05; }
 if(S.law==='cold') cx*=.25;
 CLICK=(cx*dmBonus()+EPS*cp)*buffMul('burst');
 if(EPS>S.bestEps) S.bestEps=EPS;
}
function bRate(i){ return B[i].r*RATE_K*MULT[i]*GMUL*buffMul('frenzy'); }
function buffMul(kind){ let m=1; for(const b of S.buffs) if(b.k===kind) m*=b.m; return m; }

function earn(x){ S.e+=x; S.run+=x; S.all+=x; }
function buy(i,n){
 n=n||qtyFor(i); if(n<=0) return false;
 const c=bCost(i,n); if(S.e<c) return false;
 S.e-=c; S.owned[i]+=n; recalc(); sfx('buy',i); dirty=true; vis.sync(); return true;
}
function qtyFor(i){ const q=S.opts.qty; return q==='max'?Math.max(1,maxBuy(i)):q; }

/* upgrades list (built once) */
const UPS=[];
for(let i=0;i<NB;i++) for(let t=0;t<8;t++){
 const nm=(TNAMES[B[i].id]||[])[t]||(B[i].n+' Mk '+(t+1));
 UPS.push({id:'t'+i+'_'+t,n:nm,ic:B[i].ic,tier:t+1,cost:B[i].base*TIER_COST[t],kind:'tier',b:i,
   req:()=>S.owned[i]>=TIER_AT[t]&&(t===0||has('t'+i+'_'+(t-1))),
   eff:B[i].n+' production ×2.',q:'Unlocked at '+TIER_AT[t]+' '+B[i].n+'.'});
}
SYN.forEach(s=>UPS.push({id:s.id,n:s.n,ic:'🔗',cost:s.cost,kind:'syn',
 req:()=>S.owned[s.req[0]]>=s.req[1]&&S.owned[s.req[2]]>=s.req[3],
 eff:B[s.a].n+' +'+Math.round(s.p*1000)/10+'% for each '+B[s.b].n+' owned.',q:s.q}));
CLICKUPS.forEach(c=>UPS.push({id:c.id,n:c.n,ic:c.ic,cost:c.cost,kind:'click',req:c.req,
 eff:(c.x>1?'Taps ×'+c.x+'.':'Taps also yield +1% of energy/sec.'),q:c.q}));
GLOBALUPS.forEach(g=>UPS.push({id:g.id,n:g.n,ic:g.ic,cost:g.cost,kind:'global',req:g.req,
 eff:g.comet===1?'Comets appear 25% more often.':g.comet===2?'Comet effects last 40% longer.':'All production ×'+g.m+'.',q:g.q}));
const UPMAP=Object.fromEntries(UPS.map(u=>[u.id,u]));
function upCost(u){ return u.cost*upCostMul(); }
function availUps(){ return UPS.filter(u=>!has(u.id)&&u.req()).sort((a,b)=>a.cost-b.cost); }
function buyUp(id){
 const u=UPMAP[id]; if(!u||has(id)||!u.req()) return false;
 const c=upCost(u); if(S.e<c) return false;
 S.e-=c; S.ups[id]=1; recalc(); sfx('up'); dirty=true; return true;
}

function tap(px,py){

function buffDur(){ return (has('g7')?1.4:1)*(tree('tails')?1.5:1); }
function catchComet(c,px,py){
 S.comets++; S.cometsAll++;
 if(S.law==='vac'&&Math.random()<.25){
  let top=-1; for(let i=NB-1;i>=0;i--) if(S.owned[i]>0){top=i;break;}
  if(top>=0){ const lost=Math.max(1,Math.floor(S.owned[top]*.1)); S.owned[top]-=lost; recalc(); vis.sync();
   toast('🫧 <b>Void bubble!</b> '+lost+' '+B[top].n+' erased from existence.'); floater('VOID',px,py,true); sfx('void'); return; }
 }
 const r=Math.random(); let msg;
 if(r<.45){
  const g=Math.min(S.e*.15+13, EPS/buffMul('frenzy')*900+13)*(tree('golden')?2:1);
  earn(g); msg='☄️ <b>Lucky comet!</b> +'+fmt(g)+' energy'; floater('+'+fmt(g),px,py,true);
 } else if(r<.80){
  addBuff('frenzy',7,60*buffDur(),'Frenzy ×7'); msg='🔥 <b>Comet frenzy!</b> Production ×7 for '+Math.round(60*buffDur())+'s'; floater('FRENZY',px,py,true);
 } else if(r<.93){
  addBuff('burst',333,10*buffDur(),'Starburst taps ×333'); msg='✨ <b>Starburst!</b> Taps ×333 for '+Math.round(10*buffDur())+'s — tap fast!'; floater('STARBURST',px,py,true);
 } else {
  for(let k=0;k<7;k++) setTimeout(()=>vis.spawnComet(true),k*350); msg='🌠 <b>Meteor shower!</b> Catch the little ones.'; floater('SHOWER',px,py,true);
 }
 if(c&&c.mini){ const g=EPS/buffMul('frenzy')*20+5; earn(g); recalc(); floater('+'+fmt(g),px,py,true); sfx('comet'); return; }
 recalc(); toast(msg); sfx('comet');
}
function addBuff(k,m,dur,label){ S.buffs=S.buffs.filter(b=>b.k!==k); S.buffs.push({k,m,t:dur,max:dur,label}); recalc(); }

/* ═══════════════════════════ PRESTIGE ═══════════════════════════ */
const CRUNCH_AT=1e10;
const dmFor=all=>Math.floor(Math.pow(all/CRUNCH_AT,.25));   // fourth root: 16x the energy for 2x the Dark Matter
function dmPending(){ return Math.max(0,dmFor(S.all)-S.dmTotal); }
function canCrunch(){ return S.run>=CRUNCH_AT&&dmPending()>0; }
function crunch(){
 if(!canCrunch()) return false;
 const g=dmPending();
 const keep=JSON.parse(JSON.stringify(S));
 keep.dm+=g; keep.dmTotal+=g; keep.crunches++;
 S=fresh(keep);
 if(tree('seed')){ S.owned[0]=20; S.owned[1]=10; }
 S.pendingLaw=true;
 recalc(); vis.reset(); dirty=true; save();
 return g;
}
function buyNode(id){
 const n=TREE.find(t=>t.id===id); if(!n||S.tree[id]) return false;
 if(!n.pre.every(p=>S.tree[p])||S.dm<n.k) return false;
 S.dm-=n.k; S.tree[id]=1; recalc(); sfx('up'); dirty=true;
 if(id==='omega') setTimeout(ending,600);
 return true;
}
function lawChoices(){
 const pool=LAWS.filter(l=>l.id!=='std');
 const n=tree('laws')?4:3, out=[];
 // prefer laws you have never played, so Lawmaker is reachable
 const unseen=pool.filter(l=>!S.lawsSeen.includes(l.id)).sort(()=>Math.random()-.5);
 const seen=pool.filter(l=>S.lawsSeen.includes(l.id)).sort(()=>Math.random()-.5);
 for(const l of unseen.concat(seen)) if(out.length<n) out.push(l);
 return [LAWS[0]].concat(out);
}
function setLaw(id){ S.law=id; if(!S.lawsSeen.includes(id)) S.lawsSeen.push(id); S.pendingLaw=false; recalc(); dirty=true; save(); }

 }

/* ═══════════════════════════ SAVE ═══════════════════════════ */
function snapshot(){ S.last=Date.now(); return JSON.parse(JSON.stringify(S)); }
function restore(d){
 const base=fresh();
 S=Object.assign(base,d);
 S.opts=Object.assign(fresh().opts,d.opts||{});
 S.flags=d.flags||{}; S.owned=(d.owned||[]).concat(Array(NB).fill(0)).slice(0,NB);
 S.buffs=d.buffs||[];
 recalc(); vis.reset(); dirty=true;
}
function save(){ if(DEMO) return; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot())); }catch(e){} }
function offlineGain(sec){
 recalc();
 const eff=(tree('flow')?1:.5)*(S.law==='cold'?3:1);
 return EPS/buffMul('frenzy')*sec*eff;
}
function load(){
 let d=null; try{ d=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
 if(!d) return;
 restore(d);
 const away=Math.min(7*86400,(Date.now()-(d.last||Date.now()))/1000);
 S.buffs=[]; recalc();
 if(away>60&&EPS>0){
  const g=offlineGain(away); earn(g);
  if(away>=3600) S.flags.longAway=1;
  showModal('<h2>WHILE YOU WERE AWAY</h2><p>The universe kept expanding for <b>'+fmtTime(away)+'</b>.</p><div class="big">+'+fmt(g)+'</div><p style="margin-top:8px">energy, at '+Math.round((tree('flow')?100:50)*(S.law==='cold'?3:1))+'% efficiency.</p><div class="row"><button class="btn" onclick="closeModal()">Continue</button></div>');
 }
}
if(window.GBSave) GBSave.register({ save:()=>S.all>0?snapshot():null, load:d=>{restore(d);save();}, autosave:60 });

/* ═══════════════════════════ AUDIO ═══════════════════════════ */
let AC=null, master=null, padOn=false;
function audio(create){
 if(AC||!create) return AC;
 try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination);}catch(e){ AC=null; }
 return AC;
}
const PENTA=[0,2,4,7,9,12,14,16,19,21];
function tone(f,dur,type,vol,delay=0,slide){
 if(!S.opts.sound||!audio()) return;
 const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
 o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
 g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}
function sfx(k,i){
 if(!S.opts.sound) return;
 const root=220*2**((Math.min(eraIdx(),12))/24);
 if(k==='tap'){ const n=PENTA[Math.floor(Math.random()*PENTA.length)]; tone(root*2*2**(n/12),.25,'sine',.12); tone(root*4*2**(n/12),.12,'triangle',.03); }
 else if(k==='buy'){ tone(root*2**((i%7)/12)*1.5,.18,'triangle',.1); tone(root*3,.25,'sine',.05,.05); }
 else if(k==='up'){ [0,4,7,12].forEach((n,j)=>tone(root*2*2**(n/12),.3,'sine',.08,j*.06)); }
 else if(k==='ach'){ [0,7,12,16,19].forEach((n,j)=>tone(root*2*2**(n/12),.5,'triangle',.07,j*.08)); }

  ok(fmt(0)==='0','fmt 0'); ok(fmt(999)==='999','fmt 999'); ok(fmt(1500)==='1.500 K','fmt 1.5K: '+fmt(1500)); ok(fmt(2.5e9)==='2.500 B','fmt B'); ok(fmt(1e300).includes('e'),'fmt sci fallback'); ok(fmt(Infinity)==='∞','fmt inf');
  ok(EPS===0,'start eps 0'); ok(CLICK===1,'start click 1');
  tap(); ok(S.e===1&&S.clicks===1,'tap earns 1');
  near(bCost(0),15,'foam base cost'); near(bCost(0,2),15+15*1.15,'cost of 2'); near(bCost(0,10),15*(1.15**10-1)/.15,'geometric sum');
  S.e=14; ok(!buy(0,1),'cannot afford'); S.e=15; ok(buy(0,1)&&S.owned[0]===1&&S.e<1e-9,'buy foam');
  near(EPS,0.1*RATE_K*achBonus()*dmBonus(),'eps after foam');
  S.e=1e6; ok(maxBuy(0)>0,'maxBuy>0'); const mb=maxBuy(0); ok(bCost(0,mb)<=S.e&&bCost(0,mb+1)>S.e,'maxBuy is exact');
  S.opts.qty='max'; const before=S.owned[0]; buy(0); ok(S.owned[0]===before+mb,'buy max'); S.opts.qty=1;
  // tier upgrade
  S=fresh(); S.owned[1]=1; recalc(); const e1=EPS; ok(UPMAP['t1_0'].req(),'tier unlocks at 1'); S.e=1e9; ok(buyUp('t1_0'),'buy tier'); near(EPS,e1*2,'tier doubles');
  ok(!buyUp('t1_0'),'no double buy'); ok(!UPMAP['t1_1'].req(),'tier 2 locked until 5 owned');
  // synergy
  S=fresh(); S.owned[0]=50; S.owned[1]=25; S.e=1e9; recalc(); const s0=bRate(1); ok(buyUp('syn0'),'buy synergy'); near(bRate(1),s0*(1+.02*50),'synergy math');
  // click upgrade
  S=fresh(); S.clicks=30; S.e=1e6; recalc(); ok(buyUp('c0'),'click up'); ok(CLICK===2,'click x2');
  S.owned[5]=10; recalc(); S.clicks=400; buyUp('c1'); buyUp('c2'); recalc(); near(CLICK,4+EPS*.01,'click pct of eps');
  // buffs
  S=fresh(); S.owned[2]=10; S.all=1e5; checkAch(); recalc(); const be=EPS; addBuff('frenzy',7,60,'x'); near(EPS,be*7,'frenzy x7'); step(61); near(EPS,be,'frenzy expires');
  // comets: lucky capped at 15% bank
  S=fresh(); S.owned[3]=5; recalc(); S.e=1000; const r0=Math.random; Math.random=()=>0.1; catchComet({},0,0); Math.random=r0; ok(S.e>1000&&S.e<=1000*1.15+13+1e-6,'lucky capped by bank: '+S.e); ok(S.comets===1,'comet counted');
  // vacuum law void bubble
  S=fresh(); S.law='vac'; S.owned[4]=20; recalc(); Math.random=()=>0.1; catchComet({},0,0); Math.random=r0; ok(S.owned[4]===18,'void bubble erases 10%');
  // laws
  S=fresh(); S.owned[5]=10; S.owned[0]=10; recalc(); const st=bRate(5), fo=bRate(0); setLaw('grav'); near(bRate(5),st*3,'gravity triples stars'); near(bRate(0),fo*.5,'gravity halves foam');
  setLaw('cheap'); near(bCost(5,1,0),B[5].base,'cheap law base'); near(bCost(5,1,1),B[5].base*1.12,'cheap law scale'); ok(upCost(UPMAP.t5_0)===UPMAP.t5_0.cost*3,'cheap law upgrade cost');
  // crunch
  S=fresh(); S.run=S.all=CRUNCH_AT*81; S.owned[3]=40; S.ups.t0_0=1; ok(canCrunch(),'can crunch'); ok(dmPending()===3,'dm = 4th root: '+dmPending());
  S.ach.t0=1; const g=crunch(); ok(g===3&&S.dm===3&&S.dmTotal===3,'crunch grants dm'); ok(S.owned[3]===0&&!S.ups.t0_0&&S.e===0,'crunch resets run'); ok(S.ach.t0===1&&S.crunches===1,'crunch keeps trophies'); ok(S.pendingLaw,'law pending after crunch');
  ok(!canCrunch(),'cannot crunch again immediately'); S.run=CRUNCH_AT; S.all=CRUNCH_AT*81; ok(dmPending()===0,'no double-dip dm');
  recalc(); ok(Math.abs(dmBonus()-1.3)<1e-9,'dm bonus 10% each');
  // tree
  ok(!buyNode('seed'),'tree prereq enforced'); ok(buyNode('heat')&&S.dm===2,'buy heat'); recalc(); ok(Math.abs(CLICK-3*dmBonus())<1e-9,'heat triples tap');
  ok(buyNode('seed'),'buy seed'); S.dm=0; S.run=S.all=CRUNCH_AT*1e4; crunch(); ok(S.owned[0]===20&&S.owned[1]===10,'seed start');
  S.dm=1e4; for(const n of TREE) if(n.id!=='omega') buyNode(n.id); ok(TREE.filter(n=>n.id!=='omega').every(n=>S.tree[n.id]),'whole tree purchasable'); ok(scale()===1.14,'rebate scale');
  near(bCost(0,1,0),B[0].base*.9,'inflation discount');
  // law choices
  ok(lawChoices().length===5,'4 laws +standard with wider physics');
  // save roundtrip
  S.e=12345; const snap=snapshot(); S=fresh(); restore(snap); ok(S.e===12345&&S.tree.heat===1&&S.owned[0]===20,'save roundtrip');
  // offline
  S=fresh(); S.owned[5]=10; recalc(); near(offlineGain(100),EPS*100*.5,'offline 50%'); S.tree.flow=1; near(offlineGain(100),EPS*100,'dark flow 100%');
  // achievements
  S=fresh(); S.all=2000; S.owned[0]=1; checkAch(); ok(S.ach.t0&&S.ach.b0,'achievements unlock'); recalc(); ok(Math.abs(achBonus()-1-Object.keys(S.ach).length*.01)<1e-9,'ach bonus');
  // auto-architect & oracle
  S=fresh(); S.tree={oracle:1,arch:1}; S.e=1e5; S.clicks=30; recalc(); autoT=3; step(.01); ok(S.ups.c0===1,'oracle buys upgrades'); ok(S.owned.some(n=>n>0),'architect buys');
  // render every era without throwing
  for(let era=0;era<NB;era++){ S=fresh(); for(let i=0;i<=era;i++) S.owned[i]=200; recalc(); vis.sync(); vis.spawnComet(false); vis.spawnComet(true); for(let k=0;k<5;k++) vis.draw(.05); }
  ok(true,'render all eras');
  ok(vis.counts.every((c,i)=>c<=CAPS[i]),'entity caps respected');
  // ui panes render
  for(const t of ['build','ups','cosmos','stats','ach']){ tab=t; renderPane(); ok($('pane').innerHTML.length>50,'pane '+t); }
  // every upgrade has a reachable requirement function
  ok(UPS.every(u=>typeof u.req==='function'&&u.cost>0),'upgrades well-formed'); ok(UPS.length===NB*8+SYN.length+CLICKUPS.length+GLOBALUPS.length,'upgrade count');
  ok(new Set(UPS.map(u=>u.id)).size===UPS.length,'upgrade ids unique'); ok(new Set(ACH.map(a=>a.id)).size===ACH.length,'ach ids unique');
 }catch(e){ fail++; out.push('EXCEPTION '+e.stack); }
 const res=(fail?'SMOKE FAIL ':'SMOKE PASS ')+pass+'/'+(pass+fail);
 out.unshift(res); $('smokeout').textContent=out.join('\n'); $('smokeout').style.display='block'; SMOKE_TITLE=res; document.title=res;
 S=fresh(); recalc();
},300);
</script>
