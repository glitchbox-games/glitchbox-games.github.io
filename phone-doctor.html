<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Phone Doctor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="glitchbox-config.js"></script>
<script src="glitchbox-save.js" data-pos="top-left"></script>
<style>
:root{--bg:#0e1319;--panel:#19202a;--panel2:#212a36;--line:#2c3746;--ink:#e6edf5;--dim:#8c9bb0;--cyan:#39d0ff;--green:#3ddc84;--orange:#ff9f3d;--red:#ff4d5e;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{height:100dvh;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 112px;background:linear-gradient(#0c1117,#090d12);border-bottom:1px solid var(--line);min-height:52px;box-shadow:0 4px 18px rgba(0,0,0,.35);z-index:2}
#top .logo{font-weight:800;font-size:18px;letter-spacing:.6px;white-space:nowrap}
#top .logo b{color:var(--cyan)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-weight:700;font-size:15px;white-space:nowrap}
.stat.cash{color:var(--green)}.stat.cash.neg{color:var(--red)}
#top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:18px}
#main{flex:1;min-height:0;display:grid;grid-template-columns:86px 1fr 310px}
#tools{display:flex;flex-direction:column;gap:5px;padding:8px 7px;background:#0b1015;border-right:1px solid var(--line);overflow:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;border-radius:12px;background:linear-gradient(#1c2430,#171e28);border:1px solid var(--line);line-height:1;position:relative;flex:none;transition:background .15s,border-color .15s}
.tool svg{width:28px;height:28px;display:block}
.tool small{font-size:10.5px;color:var(--dim);font-weight:600;white-space:nowrap}
.tool i{position:absolute;top:3px;right:6px;font-size:9px;font-style:normal;color:#5d6b7d}
.tool:hover{border-color:#3d4b5e}
.tool.on{background:linear-gradient(#143a50,#102c3d);border-color:var(--cyan)}
.tool.on small{color:var(--cyan)}
.tool.act{background:linear-gradient(#183a27,#132e20);border-color:#2a6b45}
.tool.act small{color:#9ff0c2}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#152c3b}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4;width:min(92%,520px)}
.tst{background:rgba(10,14,20,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:500;font-size:15px;text-align:center;animation:tin .25s ease-out;transition:opacity .4s;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tst.bad{border-color:var(--red);color:#ffc4ca}.tst.good{border-color:var(--green);color:#c8ffe0}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#chips{position:absolute;left:8px;right:8px;bottom:8px;display:none;gap:6px;flex-wrap:wrap;justify-content:center;z-index:3;pointer-events:none}
#chips.on{display:flex}
.chip{background:rgba(10,14,20,.9);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip.me{border-color:var(--cyan)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
#tut{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(94%,580px);background:rgba(10,14,20,.95);backdrop-filter:blur(6px);border:1px solid #3a4757;border-radius:14px;padding:10px 14px;z-index:3;display:none;font-size:14.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#tut.on{display:block}
#tut b{color:var(--cyan)}
#tut .th{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:3px}
#tut button{font-size:11px;color:var(--dim);text-decoration:underline;letter-spacing:0;text-transform:none}
#side{background:#0b1015;border-left:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.card{background:linear-gradient(#1a212b,#171d26);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.card h3{margin:0 0 7px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:6px}
#cust{display:flex;gap:10px;align-items:flex-start}
#cust .face{font-size:38px;line-height:1;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.3)}
#cust .who{font-weight:700;font-size:16px}
#cust .mdl{display:inline-block;margin-top:3px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--cyan);font-weight:700}
.said{margin-top:9px;background:#f4f1ea;color:#1d2530;border-radius:12px;padding:8px 10px;font-size:14px;position:relative;line-height:1.35}
.said:before{content:'';position:absolute;top:-8px;left:20px;border:8px solid transparent;border-top:0;border-bottom-color:#f4f1ea}
.pat{margin-top:8px;height:7px;border-radius:9px;background:#0b1015;overflow:hidden}
.pat div{height:100%;background:var(--green);border-radius:9px;transition:background .3s}
.patl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:4px}
.notes{display:flex;flex-direction:column;gap:4px;font-size:12px;font-family:'JetBrains Mono',ui-monospace,monospace}
.notes div{background:#0b1015;border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:#bfe9ff;line-height:1.35}
.empty{color:var(--dim);font-size:13px}
.inv,.tray{display:flex;flex-wrap:wrap;gap:6px}
.it{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12.5px;display:flex;gap:5px;align-items:center}
.it:hover{border-color:#3d4b5e}
.it.sel{border-color:var(--cyan);background:#123447}
.it .old{color:var(--dim);font-size:11px}
.sc{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
.bits{display:flex;gap:4px;margin-bottom:8px}
.bits button{flex:1;font-size:11.5px;padding:5px 2px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-family:'JetBrains Mono',ui-monospace,monospace}
.bits button.on{color:var(--ink);border-color:var(--cyan);background:#123447}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.tabs button.on{color:var(--ink);border-color:var(--cyan)}
.row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.row span{flex:1}
.buy{background:#173322;border:1px solid #2a6b45;color:#9ff0c2;border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px;min-width:52px}
.buy:hover{background:#1d4029}
.buy:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:rgba(5,8,12,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.ov.on{display:flex}
.box{background:linear-gradient(#1b222c,#161c25);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.box h1{margin:0;font-size:42px;font-weight:800;letter-spacing:1px}
.box h1 b{color:var(--cyan)}
.box h2{margin:0 0 8px;font-size:24px}
.box p,.sub{color:var(--dim);font-size:15px;line-height:1.45;margin:8px 0}
.big{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;background:var(--cyan);color:#06222e;font-weight:800;font-size:18px;box-shadow:0 4px 0 #1b8db3}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #1b8db3}
.big.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.big.gr{background:var(--green);color:#052615;box-shadow:0 4px 0 #23985a}
.big:disabled{opacity:.45}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b1015;color:var(--ink);font:inherit;font-size:18px;text-align:center;margin-top:8px}
.code{font-size:46px;font-weight:800;letter-spacing:10px;color:var(--cyan);margin:6px 0}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.prow{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}
.prow.me{border-color:var(--cyan)}
.prow span{flex:1}
.prow i{width:12px;height:12px;border-radius:50%}
.opt{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.opt button{padding:7px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.opt button.on{border-color:var(--cyan);color:var(--cyan);font-weight:700}
.err{color:var(--red);min-height:20px;margin-top:6px;font-size:14px}
.or{color:var(--dim);margin:12px 0 0;font-size:13px}
.tl{text-align:left;display:flex;flex-direction:column;gap:6px;margin:12px 0}
.tl div{display:flex;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:15px}
.tl .f{color:#ffb0b8}.tl .p{color:#a9f3c9}.tl .n{color:#cfe3f5;font-weight:500;text-align:right}
.upg{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin-top:10px}
.u{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px;font-size:13px}
.u b{display:block;font-size:14px;margin-bottom:2px}
.u .d{color:var(--dim);min-height:34px}
.u button{margin-top:6px;width:100%}
.u.own{border-color:#2a6b45;opacity:.75}
.stars{color:var(--gold);font-size:22px;letter-spacing:2px}
.how{text-align:left;font-size:14px;color:var(--dim);line-height:1.5}
.how b{color:var(--ink)}
@media (max-width:820px){
  #top{padding-left:104px;gap:6px}
  #top .logo{display:none}
  .stat{font-size:13px;padding:3px 7px}
  #main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto minmax(0,34vh)}
  #tools{flex-direction:row;order:2;border:0;border-top:1px solid var(--line);padding:6px;overflow-x:auto}
  .tool{min-width:54px;flex:1}
  .tool svg{width:24px;height:24px}
  #stage{order:1}
  #side{order:3;border:0;border-top:1px solid var(--line);padding:8px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="logo">📱 PHONE <b>DOCTOR</b></div>
    <div class="stat" id="sDay">Day 1</div>
    <div class="stat cash" id="sCash">$0</div>
    <div class="stat" id="sRate">⭐ –</div>
    <div class="sp"></div>
    <button class="ib" id="bSnd" title="Sound">🔊</button>
    <button class="ib" id="bHelp" title="Bench reference">📘</button>
  </div>
  <div id="main">
    <div id="tools"></div>
    <div id="stage"><canvas id="cv"></canvas><div id="toast"></div><div id="chips"></div><div id="tut"><div class="th"><span>📘 Day 1 · how repairs work</span><button id="tutSkip">Skip tutorial</button></div><div id="tutTxt"></div></div></div>
    <div id="side"></div>
  </div>
</div>

<div class="ov on" id="titleOv"><div class="box">
  <h1>PHONE <b>DOCTOR</b></h1>
  <p>You run a phone repair shop. People bring in broken phones. Work out what's wrong, fix it, and get paid — or break it worse.</p>
  <button class="big" id="playBtn">🔧 Open the shop</button>
  <button class="big alt" id="raceBtn">👥 Repair Race (online)</button>
  <button class="big alt" id="newBtn" style="display:none">🗑️ Start a new shop</button>
  <button class="big alt" id="howBtn">📘 Bench reference</button>
</div></div>
<div class="ov" id="mpOv"><div class="box" id="mpCard"></div></div>
<div class="ov" id="sheetOv"><div class="box" id="sheet"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const HASH=location.hash.replace(/-debug$/,'');   // the terms gate lets *debug hashes through, so screenshots use #demoX-debug
let DEMO=false;

// ═══════════════════════ data ═══════════════════════
// caseScrews: pentalobes in the bottom edge (Pear) vs glue-only (Android). tabs: stretch-release battery
// pull tabs. glue: how readily the screen adhesive cuts (lower = tougher). mah: design capacity.
const MODELS={
  pear11:{name:'Pear 11',frame:'#d3d8de',accent:'#6f8cff',accent2:'#ff7ad1',mult:1,cut:'notch',caseScrews:true,tabs:true,glue:1,mah:3110,batHead:'PH',mask:'#0f4a36',mid:'#30343a',code:'A2221'},
  galaxo:{name:'Galaxo S7',frame:'#3a6fd6',accent:'#3fd1ff',accent2:'#3a4dff',mult:1.1,cut:'hole',caseScrews:false,tabs:false,glue:.55,mah:3000,batHead:'PH',mask:'#13304f',mid:'#2c3139',code:'EB-BG930'},
  pixelle:{name:'Pixelle 5',frame:'#ece6dc',accent:'#ff9a4a',accent2:'#3ddc84',mult:.9,cut:'hole',caseScrews:false,tabs:false,glue:.7,mah:2800,batHead:'PH',mask:'#1a1c20',mid:'#333438',code:'G020I'},
  pear14:{name:'Pear 14 Pro',frame:'#4c5159',accent:'#b28cff',accent2:'#ffcf6b',mult:1.35,cut:'island',caseScrews:true,tabs:true,glue:.85,mah:3200,batHead:'Y',mask:'#0d3f2f',mid:'#272a2f',code:'A2866'},
};
const MODEL_IDS=Object.keys(MODELS);
const PARTS={screen:{n:'Screen',e:'📺',cost:40},battery:{n:'Battery',e:'🔋',cost:18},port:{n:'Charge port',e:'🔌',cost:14},
  speaker:{n:'Speaker',e:'🔊',cost:10},camera:{n:'Camera',e:'📷',cost:26},board:{n:'Logic board',e:'🧠',cost:95}};
const PART_IDS=Object.keys(PARTS);
// g = exclusive group (one fault per group per phone). day = first day it shows up. pay = what the customer pays.
const FAULTS={
  crack:{part:'screen',g:'scr',pay:110,day:1,say:["I dropped it and the screen shattered.","My little brother sat on it. The screen's smashed."]},
  touch:{part:'screen',g:'scr',pay:110,day:4,say:["The screen turns on but ignores my fingers.","Touch stopped working after it cooked in the car."]},
  battery:{part:'battery',g:'bat',pay:70,day:1,say:["It dies by lunchtime, every single day.","It goes from 40% to dead in a second."]},
  swollen:{part:'battery',g:'bat',pay:80,day:3,say:["The screen is lifting off the phone?! It's kind of… puffy."]},
  port:{part:'port',g:'port',pay:65,day:1,say:["It won't charge anymore. I tried three cables.","Charging just… stopped. Nothing happens."]},
  lint:{part:null,g:'port',pay:35,day:1,say:["It only charges if I hold the cable at a weird angle.","The cable won't click in properly any more."]},
  speaker:{part:'speaker',g:'spk',pay:55,day:2,say:["I can't hear anything when I play music.","My ringtone's gone silent. Volume's on max."]},
  camera:{part:'camera',g:'cam',pay:80,day:2,say:["All my photos come out blurry.","The camera won't focus on anything."]},
  water:{part:null,g:'wb',pay:75,day:3,say:["I dropped it in the bath… it won't turn on.","It went in the pool for like one second. Now it's dead."]},
  board:{part:'board',g:'wb',pay:180,day:4,say:["It's completely dead. Won't even turn on.","Nothing. No logo, no buzz, nothing at all."]},
  backlight:{part:'screen',g:'x',pay:0,day:99,say:[]},
};
const NAMES=['Maya','Jonah','Priya','Leo','Ava','Omar','Chloe','Mateo','Zara','Finn','Ines','Kai','Nora','Ravi','Lena','Theo','Sofia','Dev','Mia','Hugo','Ruby','Sam','Elif','Jude'];
const FACES=['👩','👨','🧑','👵','👴','👧','🧔','👩‍🦰','👨‍🦱','🧑‍🎤','👩‍🔧','🧕','👱','🧑‍🦳','👦','🧑‍💼'];
const UPG=[
  {id:'drill',e:'🪛',n:'Electric screwdriver',cost:120,d:'Screws spin in and out in a blink.'},
  {id:'mat',e:'🧲',n:'Magnetic project mat',cost:60,d:'Every screw stays where it came from — and nothing rolls off the bench.'},
  {id:'gun',e:'🌡️',n:'Smart heat gun',cost:110,d:'Heats twice as fast and cuts out before 95°C.'},
  {id:'chairs',e:'🛋️',n:'Comfy chairs',cost:90,d:'Customers wait 40% longer.'},
  {id:'bulk',e:'📦',n:'Bulk supplier',cost:180,d:'All parts 25% cheaper.'},
  {id:'sign',e:'🪧',n:'Neon shop sign',cost:150,d:'Happy customers tip 50% more.'},
];
const CREDIT=-150;   // the supplier lets you run a tab this deep, so a bad day never locks you out of parts
const TOOLS=[
  {id:'driver',n:'Driver',key:'1'},{id:'heat',n:'Heat',key:'2'},{id:'suction',n:'Suction',key:'3'},
  {id:'pick',n:'Pick',key:'4'},{id:'hand',n:'Hand',key:'5'},{id:'spudger',n:'Spudger',key:'6'},
  {id:'meter',n:'Meter',key:'7'},{id:'brush',n:'IPA',key:'8'},
];
const ICON={
  driver:'<svg viewBox="0 0 24 24"><g transform="rotate(45 12 12)"><rect x="9" y="1" width="6" height="9" rx="2" fill="#39d0ff"/><rect x="9.6" y="2.5" width="1" height="6" fill="#1b8db3"/><rect x="11.5" y="2.5" width="1" height="6" fill="#1b8db3"/><rect x="13.4" y="2.5" width="1" height="6" fill="#1b8db3"/><rect x="10.5" y="10" width="3" height="1.6" fill="#9aa3ad"/><rect x="11.2" y="11.6" width="1.6" height="9" fill="#d9dee4"/><path d="M11.2 20.6h1.6l-.8 1.8z" fill="#d9dee4"/></g></svg>',
  heat:'<svg viewBox="0 0 24 24"><path d="M2 6.5h11.5a3.5 3.5 0 0 1 0 7H9.5l-1.2 7.5H4.6l1.2-7.5H2z" fill="#ff8f3a"/><rect x="2" y="7.5" width="2" height="5" fill="#d96d1c"/><rect x="16.5" y="8" width="4.5" height="4" rx=".8" fill="#9aa3ad"/><path d="M22.2 5.5c-.9 1 .9 1.8 0 2.8M22.2 11.7c-.9 1 .9 1.8 0 2.8" stroke="#ff5a3d" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>',
  suction:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="18.5" rx="9" ry="3.6" fill="#a7b9cc" opacity=".85"/><path d="M7 18c.4-4 9.6-4 10 0" fill="#cfdbe6"/><rect x="10.6" y="7" width="2.8" height="8" rx="1.2" fill="#d94343"/><path d="M7.5 4.6a4.5 3 0 0 1 9 0" stroke="#d94343" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
  pick:'<svg viewBox="0 0 24 24"><path d="M3 21 21 9 9 3z" fill="#39a8ff" opacity=".9"/><path d="M3 21 21 9 9 3z" fill="none" stroke="#a9dcff" stroke-width="1"/></svg>',
  hand:'<svg viewBox="0 0 24 24"><path d="M8.5 21.5c-2.2-1.8-4.5-5-4.9-7.1-.2-1 .9-1.6 1.7-.9l2.2 2V5a1.4 1.4 0 0 1 2.8 0v6.5V3.6a1.4 1.4 0 0 1 2.8 0v7.9V4.7a1.4 1.4 0 0 1 2.8 0v7.4V7.4a1.4 1.4 0 0 1 2.8 0v7.4c0 4.2-2.3 6.7-6.3 6.7z" fill="#f2c9a0" stroke="#c99a6e" stroke-width=".8"/></svg>',

function rngOf(seed){let s=seed>>>0||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const inR=(x,y,r,p=0)=>x>=r[0]-p&&x<=r[0]+r[2]+p&&y>=r[1]-p&&y<=r[1]+r[3]+p;
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n));

function makeJob(r,lvl){
  const models=lvl<=1?['pear11','galaxo']:lvl<=2?['pear11','galaxo','pixelle']:MODEL_IDS;
  const model=pick(r,models);
  const pool=Object.keys(FAULTS).filter(k=>FAULTS[k].day<=lvl);
  const x=r();let n=1;if(lvl>=3&&x<.3)n=2;if(lvl>=5&&x<.1)n=3;
  const faults=[],gs=new Set();let guard=0;
  while(faults.length<n&&guard++<80){const k=pick(r,pool);if(gs.has(FAULTS[k].g))continue;gs.add(FAULTS[k].g);faults.push(k)}
  const spots=[];
  if(faults.includes('water')){const c=SPOT_POS.slice(),m=3+Math.floor(r()*2);for(let i=0;i<m;i++)spots.push(c.splice(Math.floor(r()*c.length),1)[0])}
  const say=faults.map((k,i)=>(i?'Oh, and… ':'')+pick(r,FAULTS[k].say)).join(' ');
  return{model,faults,spots,say,name:pick(r,NAMES),face:pick(r,FACES),hue:Math.floor(r()*360),pat:Math.round(220+90*n+(lvl>=4?20:0)),crack:Math.floor(r()*1e6)};
}
function jobsFor(seed,lvl,n){const r=rngOf(seed);return Array.from({length:n},()=>makeJob(r,lvl))}

// a crack: rays from an impact point, rings around it, and a few loose shards
function makeCracks(seed,ix,iy){
  const r=rngOf(seed),rays=[],rings=[],shards=[];
  const cx=ix!=null?ix:16+r()*68,cy=iy!=null?iy:30+r()*130;
  const n=8+Math.floor(r()*6);
  for(let i=0;i<n;i++){
    let a=i/n*6.283+r()*.45,x=cx,y=cy;const pts=[[x,y]],len=30+r()*110;
    for(let d=0;d<len;d+=5+r()*7){a+=(r()-.5)*.42;x+=Math.cos(a)*7;y+=Math.sin(a)*7;if(x<5||x>95||y<5||y>195)break;pts.push([x,y]);
      if(r()<.18){let bx=x,by=y,ba=a+(r()<.5?-1:1)*(.5+r()*.6);const br=[[bx,by]];for(let k=0;k<3;k++){bx+=Math.cos(ba)*5;by+=Math.sin(ba)*5;br.push([bx,by])}rays.push({pts:br,w:.32})}}
    rays.push({pts,w:.5});
  }
  for(let k=0;k<3;k++){const rad=3+k*5.5+r()*2.5,pts=[];for(let i=0;i<=n;i++){const a=i/n*6.283+r()*.12;pts.push([cx+Math.cos(a)*rad*(.85+r()*.3),cy+Math.sin(a)*rad*(.85+r()*.3)])}rings.push(pts)}
  for(let i=0;i<7;i++){const a=r()*6.283,d=2+r()*10,s=1.2+r()*2.4,px=cx+Math.cos(a)*d,py=cy+Math.sin(a)*d;shards.push([[px,py],[px+s,py+r()*s],[px+r()*s,py+s]])}
  return{rays,rings,shards,cx,cy};
}
function holeSpec(h,model){if(h.part==='batbr'&&MODELS[model].batHead==='Y')return{head:'Y',len:1.1};return{head:h.head,len:h.len}}

function newPhone(job){
  const m=MODELS[job.model];
  const P={uid:uid(),job,model:job.model,open:false,openT:0,heat:0,hot:0,t:0,boot:0,
    sc:{},conn:{},connA:{},brA:{scr:1,bat:1,cam:1},part:{},faults:job.faults.map(k=>({k,paid:true})),
    spots:job.spots.map(s=>({x:s[0],y:s[1],left:1})),lint:job.faults.includes('lint')?1:0,
    segs:Object.fromEntries(SIDES.map(s=>[s,Array(NSEG[s]).fill(0)])),gap:false,cup:false,cupT:0,snag:false,tore:false,alc:false,gasket:false,opened:false,
    grime:1,dust:1,smudge:Array.from({length:6},(_,i)=>{const r=rngOf(job.crack+i*31);return[14+r()*72,24+r()*150,4+r()*4,6+r()*4,r()*3]}),
    known:{},meas:{},notes:[],tested:false,portSuspect:false,caused:0,cracks:null,gone:false,said:{}};
  for(const h of HOLES)P.sc[h.id]=h.part==='case'&&!m.caseScrews?null:Object.assign(holeSpec(h,job.model),{from:P.uid+':'+h.id});
  for(const c of CONN_IDS){P.conn[c]=true;P.connA[c]=1}
  for(const t of PART_IDS)P.part[t]={model:job.model,bad:null,orig:true};
  for(const k of job.faults){const p=FAULTS[k].part;if(p)P.part[p].bad=k}
  if(P.part.screen.bad==='crack'){P.cracks=makeCracks(job.crack);P.known.crack=1}
  if(P.part.battery.bad==='swollen'){P.known.swollen=1;P.gap=true;for(const s of SIDES)P.segs[s].fill(.5)}
  return P;
}

// ═══════════════════════ rules ═══════════════════════
function swollen(){const b=cur.part.battery;return !!(b&&b.bad==='swollen')}
function hostOf(h){const P=cur;if(h.part==='case')return MODELS[P.model].caseScrews;if(h.part==='batbr'||h.part==='scrbr')return !!P.part.board;return !!P.part[h.part]}
function screwShown(h){const P=cur;if(h.part==='case')return hostOf(h)&&!P.open&&P.openT<.05;return P.open&&P.openT>.95&&hostOf(h)}
function correct(id){const s=cur.sc[id],sp=holeSpec(HOLE[id],cur.model);return !!s&&Math.abs(s.len-sp.len)<=.31}
function powered(){const P=cur;return !!(P.part.battery&&P.part.board&&P.conn.bat)}
function waterOK(){const P=cur,b=P.part.board;return !P.job.faults.includes('water')||!!(b&&(!b.orig||P.spots.every(s=>s.left<=0)))}
function isFixed(f){
  const P=cur;
  if(f.k==='water')return !!P.part.board&&waterOK();
  if(f.k==='lint')return P.lint<=0;
  const p=P.part[FAULTS[f.k].part];return !!p&&!p.bad;
}
const unfixed=()=>cur.faults.filter(f=>!isFixed(f));
function works(){
  const P=cur,p=P.part,c=P.conn;
  const power=powered()&&!p.board.bad&&waterOK();
  return{power,
    display:power&&!!p.screen&&c.scr&&p.screen.bad!=='backlight',
    touch:power&&!!p.screen&&c.tch&&p.screen.bad!=='touch'&&p.screen.bad!=='crack',
    glass:!!p.screen&&p.screen.bad!=='crack',
    battery:power&&!p.battery.bad,
    charging:power&&!!p.port&&c.port&&!p.port.bad&&P.lint<=0,
    speaker:power&&!!p.speaker&&!p.speaker.bad,
    camera:power&&!!p.camera&&c.cam&&!p.camera.bad};
}
function missingScrews(){return HOLES.filter(h=>hostOf(h)&&!correct(h.id)).length}
function addFault(k){
  const P=cur,t=FAULTS[k].part;
  if(t&&(!P.part[t]||P.part[t].bad))return false;
  if(t)P.part[t].bad=k;
  P.faults.push({k,paid:false});P.known[k]=1;P.caused++;
  return true;
}
function partCost(t,model){
  const base=t==='gasket'?3:t==='kit'?6:PARTS[t].cost*MODELS[model].mult;
  return Math.max(1,Math.round(base*(upg('bulk')&&t!=='kit'&&t!=='gasket'?.75:1)));
}
const canAfford=c=>C.cash-c>=CREDIT;
function once(key,txt,kind){const P=cur;if(P.said[key])return;P.said[key]=1;msg(txt,kind)}

// every action returns true when it did something. `quiet` skips the effects (bot / tests).
let quiet=false;
function toggleScrew(id){
  const P=cur,h=HOLE[id];if(!h||!hostOf(h)||(!screwShown(h)&&!quiet))return false;
  const s=P.sc[id];
  if(s){
    if(C.bit!==s.head){msg('The '+bitName(C.bit)+' bit just cams out of that head.');sfx('err');return false}
    P.sc[id]=null;
    if(!quiet&&!upg('mat')&&Math.random()<.1)spawnRoll(h.x,h.y,s);
    else C.tray.push(s);
    if(!quiet)ANIM_S.push({id,x:h.x,y:h.y,s,dir:'out',t:0});
    sfx('screw');
  }else{
    let t=null;
    if(upg('mat'))t=C.tray.find(x=>x.from===P.uid+':'+id);
    if(!t&&SELSCREW)t=C.tray.find(x=>skey(x)===SELSCREW);
    if(!t){msg(C.tray.length?'No screw picked up from the tray.':'The screw tray is empty.');sfx('err');return false}
    if(C.bit!==t.head){msg('The '+bitName(C.bit)+' bit doesn\'t fit that screw.');sfx('err');return false}
    C.tray.splice(C.tray.indexOf(t),1);P.sc[id]=t;
    if(!quiet)ANIM_S.push({id,x:h.x,y:h.y,s:t,dir:'in',t:0});
    if(SELSCREW&&!C.tray.some(x=>skey(x)===SELSCREW))SELSCREW=null;
    const sp=holeSpec(h,P.model);
    if(t.len>sp.len+.31&&BOARD_HOLE(h)&&P.part.board){
      if(addFault('board')){fx('spark',h.x,h.y);msg('Crunch. The screw kept turning long after it should have stopped.','bad');sfx('crack')}
    }else if(Math.abs(t.len-sp.len)>.31&&!quiet)msg(t.len>sp.len?'It won\'t sit flush.':'It spins but never tightens.');
    sfx('screw');
  }
  UI();return true;
}
const bitName=b=>(BITS.find(x=>x[0]===b)||['','?'])[1];
function heatTick(dt){
  const P=cur;if(P.open)return;
  const cap=upg('gun')?96:140;
  P.heat=Math.min(cap,P.heat+dt*(upg('gun')?80:42)+dt*8);
  if(P.heat>100){P.hot+=dt;if(P.hot>1.2&&addFault('battery')){P.hot=0;fx('smoke',50,110);msg('A sharp chemical smell comes off the phone.','bad');sfx('err')}}
  P.heatHeld=.15;
}
const tempC=h=>Math.round(22+h*.75);
function suctionDone(){
  const P=cur;if(P.open||P.cup)return false;
  if(HOLES.some(h=>h.part==='case'&&hostOf(h)&&P.sc[h.id])){msg('The glass won\'t lift — something holds the bottom edge.');sfx('err');return false}
  if(!P.gap&&P.heat<40){msg('The cup pops off with a thwack. The glue is holding firm.');sfx('err');return false}
  P.gap=true;P.cup=true;sfx('pop');UI();return true;
}
function cutAt(l,dist){
  const P=cur;if(P.open)return;
  const d={bottom:Math.abs(l.y-200),top:Math.abs(l.y),left:Math.abs(l.x),right:Math.abs(l.x-100)};
  let side=null,best=11;for(const s of SIDES)if(d[s]<best){best=d[s];side=s}
  if(!side)return;
  if(!P.gap){once('nogap','The pick can\'t get under the glass.');return}
  const horiz=side==='bottom'||side==='top';
  const i=horiz?clamp(Math.floor((l.x-10)/20),0,3):clamp(Math.floor((l.y-14)/21.5),0,7);
  const k=(P.heat>=45?1:.3)*MODELS[P.model].glue/14;
  P.segs[side][i]=Math.min(1,P.segs[side][i]+dist*k);
  if(side==='right'&&i<=2){
    const v=P.segs.right[i];
    if(v>.15&&!P.snag){P.snag=true;msg('The pick snags on something soft.')}
    if(v>.42&&!P.tore){P.tore=true;if(addFault('touch')){msg('Something under the glass gave way with a tiny rip.','bad');sfx('crack')}}
  }
}
function openUp(){
  const P=cur;if(P.open)return false;
  if(HOLES.some(h=>h.part==='case'&&hostOf(h)&&P.sc[h.id])){msg('It won\'t budge.');sfx('err');return false}
  const req=['bottom','left','top'],mins=req.map(s=>Math.min(...P.segs[s]));
  if(mins.every(v=>v>=.9)){doOpen();return true}
  if(!P.gap){msg('It won\'t budge.');sfx('err');return false}
  const w=req[mins.indexOf(Math.min(...mins))];
  if(Math.random()<.5){
    if(!P.cracks)P.cracks=makeCracks(Date.now()%1e6,w==='left'?8:50,w==='top'?12:w==='left'?100:186);
    if(addFault('crack')){msg('💥 The glass flexed too far and cracked.','bad');sfx('crack')}
    doOpen();return true;
  }
  msg('It won\'t come apart.');sfx('err');return false;
}
function doOpen(){const P=cur;P.open=true;P.opened=true;P.cup=false;P.heat=0;P.hot=0;P.gasket=false;if(P.job.faults.includes('water'))P.known.water=1;sfx('pop');UI()}
function closeUp(){
  const P=cur;if(!P.open)return false;
  if(!P.part.screen){msg('There\'s no screen to close.');sfx('err');return false}
  P.open=false;P.cup=false;
  if(P.gasket){for(const s of SIDES)P.segs[s].fill(0);P.gap=false}else{for(const s of SIDES)P.segs[s].fill(1);P.gap=true}
  sfx('pop');UI();return true;
}
function zap(k,x,y){
  fx('spark',x,y);sfx('spark');
  addFault(k);
  msg('⚡ A spark jumped off the board.','bad');
}
function toggleConn(id){
  const P=cur,c=CONNS[id];if(!P.open||!P.part.board||!c)return false;
  if(c.br.some(s=>P.sc[s])){msg('There\'s a metal bracket over it.');sfx('err');return false}
  if(!P.part[c.part]){msg('Nothing to plug in there.');return false}
  if(id!=='bat'&&powered())zap(c.zap,c.r[0]+c.r[2]/2,c.r[1]+4);
  P.conn[id]=!P.conn[id];
  sfx('click');UI();return true;
}
function measure(t){
  const P=cur,p=P.part[t];
  if(!P.open&&t!=='port'){msg('The probes can\'t reach anything through the glass.');return false}
  if(!p){msg('Nothing there to probe.');return false}
  const b=p.bad,m=MODELS[p.model];let txt;
  if(t==='battery')txt=b==='swollen'?'BATT  3.62 V · cell 6.1 mm thick (new: 4.5)':b?'BATT  3.71 V · '+Math.round(m.mah*.55)+' / '+m.mah+' mAh':'BATT  4.02 V · '+Math.round(m.mah*.97)+' / '+m.mah+' mAh';
  else if(t==='screen')txt='DISP  backlight '+(b==='backlight'?'0.0':'18.4')+' V · touch IC '+(b==='touch'?'no reply':'replies');
  else if(t==='port'){if(b)txt='PORT  VBUS 0.00 V · pins open';else if(P.lint>0){txt='PORT  VBUS 5.0 V · 0.00 A · plug seats 70%';P.known.lint=1}else txt='PORT  VBUS 5.0 V · 1.42 A draw'}
  else if(t==='speaker')txt='SPKR  coil '+(b?'∞ Ω (open)':'7.9 Ω');
  else if(t==='camera')txt='CAM   VCM '+(b?'0 mA · focus stuck 0%':'98 mA · focus sweep 0→100%');
  else if(t==='board'){if(b)txt='MAIN  VDD 0.02 V · 2.9 A to ground';else if(!waterOK())txt='MAIN  VDD 3.81 V · 380 mA idle';else txt='MAIN  VDD 3.84 V · 42 mA idle'}
  if(b)P.known[b]=1;
  P.meas[t]=1;
  P.notes=P.notes.filter(n=>n.t!==t);P.notes.push({t,txt});

// ═══════════════════════ repair planner — drives the self-tests and the day-1 tutorial text ═══════════════════════
function advise(){
  const P=cur;if(!P||P.gone)return null;
  const A=(txt,act)=>({txt,act});
  const un=unfixed(),kn=un.filter(f=>P.known[f.k]),unk=un.filter(f=>!P.known[f.k]);
  const out=id=>A('unscrew '+id,{k:'screw',id});
  const caseIds=MODELS[P.model].caseScrews?['b1','b2']:[];
  if(!P.open){
    if(P.openT>.05)return null;
    if(!P.tested&&powered())return A('test',{k:'test'});
    if(un.some(f=>f.k==='lint')&&P.known.lint)return A('brush port',{k:'brush',i:-1});
    if(unk.length&&P.portSuspect&&!P.meas.port)return A('meter port',{k:'meter',part:'port'});
    if(!un.length){for(const id of caseIds)if(!correct(id))return P.sc[id]?out(id):screwIn(id);return A('hand back',{k:'handback'})}
    for(const id of caseIds)if(P.sc[id])return out(id);
    const req=['bottom','left','top'];
    if(req.every(s=>Math.min(...P.segs[s])>=.9))return A('open',{k:'open'});
    if(!P.gap){if(P.heat<55)return A('heat',{k:'heat'});return A('suction',{k:'suction'})}
    for(const s of req)if(Math.min(...P.segs[s])<.9)return A('cut '+s,{k:'cut',side:s});
    return A('open',{k:'open'});
  }
  if(P.openT<.95)return null;
  if(unk.length)for(const t of['board','battery','port','speaker','camera','screen'])if(P.part[t]&&!P.meas[t])return A('meter '+t,{k:'meter',part:t});
  const work=kn.slice().sort((a,b)=>(b.k==='board')-(a.k==='board'));
  if(work.length){
    if(P.conn.bat&&work.some(f=>FAULTS[f.k].part))return unplug('bat');
    for(const f of work){
      if(f.k==='lint')return A('brush port',{k:'brush',i:-1});
      if(f.k==='water'){const i=P.spots.findIndex(s=>s.left>0);if(i>=0&&P.part.board&&P.part.board.orig)return A('scrub',{k:'brush',i});continue}
      const t=FAULTS[f.k].part,p=P.part[t];
      if(p&&p.bad){
        const rm=t==='board'&&P.part.camera?'camera':t;
        const cs=rm==='board'?CONN_IDS:CONN_IDS.filter(c=>CONNS[c].part===rm);
        for(const c of cs)if(P.conn[c])return unplug(c);
        for(const h of HOLES)if(h.part===rm&&P.sc[h.id])return out(h.id);
        if(rm==='battery'&&!MODELS[P.model].tabs&&!P.alc)return A('alcohol',{k:'brush',i:-2});
        return A('remove '+rm,{k:'remove',part:rm});
      }
      if(!p)return installStep(t);
    }
  }
  for(const t of['board','battery','camera','port','speaker','screen'])if(!P.part[t])return installStep(t);
  for(const c of CONN_IDS)if(P.part[CONNS[c].part]&&!P.conn[c]){for(const id of CONNS[c].br)if(P.sc[id])return out(id);return A('plug '+c,{k:'conn',id:c})}
  for(const h of HOLES)if(h.part!=='case'&&hostOf(h)&&!correct(h.id))return P.sc[h.id]?out(h.id):screwIn(h.id);
  if(!P.gasket)return C.inv.some(i=>i.type==='gasket'&&i.model===P.model)?A('gasket',{k:'gasket'}):A('buy gasket',{k:'buy',part:'gasket'});
  return A('close',{k:'close'});
}
function unplug(c){const P=cur;for(const id of CONNS[c].br)if(P.sc[id])return{txt:'unscrew',act:{k:'screw',id}};return{txt:'unplug '+c,act:{k:'conn',id:c}}}
function screwIn(id){const sp=holeSpec(HOLE[id],cur.model);return C.tray.some(t=>t.head===sp.head&&Math.abs(t.len-sp.len)<.01)?{txt:'screw '+id,act:{k:'screw',id}}:{txt:'kit',act:{k:'buy',part:'kit'}}}
function installStep(t){
  const P=cur,has=C.inv.find(i=>i.type===t&&i.model===P.model&&!i.bad);
  return has?{txt:'install '+t,act:{k:'install',part:t}}:{txt:'buy '+t,act:{k:'buy',part:t}};
}
function doAct(a){
  const P=cur;quiet=true;let ok=true;
  try{switch(a.k){
    case'screw':{const s=P.sc[a.id];if(s)C.bit=s.head;else{const sp=holeSpec(HOLE[a.id],P.model),t=C.tray.find(x=>x.head===sp.head&&Math.abs(x.len-sp.len)<.01);if(t){SELSCREW=skey(t);C.bit=t.head}}ok=toggleScrew(a.id);break}
    case'heat':for(let i=0;i<40&&P.heat<65;i++)heatTick(.1);break;
    case'suction':ok=suctionDone();break;
    case'cut':P.segs[a.side].fill(1);break;
    case'open':ok=openUp();P.openT=1;break;
    case'close':ok=closeUp();P.openT=0;break;
    case'conn':ok=toggleConn(a.id);break;
    case'meter':ok=measure(a.part);break;
    case'remove':ok=removePart(a.part,false);break;
    case'install':ok=installPart(a.part);break;
    case'gasket':ok=applyGasket();break;
    case'buy':ok=buy(a.part,P.model);break;
    case'brush':ok=brushDone(a.i);break;
    case'test':runTest();break;
    case'handback':return handBack();
  }}finally{quiet=false}
  return ok;
}

  const P=cur,rd=P&&P.read&&P.read.life>0?P.read.txt:'';
  const key=r.join(',')+'@'+DPR+'|'+(name==='meter'?rd:JSON.stringify(trayGroups())+SELSCREW+upg('mat'));
  let c=PROPC[name];
  if(!c||c.key!==key){
    const pad=24,cv2=c&&c.cv||document.createElement('canvas');cv2.width=Math.ceil((r[2]+pad*2)*DPR);cv2.height=Math.ceil((r[3]+pad*2)*DPR);
    const g=cv2.getContext('2d');g.setTransform(DPR,0,0,DPR,(pad-r[0])*DPR,(pad-r[1])*DPR);
    const pX=X,pS=XS;X=g;XS=DPR;let out;try{out=fn(r)}finally{X=pX;XS=pS}
    c=PROPC[name]={key,cv:cv2,pad,out,hit:name==='tray'?TRAY_HIT.slice():null};
  }
  if(name==='tray')TRAY_HIT=c.hit;
  X.drawImage(c.cv,r[0]-c.pad,r[1]-c.pad,r[2]+c.pad*2,r[3]+c.pad*2);
  return c.out;
}

    const j=jacks[k];X.strokeStyle=col;X.lineWidth=2.4;X.lineCap='round';X.beginPath();X.moveTo(j[0],j[1]);
    if(tgt&&a>0){const ex=tgt.x+tip[0],ey=tgt.y+tip[1];X.bezierCurveTo(j[0],j[1]+80,ex-60,ey+60,ex,ey);X.globalAlpha=a;X.stroke();X.globalAlpha=1;
      X.save();X.translate(ex,ey);X.rotate(-.5);X.globalAlpha=a;box(-2.5,0,5,26,2.2,col);box(-.8,-6,1.6,6,.6,'#d9dee4');X.restore()}

function drawTray(r){

  path(x+1,y+1,w-2,h-2,11);stroke('rgba(255,255,255,.08)',1);

function render(){
  X=ctx;XS=DPR;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(benchCanvas(),0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  let jacks=null;
  if(PROPS&&(cur||mode==='title')){const pr=propRects();jacks=cachedProp('meter',pr.meter,drawMeter);cachedProp('tray',pr.tray,drawTray)}else TRAY_HIT=[];
  if(cur)drawPhone();
  else if(mode==='title'||mode==='mphome'||mode==='lobby')drawShowcase();
  X=ctx;XS=DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  if(cur){
    // particles + rolling screws, in phone space
    ctx.setTransform(DPR*U,0,0,DPR*U,DPR*OX,DPR*OY);XS=U*DPR;
    for(const f of FX){const a=Math.max(0,f.life/f.max);
      if(f.kind==='spark'){X.globalCompositeOperation='lighter';X.strokeStyle='rgba(255,'+(190+f.r*65|0)+','+(80+f.r*80|0)+','+a+')';X.lineWidth=.6;X.beginPath();X.moveTo(f.x,f.y);X.lineTo(f.x-f.vx*.05,f.y-f.vy*.05);X.stroke();X.globalCompositeOperation='source-over'}
      else if(f.kind==='flash'){X.globalCompositeOperation='lighter';circ(f.x,f.y,14*(1-a)+4,'rgba(255,230,160,'+a*.8+')');X.globalCompositeOperation='source-over'}
      else if(f.kind==='smoke'){circ(f.x,f.y,3+(1-a)*12,'rgba(140,140,140,'+a*.28+')')}
      else{X.fillStyle='rgba(225,230,236,'+a+')';X.fillRect(f.x,f.y,.6+f.r*.6,.6+f.r*.6)}}
    for(const r of ROLL)drawScrewHead(r.x,r.y,r.s,true,r.rot);
    X=ctx;XS=DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    if(jacks)drawProbes(jacks);
    const sx=x=>OX+x*U,sy=y=>OY+y*U,P=cur;
    if(!PROPS&&P.read&&P.read.life>0){
      ctx.font='600 12.5px "JetBrains Mono",ui-monospace,monospace';const tw=ctx.measureText(P.read.txt).width+20;
      const x=clamp(sx(P.read.x)-tw/2,6,W-tw-6),y=Math.max(6,sy(P.read.y)-36);
      ctx.globalAlpha=Math.min(1,P.read.life*2);box(x,y,tw,26,6,'#0b1a12');path(x,y,tw,26,6);stroke('#2c6b4a',1);
      ctx.fillStyle='#7dffb2';ctx.textAlign='left';ctx.fillText(P.read.txt,x+10,y+17.5);ctx.globalAlpha=1;
    }
    if(!P.open&&P.openT<.05&&(P.heat>1||TOOL==='heat')){
      const gx=Math.min(W-34,sx(100)+18),gy=sy(30),gh=Math.max(90,140*U*.6);
      box(gx-3,gy-3,20,gh+6,10,'rgba(10,14,20,.85)');box(gx+3,gy+2,8,gh-4,4,'#0b0f14');
      const v=clamp(P.heat,0,140)/140;box(gx+4,gy+gh-2-(gh-6)*v,6,Math.max(1,(gh-6)*v),3,lg(0,gy+gh,0,gy,'#ffd06b','#ff4d2e'));
      circ(gx+7,gy+gh+7,6,P.heat>2?'#ff6a3a':'#3a3f46');
      T(tempC(P.heat)+'°C',gx+7,gy+gh+26,11,'#cfe3f5',700);
    }
    for(const f of FLOAT){ctx.globalAlpha=Math.min(1,f.life);T(f.txt,sx(f.x),sy(f.y)-(1.6-f.life)*30,22,f.col,800)}ctx.globalAlpha=1;
    drawCursorTool();

  const want=playing()&&FINE?(TOOL==='hand'?(PTR.down?'grabbing':'grab'):'none'):'default';
  if(cv.style.cursor!==want)cv.style.cursor=want;

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;ac();
  if(b.dataset.tool){if(b.dataset.tool==='driver'&&TOOL==='driver')cycleBit();else setTool(b.dataset.tool);return}
  if(b.id==='bTest'){testBtn();return}
  if(b.id==='bMain'){handBackBtn();return}
  if(b.dataset.bit){C.bit=b.dataset.bit;setTool('driver');renderToolLabels();UI();return}
  if(b.dataset.scr){SELSCREW=SELSCREW===b.dataset.scr?null:b.dataset.scr;if(SELSCREW)setTool('driver');UI();return}
  if(b.dataset.inv){const id=+b.dataset.inv,it=C.inv.find(i=>i.id===id);
    if(it&&it.type==='gasket'&&playing()&&cur.open){applyGasket(it);return}
    SEL=SEL===id?null:id;if(SEL)setTool('hand');UI();return}
  if(b.dataset.tab){TAB=b.dataset.tab;UI();return}
  if(b.dataset.buy){if(playing())buy(b.dataset.buy,b.dataset.model||cur.model);return}
  if(b.hasAttribute('data-close')){hideSheet();return}
  if(b.dataset.upg){const u=UPG.find(x=>x.id===b.dataset.upg);if(u&&!S.upg[u.id]&&S.cash>=u.cost){S.cash-=u.cost;S.upg[u.id]=1;save();sfx('cash');showDayEnd()}return}
  if(b.id==='tutSkip'){S.tutOff=true;save();renderTut();return}
  if(b.id==='bSnd'){S.sound=!S.sound;save();renderTop();return}
  if(b.id==='bHelp'||b.id==='howBtn'){showHelp();return}
  if(b.id==='playBtn'){$('titleOv').classList.remove('on');startDay();return}
  if(b.id==='newBtn'){if(confirm('Close your shop and start over from day 1?')){const keep={name:S.name,hue:S.hue,sound:S.sound};S=Object.assign(fresh(),keep);C=S;save();$('titleOv').classList.remove('on');startDay()}return}
  if(b.id==='raceBtn'){$('titleOv').classList.remove('on');mpHome('');return}
  if(b.id==='nextJob'){hideSheet();nextJob();return}
  if(b.id==='nextDay'){hideSheet();S.day++;S.jobIdx=0;S.dayEarn=0;S.daySpend=0;save();startDay();return}
  if(b.id==='toTitle'){hideSheet();goTitle();return}
});

function goTitle(){

// ═══════════════════════ frame: update ═══════════════════════
let last=performance.now(),TIME=0;
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;TIME+=dt;
  try{step(dt);if(!W)layout();geom();render()}catch(e){console.error(e)}
  requestAnimationFrame(frame);
}
function step(dt){
  if(cur){
    const P=cur;
    P.openT=P.flipHold!=null?P.flipHold:clamp(P.openT+(P.open?dt:-dt)*1.9,0,1);
    if(P.heatHeld>0)P.heatHeld-=dt;else P.heat=Math.max(0,P.heat-dt*6);
    if(P.heat<=100)P.hot=Math.max(0,P.hot-dt*.5);
    if(P.boot>0)P.boot=Math.max(0,P.boot-dt);
    if(P.read)P.read.life-=dt;
    P.cupT=clamp(P.cupT+(P.cup?dt:-dt)*5,0,1);
    for(const c of CONN_IDS){const tgt=P.conn[c]?1:0;P.connA[c]+=clamp(tgt-P.connA[c],-dt*7,dt*7)}
    for(const k of Object.keys(BRK)){const tgt=BRK[k].sc.some(s=>P.sc[s])?1:0;P.brA[k]+=clamp(tgt-P.brA[k],-dt*6,dt*6)}
    if(playing()&&!$('sheetOv').classList.contains('on'))P.t+=dt;
    holdTick(dt);
  }
  for(const a of ANIM_S)a.t+=dt;ANIM_S=ANIM_S.filter(a=>a.t<.45);
  for(const a of ANIM_P)a.k+=dt/(a.dir==='out'?.5:.32);ANIM_P=ANIM_P.filter(a=>a.k<1);
  for(const f of FX){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.kind==='spark'?90:f.kind==='smoke'?-4:0)*dt;f.vx*=.98;f.life-=dt}FX=FX.filter(f=>f.life>0);
  for(const r of ROLL){r.x+=r.vx*dt;r.y+=r.vy*dt;r.vy*=.96;r.rot+=r.vx*dt*.3;r.life-=dt;if(r.life<=0)msg('🔩 The screw is gone — somewhere under the bench.')}ROLL=ROLL.filter(r=>r.life>0);
  for(const f of FLOAT)f.life-=dt;FLOAT=FLOAT.filter(f=>f.life>0);
  if(uiDirty){uiDirty=false;renderSide();renderTop()}
  renderTools();if(Math.floor(TIME*6)!==Math.floor((TIME-dt)*6))renderTut();
  if(cur&&playing()){const f=Math.max(0,1-cur.t/patience()),pb=$('patBar');if(pb){pb.style.width=(f*100)+'%';pb.style.background=f>.5?'#3ddc84':f>.2?'#ffd23f':'#ff4d5e';$('patTxt').textContent=f>.5?'😊 waiting':f>.2?'😐 checking the time':f>0?'😠 getting annoyed':'😤 fed up'}}
  if(mode==='race'&&Math.floor(TIME*2)!==Math.floor((TIME-dt)*2))renderTop();
}

// ═══════════════════════ multiplayer: Repair Race ═══════════════════════
// 2-8 players through the arcade's room relay. The host's browser runs the match (HS):
// everyone gets the same queue of broken phones from the host's seed and works through
// it on their own bench. Cash at the end wins; first three to finish get a bonus.
//   guest → host  {t:'hi',cid,name,hue} {t:'hb',cid} {t:'pr',cid,i,cash,fin} {t:'bye',cid}
//   host  → all   {t:'st',ph:lobby|race|results,h,seed,lvl,n,pro,end,pl:[[cid,name,hue,i,cash,fin]]}
const MAXP=8,GONE=15000,FIN_BONUS=[60,30,15],START_CASH=120;
const CODE_A='ABCDEFGHJKMNPQRSTUVWXYZ';
const rcode=n=>Array.from({length:n},()=>CODE_A[Math.floor(Math.random()*CODE_A.length)]).join('');
const MY=rcode(8);
const NET={mode:'off',ws:null,code:'',st:null,lastHost:0,lastHb:0,lastPr:0};
let HS=null;
function wsURL(room,role){const b=window.GLITCHBOX_WS&&!/PLACEHOLDER/i.test(window.GLITCHBOX_WS)?window.GLITCHBOX_WS:(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws';return b+'?room='+encodeURIComponent(room)+'&role='+role}
function netConnect(room,role){
  netClose();NET.code=room;NET.mode=role;NET.lastHost=Date.now();
  let ws;try{ws=new WebSocket(wsURL(room,role))}catch(e){mpHome('Couldn\'t reach the game server.');return}
  NET.ws=ws;
  ws.onopen=()=>ws.send(JSON.stringify(role==='host'?{t:'create',code:room,max:MAXP}:{t:'join',code:room}));
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onNet(m)};
  ws.onclose=()=>{if(NET.ws===ws){NET.ws=null;if(NET.mode!=='off')mpLost('Lost the connection to the game.')}};
}
function netSend(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o))}
function netClose(){const w=NET.ws;NET.ws=null;if(w){w.onclose=null;try{w.close()}catch(e){}}}
const myName=()=>(S.name||'Tech').slice(0,12);
function toHost(m){if(NET.mode==='host')hostIn(m);else netSend(m)}
function onNet(m){
  if(m.t==='created'){HS={ph:'lobby',players:[],seed:0,lvl:3,n:5,pro:false,end:0,finN:0,seen:{}};hostIn({t:'hi',cid:MY,name:myName(),hue:S.hue});return}
  if(m.t==='joined'||m.t==='start'){if(NET.mode==='guest')netSend({t:'hi',cid:MY,name:myName(),hue:S.hue});return}
  if(m.t==='error'){const t=m.msg||'That didn\'t work.';netClose();NET.mode='off';mpHome(t==='No game with that code.'?'No room with that code — check the letters.':t);return}
  if(m.t==='left')return;
  if(NET.mode==='host'){hostIn(m);return}
  if(m.to&&m.to!==MY)return;
  if(m.t==='st')clientState(m);
  else if(m.t==='full'){netClose();NET.mode='off';mpHome('That room is full (8 players).')}
}
// ── host ──
const HP=cid=>HS.players.find(p=>p.cid===cid);
function hostIn(m){
  if(!HS)return;
  if(m.cid)HS.seen[m.cid]=Date.now();
  if(m.t==='hi'){
    const p=HP(m.cid);
    if(p){p.name=String(m.name||p.name).slice(0,12);p.hue=+m.hue||0}
    else{if(HS.players.length>=MAXP){netSend({t:'full',to:m.cid});return}
      HS.players.push({cid:m.cid,name:String(m.name||'Tech').slice(0,12),hue:+m.hue||0,i:0,cash:START_CASH,fin:0})}
    hostPush();
  }else if(m.t==='pr'){
    const p=HP(m.cid);if(!p||HS.ph!=='race')return;
    p.i=clamp(m.i|0,0,HS.n);p.cash=clamp(Math.round(+m.cash||0),-9999,99999);
    if(m.fin&&!p.fin)p.fin=++HS.finN;
    if(HS.players.every(q=>q.fin))HS.ph='results';
    hostPush();
  }else if(m.t==='bye')hostDrop(m.cid);
}
function hostDrop(cid){if(cid===MY)return;HS.players=HS.players.filter(p=>p.cid!==cid);if(HS.ph==='race'&&HS.players.length&&HS.players.every(q=>q.fin))HS.ph='results';hostPush()}
function hostStart(){
  if(!HS||HS.players.length<2)return false;
  HS.seed=1+Math.floor(Math.random()*1e6);HS.ph='race';HS.finN=0;HS.end=Date.now()+HS.n*240000;
  HS.players.forEach(p=>{p.i=0;p.cash=START_CASH;p.fin=0});
  hostPush();return true;
}
function hostTick(){
  if(NET.mode!=='host'||!HS)return;
  const now=Date.now();
  for(const p of HS.players.slice())if(p.cid!==MY&&now-(HS.seen[p.cid]||now)>GONE)hostDrop(p.cid);
  if(HS.ph==='race'&&now>HS.end){HS.ph='results';hostPush()}
  if(now-(HS.lastPush||0)>1500)hostPush();
}
function hostPush(){
  HS.lastPush=Date.now();
  const st={t:'st',ph:HS.ph,h:MY,seed:HS.seed,lvl:HS.lvl,n:HS.n,pro:HS.pro,end:HS.end,pl:HS.players.map(p=>[p.cid,p.name,p.hue,p.i,p.cash,p.fin])};
  netSend(st);clientState(st);
}
// ── everyone ──
const PL=a=>({cid:a[0],name:a[1],hue:a[2],i:a[3],cash:a[4],fin:a[5]});
const scoreOf=p=>p.cash+(p.fin&&p.fin<=3?FIN_BONUS[p.fin-1]:0);
function raceClock(){const st=NET.st;if(!st||!st.end)return'';const s=Math.max(0,Math.ceil((st.end-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function clientState(m){
  NET.st=m;NET.lastHost=Date.now();
  const pl=m.pl.map(PL),me=pl.find(p=>p.cid===MY);
  if(m.ph==='lobby'){if(mode!=='lobby'){mpReset();mode='lobby'}renderLobby();return}
  if(!me)return;
  if(m.ph==='race'){if(!RACE||RACE.seed!==m.seed)startRace(m);else if(mode==='wait')renderWait()}
  else if(m.ph==='results')showResults();
  renderChips();
}
function startRace(m){
  hideSheet();$('mpOv').classList.remove('on');$('titleOv').classList.remove('on');
  RACE={seed:m.seed,jobs:jobsFor(m.seed,m.lvl,m.n),i:0,fin:false};
  C={cash:START_CASH,upg:m.pro?Object.fromEntries(UPG.map(u=>[u.id,1])):{},inv:[],tray:[],bit:'PH'};
  mode='race';raceNext(true);
  msg('🏁 '+m.n+' phones, the same ones for everyone. Most cash wins.');
}
function raceNext(first){
  if(!first)RACE.i++;
  if(RACE.i>=RACE.jobs.length){RACE.fin=true;cur=null;mode='wait';sendPr();renderWait();return}
  cur=newPhone(RACE.jobs[RACE.i]);resetBench();
  mode='race';UI();renderTop();sendPr();
}
function sendPr(){NET.lastPr=Date.now();toHost({t:'pr',cid:MY,i:RACE?RACE.i:0,cash:C.cash,fin:RACE&&RACE.fin?1:0})}
function raceAfter(r){
  floatText('+'+money(r.total),50,90,r.good?'#3ddc84':'#ff9f3d');
  msg(cur.job.face+' “'+r.line+'” '+(r.total?'+':'')+money(r.total),r.good?'good':'bad');
  mode='sheet';
  setTimeout(()=>{if(RACE&&mode==='sheet')raceNext()},900);
}
function renderChips(){
  const st=NET.st,el=$('chips');
  if(!st||NET.mode==='off'||(mode!=='race'&&mode!=='sheet')||st.ph!=='race'){el.classList.remove('on');return}
  el.classList.add('on');
  el.innerHTML=st.pl.map(PL).sort((a,b)=>scoreOf(b)-scoreOf(a)).map(p=>`<div class="chip${p.cid===MY?' me':''}"><i style="background:hsl(${p.hue},70%,60%)"></i>${esc(p.name)} <b>${money(p.cash)}</b> ${p.fin?'🏁':'📱'+Math.min(p.i+1,st.n)+'/'+st.n}</div>`).join('');
}
function mpReset(){cur=null;RACE=null;C=S;hideSheet();$('chips').classList.remove('on');$('titleOv').classList.remove('on')}
function mpHome(err){
  mode='mphome';mpReset();
  $('mpCard').innerHTML=`<h2>👥 Repair Race</h2>
    <div class="sub" style="margin-top:0">Same broken phones for everyone. Most cash at the end wins.</div>
    <input class="in" id="myName" maxlength="12" placeholder="Your name" value="${esc(S.name||'')}">
    <button class="big" id="mkRoom">🏠 Make a room</button>
    <div class="or">— or join a friend —</div>
    <input class="in" id="joinCode" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
    <button class="big alt" id="joinRoom">🚪 Join</button>
    <div class="err" id="mpErr">${esc(err||'')}</div>

function readName(){const n=($('myName')&&$('myName').value||'').trim().slice(0,12);if(n){S.name=n;save()}return n}
const LVLS=[[1,'🟢 Easy'],[3,'🟡 Normal'],[5,'🔴 Hard']];
function renderLobby(){

  const pl=st.pl.map(PL),host=st.h===MY,need=Math.max(0,2-pl.length);

    :`<div class="sub">${st.n} phones · ${(LVLS.find(l=>l[0]===st.lvl)||LVLS[1])[1]}${st.pro?' · 🧰 Pro tools':''}<br>Waiting for ${esc((pl.find(p=>p.cid===st.h)||{}).name||'the host')} to start…</div>`}

function renderWait(){

function showResults(){

}
function mpLeave(){if(NET.mode==='guest')netSend({t:'bye',cid:MY});netClose();NET.mode='off';NET.st=null;HS=null;mpReset();$('mpOv').classList.remove('on');goTitle()}
function mpLost(t){netClose();NET.mode='off';NET.st=null;HS=null;mpHome(t)}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='mkRoom'){readName();netConnect(rcode(4),'host');$('mpErr').textContent='Making a room…'}

  else if(NET.mode==='host'&&HS&&HS.ph==='lobby'){
    if(t.dataset.n){HS.n=+t.dataset.n;hostPush()}
    else if(t.dataset.lvl){HS.lvl=+t.dataset.lvl;hostPush()}

setInterval(()=>{
  hostTick();
  const now=Date.now();
