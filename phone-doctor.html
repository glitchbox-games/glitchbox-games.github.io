<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Phone Doctor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="glitchbox-config.js"></script>
<script src="glitchbox-save.js" data-pos="top-left"></script>
<style>
:root{--bg:#10151c;--panel:#1b222c;--panel2:#232c38;--line:#2f3a48;--ink:#e6edf5;--dim:#8c9bb0;--cyan:#39d0ff;--green:#3ddc84;--orange:#ff9f3d;--red:#ff4d5e;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{height:100dvh;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 112px;background:#0b0f14;border-bottom:1px solid var(--line);min-height:50px}
#top .logo{font-weight:800;font-size:18px;letter-spacing:.5px;white-space:nowrap}
#top .logo b{color:var(--cyan)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:700;font-size:15px;white-space:nowrap}
.stat.cash{color:var(--green)}
#top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:18px}
.ib.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
#main{flex:1;min-height:0;display:grid;grid-template-columns:84px 1fr 310px}
#tools{display:flex;flex-direction:column;gap:6px;padding:8px 6px;background:#0d1218;border-right:1px solid var(--line);overflow:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 5px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:24px;line-height:1;position:relative}
.tool small{font-size:10.5px;color:var(--dim);font-weight:500}
.tool i{position:absolute;top:3px;right:6px;font-size:9px;font-style:normal;color:#5d6b7d}
.tool.on{background:#123447;border-color:var(--cyan)}
.tool.on small{color:var(--cyan)}
.tool.act{background:#173322;border-color:#2a6b45}
.tool.act small{color:#9ff0c2}
.tool:disabled{opacity:.35}
.glow{animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--cyan),0 0 18px var(--cyan)}}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4;width:min(92%,520px)}
.tst{background:rgba(12,17,24,.94);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:500;font-size:15px;text-align:center;animation:tin .25s ease-out;transition:opacity .4s}
.tst.bad{border-color:var(--red);color:#ffc4ca}.tst.good{border-color:var(--green);color:#c8ffe0}.tst.warn{border-color:var(--orange);color:#ffe0bf}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#chips{position:absolute;left:8px;right:8px;bottom:8px;display:none;gap:6px;flex-wrap:wrap;justify-content:center;z-index:3;pointer-events:none}
#chips.on{display:flex}
.chip{background:rgba(12,17,24,.9);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip.me{border-color:var(--cyan)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
#hintbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(18,52,71,.95);border:1px solid var(--cyan);border-radius:12px;padding:8px 14px;font-size:14.5px;max-width:min(94%,560px);text-align:center;z-index:3;display:none;pointer-events:none}
#hintbar.on{display:block}
#chips.on~#hintbar{bottom:48px}
#side{background:#0d1218;border-left:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.card h3{margin:0 0 6px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;align-items:center;justify-content:space-between}
#cust{display:flex;gap:10px;align-items:flex-start}
#cust .face{font-size:40px;line-height:1;width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
#cust .who{font-weight:700;font-size:16px}
#cust .mdl{display:inline-block;margin-top:2px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--cyan);font-weight:700}
.said{margin-top:8px;background:#f4f1ea;color:#1d2530;border-radius:12px;padding:8px 10px;font-size:14px;position:relative;line-height:1.35}
.said:before{content:'';position:absolute;top:-8px;left:20px;border:8px solid transparent;border-top:0;border-bottom-color:#f4f1ea}
.pat{margin-top:8px;height:8px;border-radius:9px;background:#0d1218;overflow:hidden}
.pat div{height:100%;background:var(--green);border-radius:9px;transition:background .3s}
.patl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:3px}
.notes{display:flex;flex-direction:column;gap:4px;font-size:13px}
.notes div{background:var(--panel2);border-radius:8px;padding:4px 8px}
.notes .x{color:#ffb0b8}.notes .ok{color:#a9f3c9}
.empty{color:var(--dim);font-size:13px}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.it{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12.5px;display:flex;gap:5px;align-items:center}
.it.sel{border-color:var(--cyan);background:#123447}
.it .old{color:var(--dim);font-size:11px}
.it .bad{color:var(--red)}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.tabs button.on{color:var(--ink);border-color:var(--cyan)}
.tabs button.cur{font-weight:700}
.row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.row span{flex:1}
.buy{background:#173322;border:1px solid #2a6b45;color:#9ff0c2;border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px}
.buy:disabled{opacity:.4}
.mat{display:flex;align-items:center;gap:8px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(5,8,12,.78);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.ov.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.box h1{margin:0;font-size:40px;font-weight:800;letter-spacing:1px}
.box h1 b{color:var(--cyan)}
.box h2{margin:0 0 8px;font-size:24px}
.box p,.sub{color:var(--dim);font-size:15px;line-height:1.45;margin:8px 0}
.big{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;background:var(--cyan);color:#06222e;font-weight:800;font-size:18px}
.big.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.big.gr{background:var(--green);color:#052615}
.big:disabled{opacity:.45}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0d1218;color:var(--ink);font:inherit;font-size:18px;text-align:center;margin-top:8px}
.code{font-size:46px;font-weight:800;letter-spacing:10px;color:var(--cyan);margin:6px 0}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.prow{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}
.prow.me{border-color:var(--cyan)}
.prow span{flex:1}
.prow i{width:12px;height:12px;border-radius:50%}
.opt{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.opt button{padding:7px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.opt button.on{border-color:var(--cyan);color:var(--cyan);font-weight:700}
.err{color:var(--red);min-height:20px;margin-top:6px;font-size:14px}
.or{color:var(--dim);margin:12px 0 0;font-size:13px}
.tl{text-align:left;display:flex;flex-direction:column;gap:6px;margin:12px 0}
.tl div{display:flex;justify-content:space-between;background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:15px}
.tl .f{color:#ffb0b8}.tl .p{color:#a9f3c9}
.upg{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin-top:10px}
.u{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px;font-size:13px}
.u b{display:block;font-size:14px;margin-bottom:2px}
.u .d{color:var(--dim);min-height:34px}
.u button{margin-top:6px;width:100%}
.u.own{border-color:#2a6b45;opacity:.75}
.stars{color:var(--gold);font-size:22px;letter-spacing:2px}
.how{text-align:left;font-size:14px;color:var(--dim);line-height:1.5}
.how b{color:var(--ink)}
@media (max-width:820px){
  #top{padding-left:104px;gap:6px}
  #top .logo{display:none}
  .stat{font-size:13px;padding:3px 7px}
  #main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto minmax(0,34vh)}
  #tools{flex-direction:row;order:2;border:0;border-top:1px solid var(--line);padding:6px;overflow-x:auto}
  .tool{min-width:54px;flex:1;font-size:21px}
  #stage{order:1}
  #side{order:3;border:0;border-top:1px solid var(--line);padding:8px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="logo">📱 PHONE <b>DOCTOR</b></div>
    <div class="stat" id="sDay">Day 1</div>
    <div class="stat cash" id="sCash">$0</div>
    <div class="stat" id="sRate">⭐ –</div>
    <div class="sp"></div>
    <button class="ib" id="bHint" title="Hints">💡</button>
    <button class="ib" id="bSnd" title="Sound">🔊</button>
    <button class="ib" id="bHelp" title="How to play">❓</button>
  </div>
  <div id="main">
    <div id="tools"></div>
    <div id="stage"><canvas id="cv"></canvas><div id="toast"></div><div id="chips"></div><div id="hintbar"></div></div>
    <div id="side"></div>
  </div>
</div>

<div class="ov on" id="titleOv"><div class="box">
  <div style="font-size:64px;line-height:1">📱🪛</div>
  <h1>PHONE <b>DOCTOR</b></h1>
  <p>Run a phone repair shop. Unscrew, heat, pry, meter, swap the bad part — and <b style="color:var(--orange)">never</b> touch anything with the battery still plugged in.</p>
  <button class="big" id="playBtn">🔧 Open the shop</button>
  <button class="big alt" id="raceBtn">👥 Repair Race (online)</button>
  <button class="big alt" id="newBtn" style="display:none">🗑️ Start a new shop</button>
  <button class="big alt" id="howBtn">❓ How to play</button>
</div></div>
<div class="ov" id="mpOv"><div class="box" id="mpCard"></div></div>
<div class="ov" id="sheetOv"><div class="box" id="sheet"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const HASH=location.hash.replace(/-debug$/,'');   // the terms gate lets *debug hashes through, so screenshots use #demoX-debug
let DEMO=false;

// ═══════════════════════ data ═══════════════════════
const MODELS={
  pear11:{name:'Pear 11',frame:'#d6dbe1',dark:'#9aa3ad',accent:'#7aa7ff',mult:1,cut:'notch'},
  galaxo:{name:'Galaxo S7',frame:'#3c74de',dark:'#1d4aa8',accent:'#8db4ff',mult:1.1,cut:'hole'},
  pixelle:{name:'Pixelle 5',frame:'#efe9df',dark:'#b9b1a3',accent:'#ff8a3d',mult:.9,cut:'hole'},
  pear14:{name:'Pear 14 Pro',frame:'#50555e',dark:'#2b2f36',accent:'#c49bff',mult:1.35,cut:'island'},
};
const MODEL_IDS=Object.keys(MODELS);
const PARTS={screen:{n:'Screen',e:'📺',cost:40},battery:{n:'Battery',e:'🔋',cost:18},port:{n:'Charge port',e:'🔌',cost:14},
  speaker:{n:'Speaker',e:'🔊',cost:10},camera:{n:'Camera',e:'📷',cost:26},board:{n:'Logic board',e:'🧠',cost:95}};
const PART_IDS=Object.keys(PARTS);
// g = exclusive group (one fault per group per phone). day = first day it shows up. pay = what the customer pays.
const FAULTS={
  crack:{part:'screen',g:'scr',pay:110,day:1,say:["I dropped it and the screen shattered.","My little brother sat on it. The screen's smashed."]},
  touch:{part:'screen',g:'scr',pay:110,day:4,say:["The screen turns on but ignores my fingers.","Touch stopped working after it cooked in the car."]},
  battery:{part:'battery',g:'bat',pay:70,day:1,say:["It dies by lunchtime, every single day.","It goes from 40% to dead in a second."]},
  swollen:{part:'battery',g:'bat',pay:80,day:3,say:["The screen is lifting off the phone?! It's kind of… puffy."]},
  port:{part:'port',g:'port',pay:65,day:1,say:["It won't charge anymore. I tried three cables.","Charging just… stopped. Nothing happens."]},
  lint:{part:null,g:'port',pay:35,day:1,say:["It only charges if I hold the cable at a weird angle.","The cable won't click in properly any more."]},
  speaker:{part:'speaker',g:'spk',pay:55,day:2,say:["I can't hear anything when I play music.","My ringtone's gone silent. Volume's on max."]},
  camera:{part:'camera',g:'cam',pay:80,day:2,say:["All my photos come out blurry.","The camera won't focus on anything."]},
  water:{part:null,g:'wb',pay:75,day:3,say:["I dropped it in the bath… it won't turn on.","It went in the pool for like one second. Now it's dead."]},
  board:{part:'board',g:'wb',pay:180,day:4,say:["It's completely dead. Won't even turn on.","Nothing. No logo, no buzz, nothing at all."]},
  backlight:{part:'screen',g:'x',pay:0,day:99,say:[]},
};
const NAMES=['Maya','Jonah','Priya','Leo','Ava','Omar','Chloe','Mateo','Zara','Finn','Ines','Kai','Nora','Ravi','Lena','Theo','Sofia','Dev','Mia','Hugo','Ruby','Sam','Elif','Jude'];
const FACES=['👩','👨','🧑','👵','👴','👧','🧔','👩‍🦰','👨‍🦱','🧑‍🎤','👩‍🔧','🧕','👱','🧑‍🦳','👦','🧑‍💼'];
const UPG=[
  {id:'drill',e:'🪛',n:'Electric screwdriver',cost:120,d:'Screws come out in a blink.'},
  {id:'mat',e:'🧲',n:'Magnetic screw mat',cost:60,d:'Screws never roll off the bench.'},
  {id:'gun',e:'🌡️',n:'Smart heat gun',cost:110,d:'Heats twice as fast and never overheats.'},
  {id:'thermal',e:'📸',n:'Thermal camera',cost:220,d:'Broken parts glow once the phone is open.'},
  {id:'chairs',e:'🛋️',n:'Comfy chairs',cost:90,d:'Customers wait 40% longer.'},
  {id:'bulk',e:'📦',n:'Bulk supplier',cost:180,d:'All parts 25% cheaper.'},
  {id:'sign',e:'🪧',n:'Neon shop sign',cost:150,d:'Happy customers tip 50% more.'},
];
const TOOLS=[
  {id:'driver',e:'🪛',n:'Screw',key:'1'},{id:'heat',e:'🔥',n:'Heat',key:'2'},{id:'hand',e:'✋',n:'Hand',key:'3'},
  {id:'spudger',e:'🔌',n:'Plug',key:'4'},{id:'meter',e:'🔍',n:'Meter',key:'5'},{id:'brush',e:'🪥',n:'Brush',key:'6'},
];

// ── phone geometry (phone-local units: the body is 100 × 200) ──
const R={board:[10,10,80,60],camera:[14,12,20,20],battery:[14,76,72,84],port:[38,183,24,12],speaker:[70,163,20,16],
  scrConn:[58,16,18,9],batConn:[58,58,18,9]};
const SCREEN_X=108;
const SCREWS=[
  {id:'b1',x:28,y:193,part:'case'},{id:'b2',x:72,y:193,part:'case'},
  {id:'bc1',x:53,y:62,part:'batbr'},{id:'bc2',x:81,y:62,part:'batbr'},{id:'sc1',x:81,y:20,part:'scrbr'},
  {id:'c1',x:39,y:16,part:'camera'},
  {id:'bd1',x:15,y:65,part:'board'},{id:'bd2',x:86,y:42,part:'board'},{id:'bd3',x:46,y:45,part:'board'},
  {id:'p1',x:32,y:189,part:'port'},{id:'p2',x:68,y:189,part:'port'},{id:'sp1',x:65,y:170,part:'speaker'},
];
const SCREW_BY=Object.fromEntries(SCREWS.map(s=>[s.id,s]));
const SPOT_POS=[[52,34],[24,48],[70,44],[38,60],[80,30],[30,40],[64,32],[46,64]];

// ═══════════════════════ state ═══════════════════════
const fresh=()=>({v:1,day:1,cash:150,upg:{},inv:[],mat:4,rates:[],total:0,best:0,jobIdx:0,dayEarn:0,daySpend:0,seed:1+Math.floor(Math.random()*1e6),
  hints:true,sound:true,name:'',hue:Math.floor(Math.random()*360),started:false});
let S=fresh();
const SAVE_KEY='phonedoctor.v1';
function save(){if(DEMO)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d&&d.v===1)S=Object.assign(fresh(),d)}catch(e){}}
// C = whose wallet/tools we're using: the saved shop (solo) or a throwaway race kit.
let C=S;
let mode='title';   // title | solo | race | sheet | wait | mphome | lobby | results
let cur=null;       // the phone on the bench
let DAY=null, RACE=null;
let TOOL='driver', SEL=null, TAB=null;
const upg=k=>!!(C.upg&&C.upg[k]);
const tut=()=>C===S&&S.day===1;
let uidN=1;const uid=()=>uidN++;

function rngOf(seed){let s=seed>>>0||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const inR=(x,y,r,p=0)=>x>=r[0]-p&&x<=r[0]+r[2]+p&&y>=r[1]-p&&y<=r[1]+r[3]+p;
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n));

function makeJob(r,lvl){
  const models=lvl<=1?['pear11','galaxo']:lvl<=2?['pear11','galaxo','pixelle']:MODEL_IDS;
  const model=pick(r,models);
  const pool=Object.keys(FAULTS).filter(k=>FAULTS[k].day<=lvl);
  const x=r();let n=1;if(lvl>=3&&x<.3)n=2;if(lvl>=5&&x<.1)n=3;
  const faults=[],gs=new Set();let guard=0;
  while(faults.length<n&&guard++<80){const k=pick(r,pool);if(gs.has(FAULTS[k].g))continue;gs.add(FAULTS[k].g);faults.push(k)}
  const spots=[];
  if(faults.includes('water')){const c=SPOT_POS.slice(),m=3+Math.floor(r()*2);for(let i=0;i<m;i++)spots.push(c.splice(Math.floor(r()*c.length),1)[0])}
  const say=faults.map((k,i)=>(i?'Oh, and… ':'')+pick(r,FAULTS[k].say)).join(' ');
  return{model,faults,spots,say,name:pick(r,NAMES),face:pick(r,FACES),hue:Math.floor(r()*360),pat:Math.round(120+60*n+(lvl>=4?15:0)),crack:Math.floor(r()*1e6)};
}
function jobsFor(seed,lvl,n){const r=rngOf(seed);return Array.from({length:n},()=>makeJob(r,lvl))}

function makeCracks(seed,ix,iy){
  const r=rngOf(seed),out=[];
  const cx=ix!=null?ix:14+r()*72,cy=iy!=null?iy:30+r()*130;
  const rays=7+Math.floor(r()*5);
  for(let i=0;i<rays;i++){
    let a=i/rays*6.283+r()*.5,x=cx,y=cy;const pts=[[x,y]],len=30+r()*90;
    for(let d=0;d<len;d+=6+r()*8){a+=(r()-.5)*.5;x+=Math.cos(a)*8;y+=Math.sin(a)*8;if(x<4||x>96||y<4||y>184)break;pts.push([x,y])}
    out.push(pts);
  }
  for(let k=0;k<2;k++){const rad=5+k*7+r()*3,pts=[];for(let i=0;i<=10;i++){const a=i/10*6.283;pts.push([cx+Math.cos(a)*rad*(.8+r()*.4),cy+Math.sin(a)*rad*(.8+r()*.4)])}out.push(pts)}
  return out;
}

function newPhone(job){

function advise(){

  const un=unfixed(),kn=un.filter(f=>P.known[f.k]),unk=un.filter(f=>!P.known[f.k]);

    if(unk.length&&P.portSuspect&&!P.meas.port)return A('Charging failed — touch the 🔍 meter to the charge port.',{k:'meter',part:'port'});
    if(!un.length){
      for(const id of['b1','b2'])if(!P.sc[id])return A(C.mat>0?'Put the bottom screws back in 🪛':'Out of screws — buy a 🔩 screw kit',C.mat>0?{k:'screw',id}:{k:'buy',part:'kit'});

    }

    if(P.heat<55&&!swollen())return A('Hold the 🔥 heat gun on the phone until the gauge is in the green.',{k:'heat'});
    return A('Pry the screen open with ✋ (click the phone).',{k:'pry'});
  }
  if(P.openT<.95)return null;
  if(unk.length)for(const t of['board','battery','port','speaker','camera','screen'])
    if(P.part[t]&&!P.meas[t])return A('Find the fault: touch the 🔍 meter to the '+PARTS[t].n.toLowerCase()+'.',{k:'meter',part:t});
  const work=kn.slice().sort((a,b)=>(b.k==='board')-(a.k==='board'));
  if(work.length){
    if(P.conn.bat&&work.some(f=>FAULTS[f.k].part)){
      for(const id of['bc1','bc2'])if(P.sc[id])return A('Unscrew the bracket over the battery connector 🪛',{k:'screw',id});
      return A('Unplug the battery connector 🔌 — ALWAYS before touching parts!',{k:'conn',id:'bat'});
    }
    for(const f of work){
      if(f.k==='lint')return A('Hold the 🪥 brush on the charge port.',{k:'brush',i:-1});
      if(f.k==='water'){const i=P.spots.findIndex(s=>s.left>0);if(i>=0&&P.part.board&&P.part.board.orig)return A('Scrub the green corrosion off the board with the 🪥 brush.',{k:'brush',i});continue}
      const t=FAULTS[f.k].part,p=P.part[t];

        let rm=t;

        if((t==='board'||t==='screen')&&P.conn.scr){if(P.sc.sc1)return screwOut('sc1');return A('Unplug the screen ribbon 🔌',{k:'conn',id:'scr'})}
        if(t==='board'&&P.conn.bat){for(const id of['bc1','bc2'])if(P.sc[id])return screwOut(id);return A('Unplug the battery connector 🔌',{k:'conn',id:'bat'})}
        for(const s of SCREWS)if(s.part===rm&&P.sc[s.id])return A('Unscrew the '+PARTS[rm].n.toLowerCase()+' 🪛',{k:'screw',id:s.id});

      }
      if(!p)return installStep(t);
    }
  }
  for(const t of['board','battery','camera','port','speaker','screen'])if(!P.part[t])return installStep(t);
  if(!P.conn.scr){if(P.sc.sc1)return screwOut('sc1');return A('Plug the screen ribbon back in 🔌',{k:'conn',id:'scr'})}

}

  for(const s of SCREWS)if(s.part!=='case'&&hostOf(s))drawScrew(s,P.sc[s.id]);
}
function drawPhone(){
  const P=cur;
  ctx.setTransform(DPR*U,0,0,DPR*U,DPR*OX,DPR*OY);
  const m=MODELS[P.model],t=P.openT;
  // drop shadow
  ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=18*U*DPR;ctx.shadowOffsetY=6*U*DPR;fillRR(0,0,100,200,13,m.frame);ctx.restore();
  const fg=ctx.createLinearGradient(0,0,100,0);fg.addColorStop(0,m.frame);fg.addColorStop(.5,'#ffffff22');fg.addColorStop(1,m.frame);
  fillRR(0,0,100,200,13,m.frame);ctx.fillStyle=fg;ctx.globalAlpha=.25;rr(0,0,100,200,13);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=m.dark;ctx.fillRect(-1.2,40,1.6,14);ctx.fillRect(-1.2,58,1.6,14);ctx.fillRect(99.6,50,1.6,22);
  if(t<=0){drawFront(P,P.boot>0?Math.min(1,P.boot*2):0);return}
  drawInterior(P);
  ctx.save();ctx.translate(104,0);
  if(t<.5){ctx.scale(1-2*t,1);ctx.translate(-104,0);if(P.part.screen){fillRR(0,0,100,200,13,m.frame);drawFront(P,0)}}
  else{ctx.scale(2*t-1,1);ctx.translate(-104,0);
    if(P.part.screen){ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=12*U*DPR;ctx.shadowOffsetY=4*U*DPR;fillRR(SCREEN_X,0,100,200,13,'#1d2127');ctx.restore();drawBack(P)}
    else slot([SCREEN_X+6,6,88,188],'SCREEN')}
  ctx.restore();
  // ribbon from the screen to its connector
  if(t>.9&&P.part.screen&&P.part.board){
    const c=R.scrConn,on=P.conn.scr,ex=c[0]+c[2]/2,ey=c[1]+(on?4:-1);
    ctx.strokeStyle='#d98a2b';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(SCREEN_X+11,24);ctx.bezierCurveTo(100,10,90,ey-8,ex+6,ey);ctx.stroke();ctx.lineCap='butt';
    const r=R.scrConn,dy=on?0:-4.5;fillRR(r[0]+1,r[1]+1+dy,r[2]-2,r[3]-2,1,on?'#2c3138':'#4a3a1e');
    if(!on){ctx.strokeStyle='#ff9f3d';ctx.lineWidth=.7;rr(r[0]+1,r[1]+1+dy,r[2]-2,r[3]-2,1);ctx.stroke()}
    if(P.sc.sc1){ctx.globalAlpha=.92;fillRR(r[0]-3,r[1]-2,r[2]+6,r[3]+4,2,'#b4bcc6');ctx.globalAlpha=1}
    drawScrew(SCREW_BY.sc1,P.sc.sc1);
  }
}
function hintTarget(a){
  if(!a)return null;const P=cur;
  if(a.k==='screw'){const s=SCREW_BY[a.id];return{c:[s.x,s.y,7]}}
  if(a.k==='conn')return{r:a.id==='bat'?R.batConn:R.scrConn};
  if(a.k==='meter'||a.k==='remove'||a.k==='install'){const t=a.part;if(t==='port'&&!P.open)return{r:[40,188,20,9]};return{r:t==='screen'?[SCREEN_X,0,100,200]:R[t]}}
  if(a.k==='brush'){if(a.i<0)return{r:P.open?R.port:[40,188,20,9]};const s=P.spots[a.i];return{c:[s.x,s.y,8]}}
  if(a.k==='heat'||a.k==='pry')return{r:[0,0,100,200]};
  return null;
}
function drawOverlay(){
  const P=cur;
  ctx.setTransform(DPR*U,0,0,DPR*U,DPR*OX,DPR*OY);
  // hover highlight
  if(PTR.in&&playing()&&!HOLD){
    const l=toL(PTR.x,PTR.y),t=hitTest(l.x,l.y);
    if(t){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=.8;
      if(t.k==='screw'){const s=SCREW_BY[t.id];ctx.beginPath();ctx.arc(s.x,s.y,5.5,0,6.283);ctx.stroke()}
      else if(t.k==='conn'){const r=t.id==='bat'?R.batConn:R.scrConn;rr(r[0]-2,r[1]-2,r[2]+4,r[3]+4,2);ctx.stroke()}
      else if(t.k==='part'||t.k==='slot'){const r=t.id==='screen'?[SCREEN_X,0,100,200]:R[t.id];rr(r[0]-1,r[1]-1,r[2]+2,r[3]+2,4);ctx.stroke()}
      else if(t.k==='spot'){const s=P.spots[t.i];ctx.beginPath();ctx.arc(s.x,s.y,8,0,6.283);ctx.stroke()}}
  }
  // hint ring
  if(S.hints||tut()){const h=HINT&&hintTarget(HINT.act);if(h){const a=.5+.5*Math.sin(TIME*6);ctx.strokeStyle='rgba(57,208,255,'+(.35+a*.6)+')';ctx.lineWidth=1.3;ctx.setLineDash([3,2]);ctx.lineDashOffset=-TIME*12;
    if(h.c){ctx.beginPath();ctx.arc(h.c[0],h.c[1],h.c[2]+a*1.5,0,6.283);ctx.stroke()}else{const r=h.r;rr(r[0]-2-a,r[1]-2-a,r[2]+4+2*a,r[3]+4+2*a,5);ctx.stroke()}ctx.setLineDash([])}}
  // particles
  for(const f of FX){const a=f.life/f.max;
    if(f.kind==='spark'){ctx.strokeStyle='rgba(255,'+(200+Math.random()*55|0)+',90,'+a+')';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-f.vx*.04,f.y-f.vy*.04);ctx.stroke()}
    else if(f.kind==='smoke'){ctx.fillStyle='rgba(120,120,120,'+a*.4+')';ctx.beginPath();ctx.arc(f.x,f.y,4+(1-a)*10,0,6.283);ctx.fill()}
    else{ctx.fillStyle='rgba(210,220,230,'+a+')';ctx.fillRect(f.x,f.y,1.2,1.2)}}
  for(const r of ROLL){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);drawScrew({x:0,y:0},true);ctx.restore();ctx.strokeStyle='rgba(255,159,61,'+(.5+.5*Math.sin(TIME*10))+')';ctx.lineWidth=.8;ctx.beginPath();ctx.arc(r.x,r.y,7,0,6.283);ctx.stroke()}
  // hold progress
  if(HOLD&&HOLD.k!=='heat'){ctx.strokeStyle='#39d0ff';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(HOLD.l.x,HOLD.l.y,9,-1.57,-1.57+6.283*Math.min(1,HOLD.t/HOLD.need));ctx.stroke()}
  // screen space: meter reading, heat gauge, floating text, tool cursor
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sx=x=>OX+x*U,sy=y=>OY+y*U;
  if(P.read&&P.read.life>0){
    ctx.font='600 13px Rubik,sans-serif';const tw=ctx.measureText(P.read.txt).width+20;
    let x=clamp(sx(P.read.x)-tw/2,6,W-tw-6),y=Math.max(6,sy(P.read.y)-36);
    ctx.globalAlpha=Math.min(1,P.read.life*2);fillRR(x,y,tw,26,8,P.read.bad?'#3a1118':'#0f3324');ctx.strokeStyle=P.read.bad?'#ff4d5e':'#3ddc84';ctx.lineWidth=1;rr(x,y,tw,26,8);ctx.stroke();
    ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(P.read.txt,x+10,y+17.5);ctx.globalAlpha=1;
  }
  if(!P.open&&P.openT<.05&&(P.heat>1||TOOL==='heat')){
    const gx=Math.min(W-26,sx(100)+16),gy=sy(30),gh=140*U*.6+40;
    fillRR(gx,gy,14,gh,7,'#0d1218');
    const zone=(v)=>gy+gh-gh*v/130;
    ctx.fillStyle='rgba(61,220,132,.35)';ctx.fillRect(gx+2,zone(100),10,zone(45)-zone(100));
    ctx.fillStyle='rgba(255,77,94,.35)';ctx.fillRect(gx+2,zone(130),10,zone(100)-zone(130));
    const v=clamp(P.heat,0,130);fillRR(gx+3,zone(v),8,gy+gh-zone(v)-1,4,P.heat>100?'#ff4d5e':P.heat>=45?'#3ddc84':'#ff9f3d');
    ctx.fillStyle='#8c9bb0';ctx.font='700 10px Rubik,sans-serif';ctx.textAlign='center';ctx.fillText(Math.round(P.heat)+'°',gx+7,gy+gh+13);
    if(P.heat>100){ctx.fillStyle='#ff4d5e';ctx.fillText('HOT!',gx+7,gy-6)}
  }
  for(const f of FLOAT){ctx.globalAlpha=Math.min(1,f.life);ctx.fillStyle=f.col;ctx.font='800 20px Rubik,sans-serif';ctx.textAlign='center';ctx.fillText(f.txt,sx(f.x),sy(f.y)-(1.6-f.life)*30)}ctx.globalAlpha=1;
  if(PTR.in&&playing()&&matchMedia('(pointer:fine)').matches){const tl=TOOLS.find(t=>t.id===TOOL);ctx.font='22px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='left';ctx.fillText(tl.e,PTR.x+8,PTR.y+26)}
}

// ═══════════════════════ frame ═══════════════════════
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;TIME+=dt;
  if(cur){
    const P=cur;
    P.openT=clamp(P.openT+(P.open?dt:-dt)*3,0,1);
    if(P.heatHeld>0)P.heatHeld-=dt;else P.heat=Math.max(0,P.heat-dt*7);

  if(mode==='race'&&Math.floor(TIME*2)!==Math.floor((TIME-dt)*2))renderTop();

// ═══════════════════════ multiplayer: Repair Race ═══════════════════════
// 2-8 players through the arcade's room relay. The host's browser runs the match (HS):
// everyone gets the same queue of broken phones from the host's seed and works through
// it on their own bench. Cash at the end wins; first three to finish get a bonus.
//   guest → host  {t:'hi',cid,name,hue} {t:'hb',cid} {t:'pr',cid,i,cash,fin} {t:'bye',cid}
//   host  → all   {t:'st',ph:lobby|race|results,h,seed,lvl,n,pro,end,pl:[[cid,name,hue,i,cash,fin]]}
const MAXP=8,GONE=15000,FIN_BONUS=[60,30,15],START_CASH=120;
const CODE_A='ABCDEFGHJKMNPQRSTUVWXYZ';
const rcode=n=>Array.from({length:n},()=>CODE_A[Math.floor(Math.random()*CODE_A.length)]).join('');
const MY=rcode(8);
const NET={mode:'off',ws:null,code:'',st:null,lastHost:0,lastHb:0,lastPr:0};
let HS=null;
function wsURL(room,role){const b=window.GLITCHBOX_WS&&!/PLACEHOLDER/i.test(window.GLITCHBOX_WS)?window.GLITCHBOX_WS:(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws';return b+'?room='+encodeURIComponent(room)+'&role='+role}
function netConnect(room,role){
  netClose();NET.code=room;NET.mode=role;NET.lastHost=Date.now();
  let ws;try{ws=new WebSocket(wsURL(room,role))}catch(e){mpHome('Couldn\'t reach the game server.');return}
  NET.ws=ws;
  ws.onopen=()=>ws.send(JSON.stringify(role==='host'?{t:'create',code:room,max:MAXP}:{t:'join',code:room}));
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onNet(m)};
  ws.onclose=()=>{if(NET.ws===ws){NET.ws=null;if(NET.mode!=='off')mpLost('Lost the connection to the game.')}};
}
function netSend(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o))}
function netClose(){const w=NET.ws;NET.ws=null;if(w){w.onclose=null;try{w.close()}catch(e){}}}
const myName=()=>(S.name||'Tech').slice(0,12);
function toHost(m){if(NET.mode==='host')hostIn(m);else netSend(m)}
function onNet(m){
  if(m.t==='created'){HS={ph:'lobby',players:[],seed:0,lvl:2,n:5,pro:false,end:0,finN:0,seen:{}};hostIn({t:'hi',cid:MY,name:myName(),hue:S.hue});return}
  if(m.t==='joined'||m.t==='start'){if(NET.mode==='guest')netSend({t:'hi',cid:MY,name:myName(),hue:S.hue});return}
  if(m.t==='error'){const t=m.msg||'That didn\'t work.';netClose();NET.mode='off';mpHome(t==='No game with that code.'?'No room with that code — check the letters.':t);return}
  if(m.t==='left')return;
  if(NET.mode==='host'){hostIn(m);return}
  if(m.to&&m.to!==MY)return;
  if(m.t==='st')clientState(m);
  else if(m.t==='full'){netClose();NET.mode='off';mpHome('That room is full (8 players).')}
}
// ── host ──
const HP=cid=>HS.players.find(p=>p.cid===cid);
function hostIn(m){
  if(!HS)return;
  if(m.cid)HS.seen[m.cid]=Date.now();
  if(m.t==='hi'){
    const p=HP(m.cid);
    if(p){p.name=String(m.name||p.name).slice(0,12);p.hue=+m.hue||0}
    else{if(HS.players.length>=MAXP){netSend({t:'full',to:m.cid});return}
      HS.players.push({cid:m.cid,name:String(m.name||'Tech').slice(0,12),hue:+m.hue||0,i:0,cash:START_CASH,fin:0})}
    hostPush();
  }else if(m.t==='pr'){
    const p=HP(m.cid);if(!p||HS.ph!=='race')return;
    p.i=clamp(m.i|0,0,HS.n);p.cash=clamp(Math.round(+m.cash||0),-9999,99999);
    if(m.fin&&!p.fin)p.fin=++HS.finN;
    if(HS.players.every(q=>q.fin))HS.ph='results';
    hostPush();
  }else if(m.t==='bye')hostDrop(m.cid);
}
function hostDrop(cid){if(cid===MY)return;HS.players=HS.players.filter(p=>p.cid!==cid);if(HS.ph==='race'&&HS.players.length&&HS.players.every(q=>q.fin))HS.ph='results';hostPush()}
function hostStart(){
  if(!HS||HS.players.length<2)return false;
  HS.seed=1+Math.floor(Math.random()*1e6);HS.ph='race';HS.finN=0;HS.end=Date.now()+HS.n*150000;
  HS.players.forEach(p=>{p.i=0;p.cash=START_CASH;p.fin=0});
  hostPush();return true;
}
function hostTick(){
  if(NET.mode!=='host'||!HS)return;
  const now=Date.now();
  for(const p of HS.players.slice())if(p.cid!==MY&&now-(HS.seen[p.cid]||now)>GONE)hostDrop(p.cid);
  if(HS.ph==='race'&&now>HS.end){HS.ph='results';hostPush()}
  if(now-(HS.lastPush||0)>1500)hostPush();
}
function hostPush(){
  HS.lastPush=Date.now();
  const st={t:'st',ph:HS.ph,h:MY,seed:HS.seed,lvl:HS.lvl,n:HS.n,pro:HS.pro,end:HS.end,pl:HS.players.map(p=>[p.cid,p.name,p.hue,p.i,p.cash,p.fin])};
  netSend(st);clientState(st);
}
// ── everyone ──
const PL=a=>({cid:a[0],name:a[1],hue:a[2],i:a[3],cash:a[4],fin:a[5]});
const scoreOf=p=>p.cash+(p.fin&&p.fin<=3?FIN_BONUS[p.fin-1]:0);
function raceClock(){const st=NET.st;if(!st||!st.end)return'';const s=Math.max(0,Math.ceil((st.end-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function clientState(m){
  NET.st=m;NET.lastHost=Date.now();
  const pl=m.pl.map(PL),me=pl.find(p=>p.cid===MY);
  if(m.ph==='lobby'){if(mode!=='lobby'){mpReset();mode='lobby'}renderLobby();return}
  if(!me)return;
  if(m.ph==='race'){if(!RACE||RACE.seed!==m.seed)startRace(m);else if(mode==='wait')renderWait()}
  else if(m.ph==='results')showResults();
  renderChips();
}
function startRace(m){
  hideSheet();$('mpOv').classList.remove('on');$('titleOv').classList.remove('on');
  RACE={seed:m.seed,jobs:jobsFor(m.seed,m.lvl,m.n),i:0,fin:false};
  C={cash:START_CASH,upg:m.pro?Object.fromEntries(UPG.map(u=>[u.id,1])):{},inv:[],mat:4};
  mode='race';raceNext(true);

}
function raceNext(first){
  if(!first)RACE.i++;
  if(RACE.i>=RACE.jobs.length){RACE.fin=true;cur=null;mode='wait';sendPr();renderWait();return}
  cur=newPhone(RACE.jobs[RACE.i]);TAB=null;SEL=null;FX=[];ROLL=[];FLOAT=[];setTool('driver');

}
function sendPr(){NET.lastPr=Date.now();toHost({t:'pr',cid:MY,i:RACE?RACE.i:0,cash:C.cash,fin:RACE&&RACE.fin?1:0})}
function raceAfter(r){

    ok(jobsFor(5,1,40).every(j=>j.faults.length===1&&FAULTS[j.faults[0]].day<=1),'day 1 = one easy fault');
    ok(JSON.stringify(jobsFor(77,3,5))===JSON.stringify(jobsFor(77,3,5)),'same seed, same phones (race fairness)');
    const g=jobsFor(9,6,200);ok(g.every(j=>new Set(j.faults.map(k=>FAULTS[k].g)).size===j.faults.length),'never two faults on one part');
    // 2. lint can be fixed without opening the phone
    fresh2();S.day=2;cur=newPhone(Object.assign(makeJob(rngOf(1),1),{faults:['lint'],model:'pear11'}));
    quiet=true;runTest();ok(cur.portSuspect,'test flags charging');measure('port');ok(cur.known.lint,'meter finds lint');brushDone(-1);quiet=false;
    let r=handBack();ok(r&&r.good&&r.pay===35&&!cur.open,'lint: brushed out from outside, paid');
    // 3. disasters
    fresh2();S.day=2;C.cash=999;
    const mk=f=>{cur=newPhone(Object.assign(makeJob(rngOf(2),2),{faults:f,model:'galaxo',spots:[]}));return cur};
    let P=mk(['speaker']);quiet=true;
    toggleScrew('b1');toggleScrew('b2');heatTick(1.6);pry();P.openT=1;toggleScrew('sp1');removePart('speaker');quiet=false;
    ok(P.part.board.bad==='board'&&P.caused===1,'pulling a part with the battery plugged in fries the board');
    ok(!works().power,'fried board = dead phone');
    P=mk(['speaker']);quiet=true;toggleScrew('b1');toggleScrew('b2');heatTick(1.6);pry();P.openT=1;toggleScrew('sc1');toggleConn('scr');quiet=false;
    ok(P.part.screen.bad==='backlight','unplugging the screen live blows the backlight');
    P=mk(['speaker']);quiet=true;toggleScrew('b1');toggleScrew('b2');P.heat=10;let crk=0;const mr=Math.random;Math.random=()=>.1;pry();Math.random=mr;quiet=false;
    ok(P.part.screen.bad==='crack'&&P.open,'prying cold glue cracks the screen');
    P=mk(['speaker']);quiet=true;for(let i=0;i<60;i++)heatTick(.1);quiet=false;ok(P.part.battery.bad==='battery','overheating cooks the battery');
    S.upg={gun:1};P=mk(['speaker']);quiet=true;for(let i=0;i<80;i++)heatTick(.1);quiet=false;ok(!P.part.battery.bad&&P.heat<=92,'smart heat gun never overheats');S.upg={};
    // tutorial day blocks the dangerous stuff
    S.day=1;P=mk(['speaker']);quiet=true;toggleScrew('b1');toggleScrew('b2');P.heat=10;ok(!pry(),'day 1: cold pry blocked');P.heat=60;pry();P.openT=1;toggleScrew('sp1');ok(!removePart('speaker')&&!P.caused,'day 1: live part pull blocked');quiet=false;
    S.day=2;
    // wrong-model part refused
    P=mk(['battery']);quiet=true;toggleScrew('b1');toggleScrew('b2');P.heat=60;pry();P.openT=1;toggleScrew('bc1');toggleScrew('bc2');toggleConn('bat');removePart('battery');
    C.inv=C.inv.filter(i=>!i.used);buy('battery','pear14');ok(!installPart('battery')&&!P.part.battery,'wrong-model part does not fit');
    buy('battery','galaxo');ok(installPart('battery')&&P.part.battery&&!P.part.battery.bad,'right part fits');
    ok(!P.conn.bat,'new battery arrives unplugged');
    // missing screws cost money
    toggleConn('bat');toggleScrew('bc1');toggleScrew('bc2');closeUp();P.openT=0;toggleScrew('b1');quiet=false;
    r=handBack();ok(r&&r.miss===1&&r.pen===8,'one missing screw = -$8');
    P=mk(['crack']);quiet=true;toggleScrew('b1');toggleScrew('b2');P.heat=60;pry();quiet=false;ok(handBack()===null&&!P.gone,'cannot hand back an open phone');
    // battery disconnected at hand-back = dead phone, no pay
    P=mk(['speaker']);quiet=true;toggleScrew('b1');toggleScrew('b2');P.heat=60;pry();P.openT=1;toggleScrew('bc1');toggleScrew('bc2');toggleConn('bat');toggleScrew('bc1');toggleScrew('bc2');closeUp();P.openT=0;toggleScrew('b1');toggleScrew('b2');quiet=false;
    r=handBack();ok(r&&r.total===0&&r.stars===1,'forgot to plug the battery back in = $0');
    // screws: none left → refused; kit buys 6
    P=mk(['speaker']);C.mat=0;quiet=true;toggleScrew('b1');C.mat=0;ok(!toggleScrew('b1'),'no screws on the mat → can\'t screw');buy('kit');ok(C.mat===6,'screw kit +6');quiet=false;
    // board replacement: camera comes off, goes back on
    C.inv=[];P=mk(['board']);r=solve(P);ok(r&&r.good&&P.part.camera&&P.part.board&&!P.part.board.orig,'board swap moves the camera over');
    // water: scrub OR new board fixes it
    P=newPhone(Object.assign(makeJob(rngOf(3),3),{faults:['water'],spots:[[52,34],[24,48],[70,44]],model:'pixelle'}));cur=P;ok(!works().power,'water = dead');r=solve(P);ok(r&&r.good&&r.pay===75,'water scrubbed, phone lives');
    // patience → tip
    P=mk(['speaker']);r=solve(P);const tipFast=r.tip;P=mk(['speaker']);P.t=1e5;r=solve(P);ok(tipFast>0&&r.tip===0&&r.late,'slow repairs lose the tip');
    // thermal shows, upgrades exist
    ok(UPG.length===7&&UPG.every(u=>u.cost>0),'upgrade shop');
    // 4. solo day flow
    fresh2();startDay();ok(DAY.jobs.length===3&&cur&&mode==='solo','day 1 has three customers');
    for(let k=0;k<3;k++){const r2=solve(cur);ok(r2&&r2.good,'day-1 job '+(k+1)+' solved');S.dayEarn+=r2.total;nextJob()}
    hideSheet();ok(mode==='sheet'&&!cur,'day ends after the last customer');ok(S.cash>150,'made money on day 1');
    // 5. save roundtrip
    const snap=JSON.stringify(S);ok(JSON.parse(snap).v===1,'save is JSON');
    // 6. multiplayer host logic
    fresh2();NET.mode='host';onNet({t:'created'});
    hostIn({t:'hi',cid:'g1',name:'Bo',hue:40});hostIn({t:'hi',cid:'g1',name:'Bo',hue:50});ok(HS.players.length===2&&HP('g1').hue===50,'a repeat hello updates, never duplicates');
    for(let i=2;i<=8;i++)hostIn({t:'hi',cid:'g'+i,name:'P'+i,hue:i});ok(HS.players.length===8,'eight players seat');
    ok(hostStart()&&HS.ph==='race'&&RACE&&RACE.jobs.length===5&&mode==='race','host starts → everyone gets the same 5 phones');
    ok(C!==S&&C.cash===START_CASH,'race uses its own wallet, not the saved shop');
    hostIn({t:'pr',cid:'g1',i:5,cash:400,fin:1});ok(HP('g1').fin===1,'first finisher recorded');
    hostIn({t:'pr',cid:'g1',i:5,cash:400,fin:1});ok(HS.finN===1,'finishing twice doesn\'t double count');
    hostIn({t:'pr',cid:'g2',i:2,cash:9e9});ok(HP('g2').cash<=99999,'cash is clamped');
    ok(scoreOf({cash:100,fin:1})===160&&scoreOf({cash:100,fin:4})===100,'finish bonus');
    for(let i=2;i<=8;i++)hostIn({t:'pr',cid:'g'+i,i:5,cash:200,fin:1});ok(HS.ph==='race','not over until the host finishes too');
    while(RACE.i<RACE.jobs.length&&mode!=='wait'){const r3=solve(cur);ok(r3&&r3.good,'race phone '+(RACE.i+1));raceNext()}
    ok(HS.ph==='results'&&mode==='results','everyone done → results');
    hostDrop('g3');ok(!HP('g3'),'leaver dropped');
    NET.mode='guest';const before=mode;clientState({t:'st',ph:'race',h:'x',seed:5,lvl:1,n:3,pl:[['x','Host',0,0,120,0]]});ok(mode===before,'state before my hello lands is ignored');
    NET.mode='off';HS=null;
    ok(wsURL('ABCD','host').indexOf('glitchbox-api')!==-1&&/room=ABCD&role=host$/.test(wsURL('ABCD','host')),'relay url');
    ok(!!document.querySelector('script[src="glitchbox-menu.js"]'),'quit button script present');
  }catch(e){fail++;out.push('EXCEPTION '+e.message+'\n'+e.stack)}
  quiet=false;
  const pre=document.createElement('pre');pre.id='smokeout';pre.textContent=(fail?'SMOKE FAIL':'SMOKE PASS')+' '+pass+'/'+(pass+fail)+'\n'+out.join('\n');
  pre.style.cssText='position:fixed;inset:0;z-index:99;background:#000;color:#0f0;margin:0;padding:10px;overflow:auto;font-size:12px';
  document.body.appendChild(pre);document.title=(fail?'SMOKE FAIL ':'SMOKE PASS ')+pass+'/'+(pass+fail);
});
</script>
<script src="glitchbox-menu.js" data-pos="top-left" defer></script>
