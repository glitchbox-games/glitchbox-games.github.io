<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Car Mechanic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="glitchbox-config.js"></script>
<script src="glitchbox-save.js" data-pos="top-left"></script>
<style>
:root{--bg:#0f1114;--panel:#1b1e23;--panel2:#24282e;--line:#33383f;--ink:#eceff3;--dim:#959ca6;--acc:#ffb020;--green:#3ddc84;--red:#ff4d5e;--gold:#ffd23f;--cyan:#39d0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{height:100dvh;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 112px;background:linear-gradient(#141619,#0d0f11);border-bottom:1px solid var(--line);min-height:52px;box-shadow:0 4px 18px rgba(0,0,0,.4);z-index:2}
#top .logo{font-weight:800;font-size:18px;letter-spacing:.6px;white-space:nowrap}
#top .logo b{color:var(--acc)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-weight:700;font-size:15px;white-space:nowrap}
.stat.cash{color:var(--green)}.stat.cash.neg{color:var(--red)}
#top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:18px}
#main{flex:1;min-height:0;display:grid;grid-template-columns:86px 1fr 310px}
#tools{display:flex;flex-direction:column;gap:5px;padding:8px 7px;background:#0c0e10;border-right:1px solid var(--line);overflow:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 4px;border-radius:12px;background:linear-gradient(#20242a,#1a1d22);border:1px solid var(--line);line-height:1;position:relative;flex:none}
.tool svg{width:26px;height:26px;display:block}
.tool small{font-size:10.5px;color:var(--dim);font-weight:600;white-space:nowrap}
.tool i{position:absolute;top:3px;right:6px;font-size:9px;font-style:normal;color:#666e78}
.tool:hover{border-color:#4a5059}
.tool.on{background:linear-gradient(#4a3510,#36270c);border-color:var(--acc)}
.tool.on small{color:var(--acc)}
.tool.act{background:linear-gradient(#183a27,#132e20);border-color:#2a6b45}
.tool.act small{color:#9ff0c2}
.tool.act.run{background:linear-gradient(#4a1616,#361010);border-color:#a33}
.tool.act.run small{color:#ffb0b0}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#1b1d20}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#views{position:absolute;left:10px;top:10px;display:flex;gap:4px;z-index:3;flex-wrap:wrap;max-width:calc(100% - 20px)}
#views button{padding:6px 10px;border-radius:9px;background:rgba(20,22,26,.9);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--dim)}
#views button.on{color:var(--ink);border-color:var(--acc);background:rgba(74,53,16,.95)}
#views button.lift{color:#ffd88a}
#views .sep{width:6px}
#toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4;width:min(92%,520px)}
.tst{background:rgba(12,14,17,.93);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:500;font-size:15px;text-align:center;animation:tin .25s ease-out;transition:opacity .4s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tst.bad{border-color:var(--red);color:#ffc4ca}.tst.good{border-color:var(--green);color:#c8ffe0}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#chips{position:absolute;left:8px;right:8px;bottom:8px;display:none;gap:6px;flex-wrap:wrap;justify-content:center;z-index:3;pointer-events:none}
#chips.on{display:flex}
.chip{background:rgba(12,14,17,.9);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip.me{border-color:var(--acc)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
#tut{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(94%,600px);background:rgba(12,14,17,.95);backdrop-filter:blur(6px);border:1px solid #4a4f57;border-radius:14px;padding:10px 14px;z-index:3;display:none;font-size:14.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#tut.on{display:block}
#tut b{color:var(--acc)}
#tut .th{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:3px}
#tut button{font-size:11px;color:var(--dim);text-decoration:underline;letter-spacing:0;text-transform:none}
#side{background:#0c0e10;border-left:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.card{background:linear-gradient(#1c1f24,#181a1e);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.card h3{margin:0 0 7px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:6px}
#cust{display:flex;gap:10px;align-items:flex-start}
#cust .face{font-size:38px;line-height:1;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.3)}
#cust .who{font-weight:700;font-size:16px}
#cust .mdl{display:inline-block;margin-top:3px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--acc);font-weight:700}
.said{margin-top:9px;background:#f4f1ea;color:#1d2530;border-radius:12px;padding:8px 10px;font-size:14px;position:relative;line-height:1.35}
.said:before{content:'';position:absolute;top:-8px;left:20px;border:8px solid transparent;border-top:0;border-bottom-color:#f4f1ea}
.pat{margin-top:8px;height:7px;border-radius:9px;background:#0c0e10;overflow:hidden}
.pat div{height:100%;background:var(--green);border-radius:9px;transition:background .3s}
.patl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:4px}
.notes{display:flex;flex-direction:column;gap:4px;font-size:12px;font-family:'JetBrains Mono',ui-monospace,monospace}
.notes div{background:#0c0e10;border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:#ffe2a8;line-height:1.35}
.empty{color:var(--dim);font-size:13px}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.it{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12.5px;display:flex;gap:5px;align-items:center}
.it.sel{border-color:var(--acc);background:#3a2a0e}
.it .old{color:var(--dim);font-size:11px}
.sockets{display:flex;gap:4px;flex-wrap:wrap}
.sockets button{flex:1;min-width:38px;font-size:12px;padding:6px 2px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700}
.sockets button.on{color:var(--ink);border-color:var(--acc);background:#3a2a0e}
.fluids{display:flex;gap:10px;margin-top:8px;font-size:13px;color:var(--dim)}
.fluids b{color:var(--ink)}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.row span{flex:1}
.buy{background:#173322;border:1px solid #2a6b45;color:#9ff0c2;border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px;min-width:56px}
.buy:hover{background:#1d4029}
.buy:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:rgba(5,6,8,.74);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.ov.on{display:flex}
.box{background:linear-gradient(#1d2025,#17191d);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.box h1{margin:0;font-size:42px;font-weight:800;letter-spacing:1px}
.box h1 b{color:var(--acc)}
.box h2{margin:0 0 8px;font-size:24px}
.box p,.sub{color:var(--dim);font-size:15px;line-height:1.45;margin:8px 0}
.big{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;background:var(--acc);color:#2a1a00;font-weight:800;font-size:18px;box-shadow:0 4px 0 #b97a0a}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #b97a0a}
.big.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.big.gr{background:var(--green);color:#052615;box-shadow:0 4px 0 #23985a}
.big:disabled{opacity:.45}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0c0e10;color:var(--ink);font:inherit;font-size:18px;text-align:center;margin-top:8px}
.code{font-size:46px;font-weight:800;letter-spacing:10px;color:var(--acc);margin:6px 0}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.prow{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}
.prow.me{border-color:var(--acc)}
.prow span{flex:1}
.prow i{width:12px;height:12px;border-radius:50%}
.opt{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.opt button{padding:7px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.opt button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.err{color:var(--red);min-height:20px;margin-top:6px;font-size:14px}
.or{color:var(--dim);margin:12px 0 0;font-size:13px}
.tl{text-align:left;display:flex;flex-direction:column;gap:6px;margin:12px 0}
.tl div{display:flex;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:15px}
.tl .f{color:#ffb0b8}.tl .p{color:#a9f3c9}.tl .n{color:#e6e9ee;font-weight:500;text-align:right}
.upg{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin-top:10px}
.u{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px;font-size:13px}
.u b{display:block;font-size:14px;margin-bottom:2px}
.u .d{color:var(--dim);min-height:34px}
.u button{margin-top:6px;width:100%}
.u.own{border-color:#2a6b45;opacity:.75}
.stars{color:var(--gold);font-size:22px;letter-spacing:2px}
.how{text-align:left;font-size:14px;color:var(--dim);line-height:1.5}
.how b{color:var(--ink)}
@media (max-width:820px){
  #top{padding-left:104px;gap:6px}
  #top .logo{display:none}
  .stat{font-size:13px;padding:3px 7px}
  #main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto minmax(0,32vh)}
  #tools{flex-direction:row;order:2;border:0;border-top:1px solid var(--line);padding:6px;overflow-x:auto}
  .tool{min-width:54px;flex:1}
  .tool svg{width:22px;height:22px}
  #stage{order:1}
  #side{order:3;border:0;border-top:1px solid var(--line);padding:8px}
  #views button{padding:5px 7px;font-size:12px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="logo">🔧 CAR <b>MECHANIC</b></div>
    <div class="stat" id="sDay">Day 1</div>
    <div class="stat cash" id="sCash">$0</div>
    <div class="stat" id="sRate">⭐ –</div>
    <div class="sp"></div>
    <button class="ib" id="bSnd" title="Sound">🔊</button>
    <button class="ib" id="bHelp" title="Shop manual">📘</button>
  </div>
  <div id="main">
    <div id="tools"></div>
    <div id="stage"><canvas id="cv"></canvas><div id="views"></div><div id="toast"></div><div id="chips"></div><div id="tut"><div class="th"><span>📘 Day 1 · how the shop works</span><button id="tutSkip">Skip tutorial</button></div><div id="tutTxt"></div></div></div>
    <div id="side"></div>
  </div>
</div>

<div class="ov on" id="titleOv"><div class="box">
  <h1>CAR <b>MECHANIC</b></h1>
  <p>You run a garage. Cars roll in with problems. Figure out what's wrong, fix it properly, and get paid — or break it worse.</p>
  <button class="big" id="playBtn">🔧 Open the garage</button>
  <button class="big alt" id="raceBtn">👥 Garage Race (online)</button>
  <button class="big alt" id="newBtn" style="display:none">🗑️ Start a new garage</button>
  <button class="big alt" id="howBtn">📘 Shop manual</button>
</div></div>
<div class="ov" id="mpOv"><div class="box" id="mpCard"></div></div>
<div class="ov" id="sheetOv"><div class="box" id="sheet"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const HASH=location.hash.replace(/-debug$/,'');   // the terms gate lets *debug hashes through, so screenshots use #demoX-debug
let DEMO=false;

// ═══════════════════════ data ═══════════════════════
const CARS={
  kestrel:{name:'Kestrel Hatch',paint:'#c93b2a',mult:1,bat:'H5 · 600 CCA',qt:4.2,rim:'#c9ced5',caliper:'#c42d2d',code:'K18'},
  monarch:{name:'Monarch Sedan',paint:'#24477e',mult:1.2,bat:'H6 · 680 CCA',qt:4.8,rim:'#3a3f46',caliper:'#1d1f22',code:'M20'},
  boulder:{name:'Boulder Pickup',paint:'#5b6b4a',mult:1.4,bat:'H7 · 760 CCA',qt:5.7,rim:'#9aa3ad',caliper:'#2f3b52',code:'B25'},
};
const CAR_IDS=Object.keys(CARS);
const CYL=[1,2,3,4],CX={1:72,2:90,3:108,4:126};
const CORNERS=['FL','FR','RL','RR'];
// parts you can buy (per car model). fluids are separate stock.
const PARTS={battery:{n:'Battery',e:'🔋',cost:95},alternator:{n:'Alternator',e:'⚡',cost:180},belt:{n:'Serpentine belt',e:'➰',cost:35},
  plug:{n:'Spark plug',e:'🔩',cost:12},coil:{n:'Ignition coil',e:'🧲',cost:60},pads:{n:'Brake pads (one wheel)',e:'🛑',cost:24},
  filter:{n:'Oil filter',e:'🛢️',cost:9},hose:{n:'Radiator hose',e:'〰️',cost:30},fuse:{n:'Main fuse',e:'🔸',cost:4},washer:{n:'Drain-plug washer',e:'⭕',cost:1}};
const PART_IDS=Object.keys(PARTS);
const FLUIDS={oil:{n:'Engine oil (5 qt)',e:'🛢️',cost:28,amt:5},cool:{n:'Coolant (jug)',e:'🟩',cost:18,amt:1}};
// g = exclusive group; day = first day it shows up; pay = what the customer pays
const FAULTS={
  battery:{g:'bat',pay:160,day:1,say:["It won't start. Just clicks.","Dead every morning. Jump starts get me to work."]},

  hose:{g:'cool',pay:140,day:3,say:["There's a green puddle under it every morning.","The temperature needle keeps creeping up."]},

};
const NAMES=['Rosa','Dmitri','Kenji','Aaliyah','Brett','Marisol','Tomasz','Imani','Wes','Priya','Hank','Lucia','Obi','Greta','Sal','June','Arjun','Dolores','Rex','Noor'];
const FACES=['👩','👨','🧑','👵','👴','🧔','👩‍🦰','👨‍🦱','👱','🧑‍🦳','🧑‍💼','👷','🧕','👨‍🦳','👩‍🔧','🤠'];
const UPG=[
  {id:'impact',e:'🔫',n:'Impact gun',cost:220,d:'Bolts and lug nuts spin off in a blink.'},
  {id:'mag',e:'🧲',n:'Magnetic parts tray',cost:60,d:'Bolts never roll off into the shop.'},
  {id:'lift',e:'🏗️',n:'Fast lift',cost:180,d:'The lift goes up and down in a second.'},
  {id:'chairs',e:'🛋️',n:'Waiting room',cost:120,d:'Customers wait 40% longer.'},
  {id:'bulk',e:'📦',n:'Parts account',cost:250,d:'All parts 20% cheaper.'},
  {id:'sign',e:'🪧',n:'Neon sign',cost:200,d:'Happy customers tip 50% more.'},
];
const CREDIT=-300;
const SOCKETS=[10,13,14,15,16,19];
const TOOLS=[
  {id:'ratchet',n:'Ratchet',key:'1'},{id:'torque',n:'Torque',key:'2'},{id:'breaker',n:'Breaker',key:'3'},{id:'hand',n:'Hand',key:'4'},
  {id:'pliers',n:'Pliers',key:'5'},{id:'meter',n:'Meter',key:'6'},{id:'pan',n:'Drain pan',key:'7'},{id:'pour',n:'Pour',key:'8'},{id:'clamp',n:'C-clamp',key:'9'},
];
const ICON={
  ratchet:'<svg viewBox="0 0 24 24"><g transform="rotate(-40 12 12)"><rect x="3" y="10.5" width="13" height="3" rx="1.5" fill="#c9ced5"/><rect x="5" y="10.9" width="9" height="2.2" rx="1" fill="#e04646"/><circle cx="18" cy="12" r="4" fill="#dfe3e8"/><circle cx="18" cy="12" r="2" fill="#6a717a"/></g></svg>',
  torque:'<svg viewBox="0 0 24 24"><g transform="rotate(-40 12 12)"><rect x="1" y="10.6" width="15" height="2.8" rx="1.4" fill="#c9ced5"/><rect x="2.5" y="10" width="6" height="4" rx="1.5" fill="#2c3138"/><rect x="9" y="10.3" width="4" height="3.4" fill="#ffb020"/><circle cx="18.5" cy="12" r="3.6" fill="#dfe3e8"/><circle cx="18.5" cy="12" r="1.7" fill="#6a717a"/></g></svg>',
  breaker:'<svg viewBox="0 0 24 24"><g transform="rotate(-40 12 12)"><rect x="0" y="10.8" width="18" height="2.4" rx="1.2" fill="#9aa3ad"/><rect x="1" y="10.3" width="6" height="3.4" rx="1.4" fill="#2c3138"/><rect x="17" y="8.5" width="3" height="7" rx="1" fill="#dfe3e8"/><rect x="19.5" y="10.5" width="3" height="3" fill="#9aa3ad"/></g></svg>',
  hand:'<svg viewBox="0 0 24 24"><path d="M8.5 21.5c-2.2-1.8-4.5-5-4.9-7.1-.2-1 .9-1.6 1.7-.9l2.2 2V5a1.4 1.4 0 0 1 2.8 0v6.5V3.6a1.4 1.4 0 0 1 2.8 0v7.9V4.7a1.4 1.4 0 0 1 2.8 0v7.4V7.4a1.4 1.4 0 0 1 2.8 0v7.4c0 4.2-2.3 6.7-6.3 6.7z" fill="#3a6fd6" stroke="#1d4aa8" stroke-width=".8"/></svg>',
  pliers:'<svg viewBox="0 0 24 24"><path d="M10 13 3 22M14 13l7 9" stroke="#e04646" stroke-width="3" stroke-linecap="round"/><path d="M10 13 12 3l2 10" fill="#c9ced5"/><circle cx="12" cy="12" r="1.6" fill="#6a717a"/></svg>',

  {id:'altBp',v:'bay',x:182,y:42,mm:10,host:'alternator',bplus:true},

];

const CONNS={coilC1:{v:'bay',x:CX[1],y:60,host:'coil1'},coilC2:{v:'bay',x:CX[2],y:60,host:'coil2'},coilC3:{v:'bay',x:CX[3],y:60,host:'coil3'},coilC4:{v:'bay',x:CX[4],y:60,host:'coil4'},altC:{v:'bay',x:168,y:56,host:'alternator'}};

// ═══════════════════════ state ═══════════════════════
const fresh=()=>({v:1,day:1,cash:400,upg:{},inv:[],fluid:{oil:0,cool:0},sock:10,rates:[],total:0,best:0,jobIdx:0,dayEarn:0,daySpend:0,seed:1+Math.floor(Math.random()*1e6),
  sound:true,name:'',hue:Math.floor(Math.random()*360),started:false,tutOff:false});

const SAVE_KEY='carmechanic.v1';
function save(){if(DEMO)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d&&d.v===1)S=Object.assign(fresh(),d)}catch(e){}}
let C=S,mode='title',cur=null,DAY=null,RACE=null,TOOL='ratchet',SEL=null,TAB=null;
const upg=k=>!!(C.upg&&C.upg[k]);
let uidN=1;const uid=()=>uidN++;
function rngOf(seed){let s=seed>>>0||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const inR=(x,y,r,p=0)=>x>=r[0]-p&&x<=r[0]+r[2]+p&&y>=r[1]-p&&y<=r[1]+r[3]+p;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n));
const ptype=k=>k.replace(/\d$/,'').replace(/:.*$/,'');   // 'coil3' → 'coil', 'pads:FL' → 'pads'

function makeJob(r,lvl){
  const model=pick(r,lvl<=1?['kestrel','monarch']:CAR_IDS);
  const pool=Object.keys(FAULTS).filter(k=>FAULTS[k].day<=lvl);
  const x=r();let n=1;if(lvl>=3&&x<.3)n=2;if(lvl>=5&&x<.12)n=3;
  const faults=[],gs=new Set();let guard=0;
  while(faults.length<n&&guard++<80){const k=pick(r,pool);if(gs.has(FAULTS[k].g))continue;gs.add(FAULTS[k].g);faults.push(k)}
  const say=faults.map((k,i)=>(i?'Oh, and… ':'')+pick(r,FAULTS[k].say)).join(' ');
  return{model,faults,say,cyl:1+Math.floor(r()*4),name:pick(r,NAMES),face:pick(r,FACES),hue:Math.floor(r()*360),pat:Math.round(320+150*n+(lvl>=4?40:0)),miles:20000+Math.floor(r()*140000),seed:Math.floor(r()*1e6)};
}
function jobsFor(seed,lvl,n){const r=rngOf(seed);return Array.from({length:n},()=>makeJob(r,lvl))}

function newCar(job){
  const P={uid:uid(),t:0,job,model:job.model,view:'bay',run:false,runT:0,lift:false,liftT:0,temp:22,hotT:0,lowOilT:0,crank:0,
    f:{},conn:{},part:{},faults:job.faults.map(k=>({k,paid:true})),oil:job.faults.includes('oil')?.82:1,oilOld:job.faults.includes('oil'),drained:false,
    cool:job.faults.includes('hose')?.72:1,pan:null,cap:{oil:false,res:false,rad:false},slack:0,piston:{},oldWasher:false,seized:false,
    spill:0,damage:[],notes:[],scanned:false,said:{},gone:false,read:null,lastSpill:0};
  for(const t of['battery','alternator','belt','fuse','filter','hose'])P.part[t]={model:job.model,bad:null,orig:true};
  for(const i of CYL){P.part['coil'+i]={model:job.model,bad:null,orig:true};P.part['plug'+i]={model:job.model,bad:null,orig:true}}
  for(const c of CORNERS){P.part['wheel:'+c]={model:job.model,bad:null};P.part['caliper:'+c]={model:job.model,bad:null};P.part['pads:'+c]={model:job.model,bad:null,orig:true};P.piston[c]='out'}
  for(const f of FAST)P.f[f.id]='tight';
  for(const c of CONN_IDS)P.conn[c]=true;
  for(const k of job.faults){
    if(k==='battery')P.part.battery.bad='battery';
    if(k==='alternator')P.part.alternator.bad='alternator';
    if(k==='belt')P.part.belt.bad='belt';
    if(k==='plug')P.part['plug'+job.cyl].bad='plug';
    if(k==='coil')P.part['coil'+job.cyl].bad='coil';
    if(k==='hose')P.part.hose.bad='hose';
    if(k==='oil')P.part.filter.bad='oil';
    if(k==='brakes'){P.part['pads:FL'].bad='brakes';P.part['pads:FR'].bad='brakes'}
  }
  return P;
}

// ═══════════════════════ rules ═══════════════════════
const has=k=>!!cur.part[k];
const isOut=id=>cur.f[id]==='out'||cur.f[id]==='lost';   // a dropped bolt is just as gone as a removed one
const caliperOn=c=>!!cur.part['caliper:'+c];
function fastShown(f){
  const P=cur;
  if(f.host&&!P.part[f.host])return false;
  if(f.gone&&P.part[f.gone])return false;
  return true;
}
function powered(){const P=cur;return has('battery')&&!isOut('batN')&&!isOut('batP')&&has('fuse')&&!P.part.fuse.bad}
function cylOK(i){const P=cur,c=P.part['coil'+i],p=P.part['plug'+i];return !!(c&&p&&!c.bad&&!p.bad&&P.conn['coilC'+i]&&!isOut('plug'+i)&&!isOut('coilB'+i))}
function canStart(){
  const P=cur;
  if(P.seized)return'seized';
  if(!powered())return'dead';
  if(P.part.battery.bad)return'clicks';
  if(CYL.filter(cylOK).length<3)return'cranks';
  return'ok';
}
function charging(){const P=cur;return has('alternator')&&!P.part.alternator.bad&&has('belt')&&P.conn.altC&&!isOut('altBp')}
function isFixed(f){
  const P=cur,p=P.part;
  switch(f.k){
    case'battery':return has('battery')&&!p.battery.bad;
    case'alternator':return has('alternator')&&!p.alternator.bad;
    case'belt':return has('belt')&&!p.belt.bad;
    case'plug':return CYL.every(i=>has('plug'+i)&&!p['plug'+i].bad);
    case'coil':return CYL.every(i=>has('coil'+i)&&!p['coil'+i].bad);
    case'hose':return has('hose')&&!p.hose.bad&&P.cool>=.9;
    case'oil':return !P.oilOld&&has('filter')&&!p.filter.bad&&P.oil>=.85&&P.oil<=1.15;
    case'brakes':return['FL','FR'].every(c=>has('pads:'+c)&&!p['pads:'+c].bad);
    case'fuse':return has('fuse')&&!p.fuse.bad;
  }
  return true;
}
const unfixed=()=>cur.faults.filter(f=>!isFixed(f));
function addFault(k){
  const P=cur;
  if(k==='fuse'){if(!has('fuse')||P.part.fuse.bad)return false;P.part.fuse.bad='fuse'}
  P.faults.push({k,paid:false});P.caused=(P.caused||0)+1;return true;
}
function damage(txt,cost){cur.damage.push({txt,cost});msg('💥 '+txt,'bad');sfx('crunch')}
function partCost(t,model){const base=FLUIDS[t]?FLUIDS[t].cost:PARTS[t].cost*(t==='fuse'||t==='washer'?1:CARS[model].mult);return Math.max(1,Math.round(base*(upg('bulk')&&!FLUIDS[t]?.8:1)))}
const canAfford=c=>C.cash-c>=CREDIT;
function once(key,txt,kind){const P=cur;if(P.said[key])return;P.said[key]=1;msg(txt,kind)}
let quiet=false;
const busy=()=>cur.run;

// ── fasteners ──
function fastAct(id,tool){
  const P=cur,f=FASTBY[id];if(!f||!fastShown(f))return false;
  const st=P.f[id];
  if(tool==='pliers'||f.tool==='pliers'){
    if(tool!=='pliers'){msg('That\'s a spring clamp — it needs pliers.');sfx('err');return false}
    P.f[id]=st==='out'?'tight':'out';sfx('click');UI();return true;
  }
  if(tool==='pliers'){msg('Pliers just slip off a bolt head.');sfx('err');return false}
  if(P.run&&f.v==='bay'&&!f.term){msg('Not with the engine running.');sfx('err');return false}
  if(tool==='torque'){
    if(!f.torque){msg('That one doesn\'t take a torque spec — just snug it with the ratchet.');sfx('err');return false}
    if(st==='out'){msg('Nothing to torque — it\'s not threaded in.');sfx('err');return false}
    if(f.lug&&P.lift){msg('The wheel just spins in the air.');sfx('err');return false}
    if(st==='tight'){msg('Click. Already at spec.');sfx('click');return true}
    P.f[id]='tight';sfx('click2');UI();return true;
  }
  // ratchet
  if(st==='lost'){C.cash-=2;spend(2);P.f[id]='out';msg('You grab a replacement bolt from the hardware drawer.');return fastAct(id,tool)}
  if(S_SOCK()!==f.mm){msg(S_SOCK()<f.mm?'The '+S_SOCK()+' mm socket won\'t go over that head.':'The '+S_SOCK()+' mm socket slips and starts rounding the corners.');sfx('err');return false}
  if(st!=='out'){
    if(f.lug&&P.lift&&st==='tight'){msg('The wheel just spins in the air.');sfx('err');return false}
    if(f.term==='pos'&&!isOut('batN')&&Math.random()<.35)zapFuse('The ratchet touched the body while you were on the positive terminal.');
    if(f.bplus&&powered())zapFuse('That cable is live — straight to ground.');
    P.f[id]='out';
    if(f.id==='drain')msg('Oil starts pouring out of the pan.');
    if(!quiet&&!upg('mag')&&!f.isPlug&&!f.lug&&!f.term&&f.id!=='drain'&&Math.random()<.06){P.f[id]='lost';msg('🔩 The bolt dropped and rolled under the car. Gone.')}
  }else{
    if(f.term==='pos'&&!isOut('batN')&&Math.random()<.35)zapFuse('The ratchet touched the body while you were on the positive terminal.');
    if(f.id==='drain'){const w=C.inv.find(i=>i.type==='washer');if(w){C.inv=C.inv.filter(i=>i!==w);P.oldWasher=false}else P.oldWasher=true}
    P.f[id]=f.torque?'snug':'tight';
  }
  sfx('ratchet');UI();return true;
}
const S_SOCK=()=>C.sock;
function zapFuse(why){fx('spark',cur.view==='bay'?28:60,cur.view==='bay'?26:60);sfx('spark');if(addFault('fuse'))msg('⚡ Bang — a fat spark. '+why+' Everything just went dead.','bad');else msg('⚡ A spark jumped off the terminal.','bad')}
// ── parts ──
function partReady(k){
  const P=cur;
  const block=f=>f.host===k&&fastShown(f)&&P.f[f.id]!=='out'&&P.f[f.id]!=='lost'&&!(f.isPlug);
  if(FAST.some(block)){msg('It\'s still bolted down.');sfx('err');return false}
  return true;
}
function removePart(k){
  const P=cur,p=P.part[k];if(!p)return false;
  const t=ptype(k),c=k.includes(':')?k.split(':')[1]:null;
  if(P.run&&!c){msg('Not with the engine running.');sfx('err');return false}
  if(t==='battery'){if(!isOut('batN')||!isOut('batP')){msg('The cables are still clamped on.');sfx('err');return false}if(P.f.batH!=='out'&&P.f.batH!=='lost'){msg('The hold-down bar is still bolted across it.');sfx('err');return false}}
  else if(t==='coil'){const i=k.slice(4);if(P.conn['coilC'+i]){msg('It\'s still plugged in.');sfx('err');return false}if(!partReady(k))return false}
  else if(t==='plug'){const i=k.slice(4);if(P.part['coil'+i]){msg('There\'s a coil sitting on top of it.');sfx('err');return false}if(P.f['plug'+i]!=='out'){msg('It\'s still screwed into the head.');sfx('err');return false}}
  else if(t==='alternator'){if(has('belt')){msg('The belt is still wrapped around its pulley.');sfx('err');return false}if(P.conn.altC){msg('Its plug is still connected.');sfx('err');return false}if(!partReady(k))return false}
  else if(t==='belt')return beltAct();
  else if(t==='fuse'){/* pulls straight out */}
  else if(t==='filter'){if(!P.lift){msg('You can\'t reach it from up here.');return false}if(P.oil>.1)P.spill+=.15,once('filterspill','Oil glugs out of the filter housing onto the floor.')}
  else if(t==='hose'){if(P.f.clampA!=='out'||P.f.clampB!=='out'){msg('The clamps are still squeezing it on.');sfx('err');return false}}
  else if(t==='wheel'){if([0,1,2,3,4].some(n=>P.f['L'+n+':'+c]!=='out'&&P.f['L'+n+':'+c]!=='lost')){msg('Lug nuts are still on.');sfx('err');return false}if(!P.lift){msg('The car is sitting on it.');sfx('err');return false}}
  else if(t==='caliper'){if(has('wheel:'+c)){msg('The wheel is in the way.');return false}if(!partReady(k))return false}
  else if(t==='pads'){if(caliperOn(c)){msg('The caliper is clamped over them.');sfx('err');return false}}
  if(t==='caliper'){P.part[k]=null;P.hang=P.hang||{};P.hang[c]={model:p.model};sfx('pop');UI();return true}
  if(t==='wheel'){P.part[k]=null;P.wheelOff=P.wheelOff||{};P.wheelOff[c]={model:p.model};sfx('thunk');UI();return true}
  C.inv.push({id:uid(),type:t,model:p.model,bad:p.bad,used:true,from:k});
  P.part[k]=null;
  if(t==='coil'){}
  if(t==='hose'){msg('Coolant gushes out of the open neck.');}
  for(const f of FAST)if(f.host===k&&P.f[f.id]==='lost')P.f[f.id]='out';
  sfx('pop');UI();return true;
}
function installPart(k){
  const P=cur;if(P.part[k])return false;
  const t=ptype(k),c=k.includes(':')?k.split(':')[1]:null;
  if(P.run&&!c){msg('Not with the engine running.');sfx('err');return false}
  if(t==='caliper'){const h=P.hang&&P.hang[c];if(!h)return false;if(has('pads:'+c)&&!P.part['pads:'+c].bad&&P.part['pads:'+c].fresh&&P.piston[c]==='out'){msg('The caliper won\'t fit over the new pads — the piston is sticking out too far.');sfx('err');return false}
    P.part[k]={model:h.model,bad:null};delete P.hang[c];for(const f of FAST)if(f.host===k)P.f[f.id]='out';if(has('pads:'+c)&&P.part['pads:'+c].fresh)P.piston[c]='set';sfx('thunk');UI();return true}
  if(t==='wheel'){const h=P.wheelOff&&P.wheelOff[c];if(!h)return false;if(caliperOn(c)===false){msg('The caliper is hanging off — the wheel can\'t go on.');sfx('err');return false}
    P.part[k]={model:h.model,bad:null};delete P.wheelOff[c];for(const f of FAST)if(f.host===k)P.f[f.id]='out';sfx('thunk');UI();return true}
  if(t==='coil'){const i=k.slice(4);if(!has('plug'+i)){msg('There\'s no spark plug down that hole.');sfx('err');return false}}
  if(t==='alternator'&&has('belt')){msg('The belt is in the way.');return false}
  let it=SEL&&C.inv.find(i=>i.id===SEL&&i.type===t);
  if(!it)it=C.inv.find(i=>i.type===t&&i.model===P.model&&!i.used)||C.inv.find(i=>i.type===t&&i.model===P.model&&!i.bad&&(i.from===k||t!=='coil'&&t!=='plug'))||C.inv.find(i=>i.type===t&&i.model===P.model&&!i.bad)||C.inv.find(i=>i.type===t&&i.model===P.model);
  if(!it){const wrong=C.inv.find(i=>i.type===t);msg(wrong?'Your '+PARTS[t].n.toLowerCase()+' is for a '+CARS[wrong.model].name+'.':'You don\'t have a '+PARTS[t].n.toLowerCase()+' for this.');sfx('err');return false}
  if(it.model!==P.model){msg('Wrong part — that one\'s for a '+CARS[it.model].name+'.');sfx('err');return false}
  C.inv=C.inv.filter(i=>i!==it);if(SEL===it.id)SEL=null;
  P.part[k]={model:it.model,bad:it.bad,orig:false,fresh:!it.used};

    for(const id of['clampA','clampB'])if(P.f[id]!=='out')return A('clamp off',{k:'pliers',id});return removeK('hose')}

}
function beltSteps(){const P=cur;if(P.view!=='bay')return{txt:'view',act:{k:'view',v:'bay'}};if(!P.part.belt&&!C.inv.some(i=>i.type==='belt'&&i.model===P.model&&!i.bad))return{txt:'buy belt',act:{k:'buy',part:'belt'}};if(P.slack<=0)return{txt:'slack',act:{k:'slack'}};return{txt:'belt',act:{k:'belt'}}}

function doAct(a){

function dayJobs(){return S.day<=1?3:S.day===2?3:S.day<6?4:5}
function startDay(){C=S;mode='solo';S.started=true;DAY={jobs:jobsFor(S.seed*7919+S.day*104729,Math.min(S.day,6),dayJobs()),i:S.jobIdx||0};nextJob(true)}
function resetBench(){TAB=null;SEL=null;FX=[];FLOAT=[];HOLD=null;setTool('ratchet')}
function nextJob(first){
  if(mode==='race'){raceNext();return}

function afterJob(r){

    <div><span><b>Total</b></span><b class="${r.total>=0?'p':'f'}">${money(r.total)}</b></div></div>
    <button class="big" id="nextJob">${DAY.i+1>=DAY.jobs.length?'🌙 Close up for the day':'🔔 Next customer'}</button>`);
  renderTop();
}
function endDay(){
  const rent=40+S.day*15;S.cash-=rent;S.dayRent=rent;const profit=S.dayEarn-S.daySpend-rent;S.best=Math.max(S.best,profit);save();
  try{if(!DEMO&&window.GLITCHBOX&&GLITCHBOX.score)GLITCHBOX.score(Math.max(0,Math.round(S.total)))}catch(e){}
  cur=null;mode='sheet';showDayEnd();
}
function showDayEnd(){
  const rent=S.dayRent||0,profit=S.dayEarn-S.daySpend-rent;
  showSheet(`<h2>🌙 Day ${S.day} done</h2>
    <div class="tl"><div><span>Repairs + tips</span><b class="p">${money(S.dayEarn)}</b></div><div><span>Parts & fluids</span><b class="f">-${money(S.daySpend)}</b></div>
    <div><span>Garage rent</span><b class="f">-${money(rent)}</b></div><div><span><b>Profit</b></span><b class="${profit>=0?'p':'f'}">${money(profit)}</b></div>
    <div><span>Cash in the till</span><b class="${S.cash<0?'f':''}">${money(S.cash)}</b></div></div>
    ${S.cash<0?'<p>You\'re running on the parts account. Good repairs will pay it off.</p>':''}
    <h2 style="font-size:18px;margin-top:6px">🛠️ Upgrade the garage</h2>
    <div class="upg">${UPG.map(u=>`<div class="u${S.upg[u.id]?' own':''}"><b>${u.e} ${u.n}</b><div class="d">${u.d}</div>${S.upg[u.id]?'<div style="color:var(--green);margin-top:6px">✓ Owned</div>':`<button class="buy" data-upg="${u.id}" ${S.cash<u.cost?'disabled':''}>${money(u.cost)}</button>`}</div>`).join('')}</div>
    <button class="big gr" id="nextDay">☀️ Open day ${S.day+1}</button><button class="big alt" id="toTitle">🏠 Title screen</button>`);
}
function goTitle(){
  if(NET.mode!=='off')mpLeave();
  cur=null;mode='title';C=S;RACE=null;
  $('playBtn').textContent=S.started?'🔧 Open the garage · Day '+S.day:'🔧 Open the garage';$('newBtn').style.display=S.started?'':'none';
  $('titleOv').classList.add('on');UI();renderTop();

// ═══════════════════════ frame: update ═══════════════════════
let last=performance.now(),TIME=0;
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;TIME+=dt;
  try{step(dt);if(!W)layout();geom();render();engineSound()}catch(e){console.error(e)}
  requestAnimationFrame(frame);
}
function step(dt){
  if(cur){
    const P=cur;
    const ls=upg('lift')?2:.55;P.liftT=clamp(P.liftT+(P.lift?dt:-dt)*ls,0,1);
    if(P.slack>0)P.slack=Math.max(0,P.slack-dt);
    if(P.read)P.read.life-=dt;
    // fluids leaving the car
    if((P.f.drain==='out'||P.f.drain==='lost')&&P.oil>0){const q=Math.min(P.oil,dt*.28);P.oil-=q;if(P.pan!=='oil'){P.spill+=q;if(P.spill-P.lastSpill>.25&&!quiet){P.lastSpill=P.spill;msg('Oil is running across the shop floor.','bad')}}if(P.oil<.05){P.oil=Math.max(0,P.oil);P.drained=true}}
    if(!P.part.hose&&P.cool>0){const q=Math.min(P.cool,dt*.4);P.cool-=q;if(P.pan!=='cool')P.spill+=q*.6}
    // the engine
    if(P.run){
      P.runT+=dt;
      const cooling=P.part.belt&&P.cool>=.7&&P.part.hose;
      const target=cooling?92:135;P.temp+=(target-P.temp)*dt*(cooling?.12:.06);
      if(P.temp>118){P.hotT+=dt;if(Math.random()<dt*6)fx('steam',150,10,2);if(P.hotT>4&&!P.seized){P.seized=true;P.run=false;P.overheated=true;damage('Steam everywhere and a horrible knock — you overheated the engine. Head gasket\'s gone.',600)}}
      if(P.oil<.4){P.lowOilT+=dt;if(P.lowOilT>2.5&&!P.seized){P.seized=true;P.run=false;damage('A loud bang, then silence. With no oil, the engine seized solid.',800)}}else P.lowOilT=Math.max(0,P.lowOilT-dt);
      if(P.oil>1.2&&Math.random()<dt*3)fx('smoke',100,140,1);
      if(canStart()!=='ok'){P.run=false;msg('The engine stalls.')}
    }else{P.temp+=(22-P.temp)*dt*.025;P.hotT=Math.max(0,P.hotT-dt)}
    if(playing()&&!$('sheetOv').classList.contains('on'))P.t=(P.t||0)+dt;
    holdTick(dt);
  }
  for(const f of FX){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.kind==='spark'?90:0)*dt;f.vx*=.98;f.life-=dt}FX=FX.filter(f=>f.life>0);
  for(const f of FLOAT)f.life-=dt;FLOAT=FLOAT.filter(f=>f.life>0);
  if(uiDirty){uiDirty=false;renderSide();renderTop()}
  renderTools();renderViews();if(Math.floor(TIME*6)!==Math.floor((TIME-dt)*6))renderTut();
  if(cur&&playing()){const f=Math.max(0,1-(cur.t||0)/patience()),pb=$('patBar');if(pb){pb.style.width=(f*100)+'%';pb.style.background=f>.5?'#3ddc84':f>.2?'#ffd23f':'#ff4d5e';$('patTxt').textContent=f>.5?'😊 waiting':f>.2?'😐 checking the time':f>0?'😠 getting annoyed':'😤 fed up'}}
  if(mode==='race'&&Math.floor(TIME*2)!==Math.floor((TIME-dt)*2))renderTop();
}

// ═══════════════════════ multiplayer: Garage Race ═══════════════════════
// 2-8 players through the arcade's room relay. The host's browser runs the match (HS): everyone
// gets the same queue of broken cars from the host's seed and works through it in their own bay.
// Cash at the end wins; first three to finish get a bonus.
//   guest → host  {t:'hi',cid,name,hue} {t:'hb',cid} {t:'pr',cid,i,cash,fin} {t:'bye',cid}
//   host  → all   {t:'st',ph:lobby|race|results,h,seed,lvl,n,pro,end,pl:[[cid,name,hue,i,cash,fin]]}
const MAXP=8,GONE=15000,FIN_BONUS=[120,60,30],START_CASH=300;
const CODE_A='ABCDEFGHJKMNPQRSTUVWXYZ';
const rcode=n=>Array.from({length:n},()=>CODE_A[Math.floor(Math.random()*CODE_A.length)]).join('');
const MY=rcode(8);
const NET={mode:'off',ws:null,code:'',st:null,lastHost:0,lastHb:0,lastPr:0};
let HS=null;
function wsURL(room,role){const b=window.GLITCHBOX_WS&&!/PLACEHOLDER/i.test(window.GLITCHBOX_WS)?window.GLITCHBOX_WS:(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws';return b+'?room='+encodeURIComponent(room)+'&role='+role}
function netConnect(room,role){
  netClose();NET.code=room;NET.mode=role;NET.lastHost=Date.now();
  let ws;try{ws=new WebSocket(wsURL(room,role))}catch(e){mpHome('Couldn\'t reach the game server.');return}
  NET.ws=ws;
  ws.onopen=()=>ws.send(JSON.stringify(role==='host'?{t:'create',code:room,max:MAXP}:{t:'join',code:room}));
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onNet(m)};
  ws.onclose=()=>{if(NET.ws===ws){NET.ws=null;if(NET.mode!=='off')mpLost('Lost the connection to the game.')}};
}
function netSend(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o))}
function netClose(){const w=NET.ws;NET.ws=null;if(w){w.onclose=null;try{w.close()}catch(e){}}}
const myName=()=>(S.name||'Mechanic').slice(0,12);
function toHost(m){if(NET.mode==='host')hostIn(m);else netSend(m)}
function onNet(m){
  if(m.t==='created'){HS={ph:'lobby',players:[],seed:0,lvl:3,n:3,pro:false,end:0,finN:0,seen:{}};hostIn({t:'hi',cid:MY,name:myName(),hue:S.hue});return}
  if(m.t==='joined'||m.t==='start'){if(NET.mode==='guest')netSend({t:'hi',cid:MY,name:myName(),hue:S.hue});return}
  if(m.t==='error'){const t=m.msg||'That didn\'t work.';netClose();NET.mode='off';mpHome(t==='No game with that code.'?'No room with that code — check the letters.':t);return}
  if(m.t==='left')return;
  if(NET.mode==='host'){hostIn(m);return}
  if(m.to&&m.to!==MY)return;
  if(m.t==='st')clientState(m);
  else if(m.t==='full'){netClose();NET.mode='off';mpHome('That room is full (8 players).')}
}
const HP=cid=>HS.players.find(p=>p.cid===cid);
function hostIn(m){
  if(!HS)return;
  if(m.cid)HS.seen[m.cid]=Date.now();
  if(m.t==='hi'){const p=HP(m.cid);if(p){p.name=String(m.name||p.name).slice(0,12);p.hue=+m.hue||0}
    else{if(HS.players.length>=MAXP){netSend({t:'full',to:m.cid});return}HS.players.push({cid:m.cid,name:String(m.name||'Mechanic').slice(0,12),hue:+m.hue||0,i:0,cash:START_CASH,fin:0})}
    hostPush();}
  else if(m.t==='pr'){const p=HP(m.cid);if(!p||HS.ph!=='race')return;p.i=clamp(m.i|0,0,HS.n);p.cash=clamp(Math.round(+m.cash||0),-9999,99999);if(m.fin&&!p.fin)p.fin=++HS.finN;if(HS.players.every(q=>q.fin))HS.ph='results';hostPush()}
  else if(m.t==='bye')hostDrop(m.cid);
}
function hostDrop(cid){if(cid===MY)return;HS.players=HS.players.filter(p=>p.cid!==cid);if(HS.ph==='race'&&HS.players.length&&HS.players.every(q=>q.fin))HS.ph='results';hostPush()}
function hostStart(){if(!HS||HS.players.length<2)return false;HS.seed=1+Math.floor(Math.random()*1e6);HS.ph='race';HS.finN=0;HS.end=Date.now()+HS.n*480000;HS.players.forEach(p=>{p.i=0;p.cash=START_CASH;p.fin=0});hostPush();return true}
function hostTick(){if(NET.mode!=='host'||!HS)return;const now=Date.now();for(const p of HS.players.slice())if(p.cid!==MY&&now-(HS.seen[p.cid]||now)>GONE)hostDrop(p.cid);if(HS.ph==='race'&&now>HS.end){HS.ph='results';hostPush()}if(now-(HS.lastPush||0)>1500)hostPush()}
function hostPush(){HS.lastPush=Date.now();const st={t:'st',ph:HS.ph,h:MY,seed:HS.seed,lvl:HS.lvl,n:HS.n,pro:HS.pro,end:HS.end,pl:HS.players.map(p=>[p.cid,p.name,p.hue,p.i,p.cash,p.fin])};netSend(st);clientState(st)}
const PL=a=>({cid:a[0],name:a[1],hue:a[2],i:a[3],cash:a[4],fin:a[5]});
const scoreOf=p=>p.cash+(p.fin&&p.fin<=3?FIN_BONUS[p.fin-1]:0);
function raceClock(){const st=NET.st;if(!st||!st.end)return'';const s=Math.max(0,Math.ceil((st.end-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function clientState(m){
  NET.st=m;NET.lastHost=Date.now();
  const pl=m.pl.map(PL),me=pl.find(p=>p.cid===MY);
  if(m.ph==='lobby'){if(mode!=='lobby'){mpReset();mode='lobby'}renderLobby();return}
  if(!me)return;
  if(m.ph==='race'){if(!RACE||RACE.seed!==m.seed)startRace(m);else if(mode==='wait')renderWait()}
  else if(m.ph==='results')showResults();
  renderChips();
}
function startRace(m){
  hideSheet();$('mpOv').classList.remove('on');$('titleOv').classList.remove('on');
  RACE={seed:m.seed,jobs:jobsFor(m.seed,m.lvl,m.n),i:0,fin:false};
  C={cash:START_CASH,upg:m.pro?Object.fromEntries(UPG.map(u=>[u.id,1])):{},inv:[],fluid:{oil:0,cool:0},sock:10};
  mode='race';raceNext(true);msg('🏁 '+m.n+' cars, the same ones for everyone. Most cash wins.');
}
function raceNext(first){
  if(!first)RACE.i++;
  if(RACE.i>=RACE.jobs.length){RACE.fin=true;cur=null;mode='wait';sendPr();renderWait();return}
  cur=newCar(RACE.jobs[RACE.i]);resetBench();mode='race';UI();renderTop();sendPr();
}
function sendPr(){NET.lastPr=Date.now();toHost({t:'pr',cid:MY,i:RACE?RACE.i:0,cash:C.cash,fin:RACE&&RACE.fin?1:0})}
function raceAfter(r){msg(cur.job.face+' “'+r.line+'” '+(r.total>=0?'+':'')+money(r.total),r.good?'good':'bad');mode='sheet';setTimeout(()=>{if(RACE&&mode==='sheet')raceNext()},900)}
function renderChips(){
  const st=NET.st,el=$('chips');
  if(!st||NET.mode==='off'||(mode!=='race'&&mode!=='sheet')||st.ph!=='race'){el.classList.remove('on');return}
  el.classList.add('on');
  el.innerHTML=st.pl.map(PL).sort((a,b)=>scoreOf(b)-scoreOf(a)).map(p=>`<div class="chip${p.cid===MY?' me':''}"><i style="background:hsl(${p.hue},70%,60%)"></i>${esc(p.name)} <b>${money(p.cash)}</b> ${p.fin?'🏁':'🚗'+Math.min(p.i+1,st.n)+'/'+st.n}</div>`).join('');
}
function mpReset(){cur=null;RACE=null;C=S;hideSheet();$('chips').classList.remove('on');$('titleOv').classList.remove('on')}
function mpHome(err){
  mode='mphome';mpReset();
  $('mpCard').innerHTML=`<h2>👥 Garage Race</h2>
    <div class="sub" style="margin-top:0">Same broken cars for everyone. Most cash at the end wins.</div>
    <input class="in" id="myName" maxlength="12" placeholder="Your name" value="${esc(S.name||'')}">
    <button class="big" id="mkRoom">🏠 Make a room</button>
    <div class="or">— or join a friend —</div>
    <input class="in" id="joinCode" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
    <button class="big alt" id="joinRoom">🚪 Join</button>
    <div class="err" id="mpErr">${esc(err||'')}</div>
    <button class="big alt" id="mpBack">◀ Back</button>`;
  $('mpOv').classList.add('on');
  $('joinCode').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'')};
}
function readName(){const n=($('myName')&&$('myName').value||'').trim().slice(0,12);if(n){S.name=n;save()}return n}
const LVLS=[[1,'🟢 Easy'],[3,'🟡 Normal'],[5,'🔴 Hard']];
function renderLobby(){
  const st=NET.st;if(!st)return;
  const pl=st.pl.map(PL),host=st.h===MY,need=Math.max(0,2-pl.length);
  $('mpCard').innerHTML=`<h2>👥 Garage Race</h2><div class="sub" style="margin:0">Room code — tell your friends:</div>
    <div class="code">${esc(NET.code)}</div>
    <div class="plist">${pl.map(p=>`<div class="prow${p.cid===MY?' me':''}"><i style="background:hsl(${p.hue},70%,60%)"></i><span>${esc(p.name)}${p.cid===MY?' (you)':''}</span>${p.cid===st.h?'👑':''}</div>`).join('')}</div>
    ${host?`<div class="opt">${[2,3,5].map(n=>`<button data-n="${n}" class="${st.n===n?'on':''}">🚗 ${n} cars</button>`).join('')}</div>
      <div class="opt">${LVLS.map(([d,n])=>`<button data-lvl="${d}" class="${st.lvl===d?'on':''}">${n}</button>`).join('')}</div>
      <div class="opt"><button data-pro="1" class="${st.pro?'on':''}">🧰 Pro tools ${st.pro?'ON':'off'}</button></div>
      <button class="big gr" id="raceGo" ${need?'disabled':''}>${need?'Waiting for a friend…':'▶ Start the race'}</button>`
    :`<div class="sub">${st.n} cars · ${(LVLS.find(l=>l[0]===st.lvl)||LVLS[1])[1]}${st.pro?' · 🧰 Pro tools':''}<br>Waiting for ${esc((pl.find(p=>p.cid===st.h)||{}).name||'the host')} to start…</div>`}
    <button class="big alt" id="mpLeave">🚪 Leave</button>`;
  $('mpOv').classList.add('on');
}
function renderWait(){
  const st=NET.st;if(!st)return;const pl=st.pl.map(PL).sort((a,b)=>scoreOf(b)-scoreOf(a));
  $('mpCard').innerHTML=`<h2>🏁 You're done!</h2><div class="sub">Waiting for the others… ⏱ ${raceClock()}</div>
    <div class="plist">${pl.map(p=>`<div class="prow${p.cid===MY?' me':''}"><i style="background:hsl(${p.hue},70%,60%)"></i><span>${esc(p.name)}</span>${p.fin?'🏁':'🚗 '+Math.min(p.i+1,st.n)+'/'+st.n} · <b>${money(p.cash)}</b></div>`).join('')}</div>
    <button class="big alt" id="mpLeave">🚪 Leave</button>`;
  $('mpOv').classList.add('on');
}
function showResults(){
  const st=NET.st,first=mode!=='results';
  if(first&&RACE&&!RACE.fin&&cur&&!cur.gone){cur=null}
  mode='results';hideSheet();$('chips').classList.remove('on');
  const pl=st.pl.map(PL).sort((a,b)=>scoreOf(b)-scoreOf(a));
  $('mpCard').innerHTML=`<h2>🏆 Garage Race results</h2>
    <div class="plist">${pl.map((p,k)=>`<div class="prow${p.cid===MY?' me':''}">${['🥇','🥈','🥉'][k]||'🎖️'}<i style="background:hsl(${p.hue},70%,60%)"></i><span>${esc(p.name)}${p.fin&&p.fin<=3?` <small style="color:var(--gold)">+${money(FIN_BONUS[p.fin-1])} finish</small>`:''}</span><b>${money(scoreOf(p))}</b></div>`).join('')}</div>
    <div class="sub">${esc(pl[0].name)} runs the best garage in town!</div>
    ${st.h===MY?'<button class="big gr" id="raceAgain">▶ Play again</button>':'<div class="sub">The host can start another race.</div>'}
    <button class="big alt" id="mpLeave">🚪 Leave</button>`;
  $('mpOv').classList.add('on');
  if(first){sfx('cash');const me=pl.find(p=>p.cid===MY);try{if(!DEMO&&me&&window.GLITCHBOX&&GLITCHBOX.score)GLITCHBOX.score(Math.max(0,Math.round(scoreOf(me))))}catch(e){}}
}
function mpLeave(){if(NET.mode==='guest')netSend({t:'bye',cid:MY});netClose();NET.mode='off';NET.st=null;HS=null;mpReset();$('mpOv').classList.remove('on');goTitle()}
function mpLost(t){netClose();NET.mode='off';NET.st=null;HS=null;mpHome(t)}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='mkRoom'){readName();netConnect(rcode(4),'host');$('mpErr').textContent='Making a room…'}
  else if(t.id==='joinRoom'){const c=$('joinCode').value.trim();if(c.length<4){$('mpErr').textContent='Type the 4-letter code from your friend\'s screen.';return}readName();netConnect(c,'guest');$('mpErr').textContent='Joining…'}
  else if(t.id==='mpBack'){$('mpOv').classList.remove('on');goTitle()}
  else if(t.id==='mpLeave')mpLeave();

  else if(NET.mode==='host'&&HS&&HS.ph==='lobby'){if(t.dataset.n){HS.n=+t.dataset.n;hostPush()}else if(t.dataset.lvl){HS.lvl=+t.dataset.lvl;hostPush()}else if(t.dataset.pro){HS.pro=!HS.pro;hostPush()}}
});
setInterval(()=>{
  hostTick();const now=Date.now();
  if(NET.mode==='guest'){if(now-NET.lastHb>4000){NET.lastHb=now;netSend({t:'hb',cid:MY})}if(NET.st&&now-NET.lastHost>GONE)mpLost('The host left the game.')}
  if(NET.mode!=='off'&&RACE&&now-NET.lastPr>3000)sendPr();

},250);
addEventListener('pagehide',()=>{if(NET.mode==='guest')netSend({t:'bye',cid:MY})});

// ═══════════════════════ #smoke self-test ═══════════════════════
if(HASH==='#smoke')addEventListener('DOMContentLoaded',()=>{
  DEMO=true;const out=[];let pass=0,fail=0;
  const ok=(c,n)=>{if(c)pass++;else{fail++;out.push('FAIL '+n)}};
  const fresh2=()=>{S=fresh();S.sound=false;C=S;mode='solo'};
  const solve=(P,lim=900)=>{cur=P;let n=0,r=null;while(n++<lim){const h=advise();if(!h)break;const res=doAct(h.act);if(h.act.k==='handback'){r=res;break}if(res===false){out.push('stuck on '+JSON.stringify(h.act)+' '+P.model+' '+P.job.faults+' view='+P.view);break}}if(n>=lim)out.push('loop '+P.job.faults+' last '+JSON.stringify(advise().act));return r};
  const rnd=v=>{const mr=Math.random;Math.random=()=>v;return()=>{Math.random=mr}};
  try{
    let r=null;
    // 1. every job can be fixed cleanly
    let done=0,perfect=0;const models=new Set();
    for(let lvl=1;lvl<=6;lvl++){fresh2();S.day=2;C.cash=99999;
      for(const j of jobsFor(500+lvl,lvl,30)){const r=solve(newCar(j));done++;models.add(j.model);if(r&&r.good&&!r.pens.length&&!r.caused)perfect++;else out.push('lvl'+lvl+' '+j.faults.join('+')+' '+j.model+' → '+JSON.stringify(r&&{good:r.good,pens:r.pens,line:r.line}))}}
    ok(perfect===done,'every job can be fixed cleanly ('+perfect+'/'+done+')');
    ok(models.size===3,'all three models show up');
    const seen=new Set();for(let lvl=1;lvl<=6;lvl++)jobsFor(500+lvl,lvl,30).forEach(j=>j.faults.forEach(f=>seen.add(f)));
    ok(['battery','belt','oil','plug','brakes','coil','hose','alternator'].every(k=>seen.has(k)),'all fault types appear by day 6');
    ok(jobsFor(5,1,40).every(j=>j.faults.length===1&&FAULTS[j.faults[0]].day<=1),'day 1 = one easy fault');
    ok(JSON.stringify(jobsFor(77,3,5))===JSON.stringify(jobsFor(77,3,5)),'same seed, same cars (race fairness)');
    // 2. consequences
    fresh2();S.day=3;C.cash=9999;
    const mk=(f,model,extra)=>{cur=newCar(Object.assign(makeJob(rngOf(2),3),{faults:f,model:model||'kestrel',cyl:2},extra||{}));return cur};
    let P=mk(['battery']);quiet=true;C.sock=10;let rs=rnd(.01);fastAct('batP','ratchet');rs();quiet=false;ok(P.part.fuse.bad==='fuse'&&!powered(),'positive off first with the negative on → spark, blown fuse');
    P=mk(['battery']);quiet=true;C.sock=10;fastAct('batN','ratchet');rs=rnd(.01);fastAct('batP','ratchet');rs();quiet=false;ok(!P.part.fuse.bad,'negative first, then positive → safe');
    P=mk(['alternator']);quiet=true;C.sock=10;fastAct('altBp','ratchet');quiet=false;ok(P.part.fuse.bad==='fuse','undoing the alternator B+ cable live → spark');
    P=mk(['battery']);quiet=true;C.sock=13;ok(!fastAct('batN','ratchet'),'wrong socket won\'t fit');C.sock=10;ok(fastAct('batN','ratchet'),'right socket works');quiet=false;
    P=mk(['belt']);quiet=true;ok(!beltAct()&&P.part.belt,'belt won\'t come off under tension');slackBelt();ok(beltAct()&&!P.part.belt,'tensioner released → belt off');quiet=false;
    P=mk(['oil']);quiet=true;toggleLift();P.liftT=1;P.view='lift';C.sock=15;fastAct('drain','ratchet');quiet=false;for(let i=0;i<60;i++)step(.1);ok(P.spill>.5&&P.drained,'no drain pan → oil all over the floor');
    P=mk(['oil']);quiet=true;toggleLift();P.liftT=1;placePan('oil');C.sock=15;fastAct('drain','ratchet');quiet=false;for(let i=0;i<60;i++)step(.1);ok(P.spill<.05&&P.drained,'drain pan catches it');
    // starting with no oil seizes it
    P.lift=false;P.liftT=0;quiet=true;fastAct('drain','ratchet');P.f.drain='tight';ok(toggleEngine(),'it starts with an empty sump…');quiet=false;for(let i=0;i<40;i++)step(.1);ok(P.seized&&!P.run,'…and seizes within seconds');
    quiet=true;ok(!toggleEngine(),'a seized engine won\'t turn');quiet=false;
    P=mk(['hose']);quiet=true;P.temp=95;toggleCap('rad');quiet=false;ok(P.damage.length===1,'opening a hot radiator cap scalds you');
    P=mk(['brakes']);quiet=true;toggleLift();P.liftT=1;C.sock=19;ok(!fastAct('L0:FL','ratchet'),'tight lug nut on a lifted wheel just spins');toggleLift();P.liftT=0;ok(fastAct('L0:FL','ratchet'),'cracks loose on the ground');quiet=false;
    P=mk(['brakes']);quiet=true;C.sock=19;for(let n=0;n<5;n++)fastAct('L'+n+':FL','ratchet');toggleLift();P.liftT=1;removePart('wheel:FL');quiet=false;toggleLift();ok(P.damage.length===1,'lowering with a wheel off drops it on the rotor');
    P=mk(['brakes']);quiet=true;C.sock=19;for(let n=0;n<5;n++)fastAct('L'+n+':FL','ratchet');toggleLift();P.liftT=1;removePart('wheel:FL');C.sock=14;fastAct('K1:FL','ratchet');fastAct('K2:FL','ratchet');removePart('caliper:FL');removePart('pads:FL');buy('pads','kestrel');installPart('pads:FL');
    ok(!installPart('caliper:FL'),'new pads + extended piston → caliper won\'t fit');compress('FL');ok(installPart('caliper:FL'),'piston pushed back → fits');quiet=false;
    P=mk(['plug']);quiet=true;C.sock=10;toggleConn('coilC2');fastAct('coilB2','ratchet');removePart('coil2');C.sock=16;fastAct('plug2','ratchet');removePart('plug2');buy('plug','kestrel');installPart('plug2');fastAct('plug2','ratchet');ok(P.f.plug2==='snug','plug snugged with the ratchet…');
    fastAct('plug2','torque');ok(P.f.plug2==='tight','…torqued with the torque wrench');quiet=false;
    P=mk(['battery']);quiet=true;ok(!fastAct('batN','torque'),'torque wrench refuses non-spec bolts');quiet=false;
    P=mk(['coil']);quiet=true;ok(toggleEngine()&&P.run,'a misfiring engine still runs');ok(!fastAct('coilB1','ratchet'),'can\'t wrench on a running engine');toggleEngine();quiet=false;
    P=mk(['battery']);quiet=true;ok(!toggleEngine(),'dead battery: clicks, no start');quiet=false;
    // measurements are numbers
    P=mk(['alternator']);quiet=true;toggleEngine();measure('battery');ok(/12\.2 V/.test(P.notes.at(-1).txt),'bad alternator → 12.2 V running');toggleEngine();quiet=false;
    P=mk(['coil'],'kestrel',{cyl:3});quiet=true;measure('coil3');ok(/∞/.test(P.notes.at(-1).txt),'open coil reads ∞');measure('coil1');ok(/6\.8/.test(P.notes.at(-1).txt),'good coil reads 6.8 kΩ');ok(scan().some(c=>/P0303/.test(c)),'scan tool reports the misfiring cylinder');quiet=false;
    // hand back guards + penalties
    P=mk(['belt']);quiet=true;toggleLift();quiet=false;ok(handBack()===null,'can\'t hand back while it\'s on the lift');
    P=mk(['belt']);r=solve(P);ok(r&&r.good,'belt job ok');
    P=mk(['brakes']);r=null;for(let n=0;n<300;n++){const h=advise();if(h.act.k==='torque'&&FASTBY[h.act.id].lug)break;doAct(h.act)}r=handBack();ok(r&&r.pens.some(p=>/wobbling/.test(p[0])),'untorqued lug nuts → wobbling wheel penalty');
    // credit
    C.cash=10;ok(buy('alternator','kestrel')&&C.cash<0,'running a parts account');C.cash=CREDIT+5;ok(!buy('alternator','kestrel'),'…up to the limit');C.cash=9999;
    // 3. rendering: every view draws for every model in many states
    W=W||900;H=H||700;let drawn=0;
    for(const m of CAR_IDS){for(const v of['bay','lift','wheel:FL','wheel:RR']){P=mk(['coil','hose','brakes'].slice(0,3),m);P.view=v;P.run=v==='bay';P.lift=true;P.liftT=1;P.cap.oil=true;P.pan='oil';P.f.drain='out';P.oil=.5;P.spill=.4;P.read={txt:'BATT  12.6 V',x:20,y:20,v:'bay',life:3};
      if(v==='wheel:FL'){P.part['wheel:FL']=null;P.wheelOff={FL:{model:m}};P.part['caliper:FL']=null;P.hang={FL:{model:m}}}
      mode='solo';geom();render();drawn++}}
    ok(drawn===12,'all views draw for all models (engine running, lifted, wheel off, caliper hanging, spill)');
    P=mk(['battery']);for(const k of Object.keys(P.part))P.part[k]=null;render();ok(true,'a stripped car draws');
    // 4. solo day flow
    fresh2();startDay();ok(DAY.jobs.length===3&&cur&&mode==='solo','day 1 has three customers');
    for(let k=0;k<3;k++){C.cash+=900;const r2=solve(cur);ok(r2&&r2.good,'day-1 job '+(k+1)+' solved');nextJob()}
    hideSheet();ok(mode==='sheet'&&!cur,'day ends after the last customer');
    // 5. multiplayer host logic
    fresh2();NET.mode='host';onNet({t:'created'});
    hostIn({t:'hi',cid:'g1',name:'Bo',hue:40});hostIn({t:'hi',cid:'g1',name:'Bo',hue:50});ok(HS.players.length===2&&HP('g1').hue===50,'a repeat hello updates, never duplicates');
    ok(hostStart()&&HS.ph==='race'&&RACE&&RACE.jobs.length===3&&mode==='race','host starts → everyone gets the same cars');
    ok(C!==S&&C.cash===START_CASH,'race uses its own wallet');
    hostIn({t:'pr',cid:'g1',i:3,cash:900,fin:1});ok(HP('g1').fin===1,'finisher recorded');
    while(RACE&&RACE.i<RACE.jobs.length&&mode!=='wait'&&mode!=='results'){C.cash+=900;const r3=solve(cur);ok(r3&&r3.good,'race car '+(RACE.i+1));raceNext()}
    ok(HS.ph==='results'&&mode==='results','everyone done → results');
    NET.mode='off';HS=null;
    // 6. tutorial + no hints
    fresh2();startDay();renderTut();ok($('tut').classList.contains('on'),'day 1 shows the tutorial card');
    S.tutOff=true;renderTut();ok(!$('tut').classList.contains('on'),'skip hides it');S.tutOff=false;
    for(let k=0;k<400;k++){const h=advise();if(!h||h.act.k==='handback')break;if(!tutText()){ok(false,'tutorial has words for '+h.act.k);break}doAct(h.act)}ok(true,'tutorial text covers every step');
    ok(!!document.querySelector('script[src="glitchbox-menu.js"]'),'quit button script present');
  }catch(e){fail++;out.push('EXCEPTION '+e.message+'\n'+e.stack)}
  quiet=false;
  const pre=document.createElement('pre');pre.id='smokeout';pre.textContent=(fail?'SMOKE FAIL':'SMOKE PASS')+' '+pass+'/'+(pass+fail)+'\n'+out.join('\n');
  pre.style.cssText='position:fixed;inset:0;z-index:99;background:#000;color:#0f0;margin:0;padding:10px;overflow:auto;font-size:12px';
  document.body.appendChild(pre);document.title=(fail?'SMOKE FAIL ':'SMOKE PASS ')+pass+'/'+(pass+fail);
});
