<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Heist Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="glitchbox-config.js"></script>
<script src="glitchbox-save.js" data-pos="top-left"></script>
<style>
:root{--bg:#07090f;--panel:#121722;--panel2:#1a2130;--line:#2a3346;--ink:#eaf0f8;--dim:#8d99ad;--acc:#ffcf3a;--green:#3ddc84;--red:#ff4d5e;--cyan:#39d0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:10px 12px 10px 112px;pointer-events:none;z-index:3}
.pill{background:rgba(10,13,20,.86);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap;backdrop-filter:blur(4px)}
.pill.loot{color:#9ff0c2}.pill.alarm{color:#ff8a8a;border-color:#7a2a30;animation:pulse 1s infinite}.pill.stealth{color:#bfe9ff}
@keyframes pulse{50%{background:rgba(80,10,16,.9)}}
#hud .sp{flex:1}
#crew{position:fixed;right:12px;top:58px;display:flex;flex-direction:column;gap:5px;z-index:3;pointer-events:none}
.cr{background:rgba(10,13,20,.86);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;display:flex;gap:7px;align-items:center}
.cr i{width:10px;height:10px;border-radius:50%}
.cr.down{border-color:#7a2a30;color:#ff9aa2}.cr.esc{border-color:#2a6b45;color:#9ff0c2}
#prompt{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(10,13,20,.9);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:15px;font-weight:600;z-index:3;display:none;pointer-events:none;white-space:nowrap}
#prompt b{color:var(--acc);font-family:'JetBrains Mono',monospace}
#prompt .bar{height:4px;border-radius:2px;background:#26304a;margin-top:6px;overflow:hidden}
#prompt .bar div{height:100%;background:var(--acc);width:0}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4;width:min(92%,520px)}
.tst{background:rgba(10,13,20,.93);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:500;font-size:15px;text-align:center;animation:tin .25s ease-out;transition:opacity .4s}
.tst.bad{border-color:var(--red);color:#ffc4ca}.tst.good{border-color:var(--green);color:#c8ffe0}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#touch{position:fixed;inset:0;z-index:2;display:none;pointer-events:none}
#touch.on{display:block}
#stick{position:absolute;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);pointer-events:auto}
#nub{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25)}
#tbtns{position:absolute;right:20px;bottom:24px;display:grid;grid-template-columns:auto auto;gap:10px;pointer-events:auto}
#tbtns button{width:66px;height:66px;border-radius:50%;background:rgba(10,13,20,.8);border:2px solid var(--line);font-weight:800;font-size:15px}
#tbtns button.e{width:80px;height:80px;border-color:var(--acc);color:var(--acc);font-size:20px}
#tbtns button.on{border-color:var(--cyan);color:var(--cyan)}
.ov{position:fixed;inset:0;background:rgba(3,5,10,.78);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.ov.on{display:flex}
.box{background:linear-gradient(#161c29,#10141e);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.box h1{margin:0;font-size:46px;font-weight:800;letter-spacing:1px}
.box h1 b{color:var(--acc)}
.box h2{margin:0 0 8px;font-size:24px}
.box p,.sub{color:var(--dim);font-size:15px;line-height:1.45;margin:8px 0}
.big{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;background:var(--acc);color:#2a1f00;font-weight:800;font-size:18px;box-shadow:0 4px 0 #b38c12}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #b38c12}
.big.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.big.gr{background:var(--green);color:#052615;box-shadow:0 4px 0 #23985a}
.big:disabled{opacity:.45}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b0f18;color:var(--ink);font:inherit;font-size:18px;text-align:center;margin-top:8px}
.code{font-size:46px;font-weight:800;letter-spacing:10px;color:var(--acc);margin:6px 0}
.opt{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.opt button{padding:7px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.opt button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;text-align:left}
.role{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--dim);line-height:1.35}
.role b{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}
.role.mine{border-color:var(--acc)}
.role.taken{opacity:.55}
.role em{font-style:normal;color:var(--acc);font-weight:700}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.prow{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}
.prow span{flex:1}.prow i{width:12px;height:12px;border-radius:50%}
.err{color:var(--red);min-height:20px;margin-top:6px;font-size:14px}
.or{color:var(--dim);margin:12px 0 0;font-size:13px}
.tl{text-align:left;display:flex;flex-direction:column;gap:6px;margin:12px 0}
.tl div{display:flex;justify-content:space-between;background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:15px}
.tl .p{color:#9ff0c2}.tl .f{color:#ffb0b8}
.stars{color:var(--acc);font-size:24px;letter-spacing:2px}
.how{text-align:left;font-size:14px;color:var(--dim);line-height:1.5}.how b{color:var(--ink)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><div class="pill loot" id="hLoot">💰 $0</div><div class="pill stealth" id="hAlarm">🤫 Stealth</div><div class="pill" id="hBag">🎒 empty</div><div class="sp"></div></div>
<div id="crew"></div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="touch"><div id="stick"><div id="nub"></div></div><div id="tbtns"><button id="tQ">Q</button><button class="e" id="tE">E</button><button id="tSn">🤫</button><button id="tG">Drop</button></div></div>

<div class="ov on" id="titleOv"><div class="box">
  <h1>HEIST <b>CREW</b></h1>
  <p>Get in, get the money, get out. Guards patrol, cameras sweep, and if anyone sees you the police are on their way.</p>
  <button class="big" id="playOnline">👥 Plan a heist with friends</button>
  <button class="big alt" id="playSolo">🕶️ Solo heist (you do every job)</button>
  <button class="big alt" id="howBtn">📋 The crew & controls</button>
</div></div>
<div class="ov" id="mpOv"><div class="box" id="mpCard"></div></div>
<div class="ov" id="sheetOv"><div class="box" id="sheet"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const HASH=location.hash.replace(/-debug$/,'');
let DEMO=false;
function rngOf(seed){let s=seed>>>0||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d};
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ═══════════════════════ data ═══════════════════════
const ROLES={
  hacker:{n:'Hacker',e:'💻',col:'#3ddc84',d:'Hacks keycard doors and security terminals — loops the cameras, kills the art sensors and releases the vault time-lock.'},
  locksmith:{n:'Locksmith',e:'🔓',col:'#ffb020',d:'Picks locks and cracks safes silently. Everyone else has to crowbar and drill — loudly.'},
  muscle:{n:'Muscle',e:'💪',col:'#ff5a4a',d:'Takes guards down from behind, ties up civilians fast and carries two bags.'},
  lookout:{n:'Lookout',e:'👁️',col:'#39d0ff',d:'Sees every guard and camera through walls. [Q] throws a smoke bomb that blocks sight.'},
};
const ROLE_IDS=Object.keys(ROLES);
const LOOT={cash:{n:'cash',v:4000,heavy:false},gold:{n:'gold bars',v:12000,heavy:true},jewels:{n:'jewels',v:6000,heavy:false},art:{n:'painting',v:9000,heavy:false}};
const HEISTS={bank:{n:'🏦 First Harbor Bank',short:'Bank'},gallery:{n:'🖼️ Laurent Gallery',short:'Gallery'},jewel:{n:'💎 Varga Jewelers',short:'Jewelers'}};
const DIFFS={easy:{n:'🟢 Easy',guards:2,cams:2,civs:1,police:120},normal:{n:'🟡 Normal',guards:3,cams:4,civs:2,police:90},hard:{n:'🔴 Hard',guards:5,cams:6,civs:3,police:60}};
const MW=48,MH=36;   // map size in tiles
const BX0=3,BY0=3,BX1=44,BY1=27;   // building walls (inclusive)

// ═══════════════════════ map generation ═══════════════════════
// tiles: 0 outside, 1 floor, 2 wall, 3 door. Rooms come from a BSP split; doors from a spanning tree of shared walls.
function genHeist(seed,type,diff){
  const r=rngOf(seed),D=DIFFS[diff]||DIFFS.normal;
  const T=new Uint8Array(MW*MH),RM=new Int16Array(MW*MH).fill(-1),SOLID=new Uint8Array(MW*MH),TALL=new Uint8Array(MW*MH);
  const at=(x,y)=>y*MW+x;
  for(let y=BY0;y<=BY1;y++)for(let x=BX0;x<=BX1;x++)T[at(x,y)]=(x===BX0||x===BX1||y===BY0||y===BY1)?2:1;
  const rooms=[];
  (function split(x,y,w,h,d){
    const canV=w>=15,canH=h>=12;
    if((!canV&&!canH)||d>5||(w*h<130&&r()<.5)){rooms.push({x,y,w,h});return}
    if(canV&&(!canH||w>h*1.15||r()<.5)){const s=x+6+Math.floor(r()*(w-13));for(let yy=y;yy<y+h;yy++)T[at(s,yy)]=2;split(x,y,s-x,h,d+1);split(s+1,y,x+w-s-1,h,d+1)}
    else{const s=y+5+Math.floor(r()*(h-11));for(let xx=x;xx<x+w;xx++)T[at(xx,s)]=2;split(x,y,w,s-y,d+1);split(x,s+1,w,y+h-s-1,d+1)}
  })(BX0+1,BY0+1,BX1-BX0-1,BY1-BY0-1,0);
  rooms.forEach((rm,i)=>{rm.id=i;for(let y=rm.y;y<rm.y+rm.h;y++)for(let x=rm.x;x<rm.x+rm.w;x++)RM[at(x,y)]=i;rm.cx=rm.x+rm.w/2;rm.cy=rm.y+rm.h/2});
  // candidate doors on shared walls
  const cands=[];
  for(const a of rooms)for(const b of rooms){if(a.id>=b.id)continue;
    if(a.x+a.w+1===b.x||b.x+b.w+1===a.x){const wx=a.x+a.w+1===b.x?a.x+a.w:b.x+b.w;const y0=Math.max(a.y,b.y)+1,y1=Math.min(a.y+a.h,b.y+b.h)-2;if(y1>=y0)cands.push({a:a.id,b:b.id,pts:Array.from({length:y1-y0+1},(_,k)=>[wx,y0+k]),vert:true})}
    if(a.y+a.h+1===b.y||b.y+b.h+1===a.y){const wy=a.y+a.h+1===b.y?a.y+a.h:b.y+b.h;const x0=Math.max(a.x,b.x)+1,x1=Math.min(a.x+a.w,b.x+b.w)-2;if(x1>=x0)cands.push({a:a.id,b:b.id,pts:Array.from({length:x1-x0+1},(_,k)=>[x0+k,wy]),vert:false})}}
  const par=rooms.map((_,i)=>i),find=i=>par[i]===i?i:(par[i]=find(par[i]));
  const doors=[],adj=rooms.map(()=>[]);
  const addDoor=(c,lock)=>{const p=pick(r,c.pts);T[at(p[0],p[1])]=3;const d={id:doors.length,x:p[0],y:p[1],vert:c.vert,a:c.a,b:c.b,lock:lock||'none',ext:false};doors.push(d);adj[c.a].push([c.b,d.id]);adj[c.b].push([c.a,d.id]);return d};
  for(const c of shuffle(r,cands)){if(find(c.a)!==find(c.b)){par[find(c.a)]=find(c.b);addDoor(c)}}
  for(const c of shuffle(r,cands))if(r()<.22&&!doors.some(d=>(d.a===c.a&&d.b===c.b)||(d.a===c.b&&d.b===c.a)))addDoor(c);
  // lobby: the widest room on the street side; the front door goes in its bottom wall
  const street=rooms.filter(rm=>rm.y+rm.h===BY1).sort((a,b)=>b.w-a.w);
  const lobby=street[0];const fx=lobby.x+Math.floor(lobby.w/2);T[at(fx,BY1)]=3;
  const front={id:doors.length,x:fx,y:BY1,vert:false,a:lobby.id,b:-1,lock:'none',ext:true};doors.push(front);
  // room depth from the lobby
  const depth=rooms.map(()=>99);depth[lobby.id]=0;const q=[lobby.id];while(q.length){const i=q.shift();for(const[j]of adj[i])if(depth[j]>depth[i]+1){depth[j]=depth[i]+1;q.push(j)}}
  rooms.forEach(rm=>{rm.depth=depth[rm.id];rm.deg=adj[rm.id].length});
  const rest=rooms.filter(rm=>rm!==lobby);
  let vault=null,security=null;
  const linked=(skip)=>{const seen=new Set([lobby.id]),qq=[lobby.id];while(qq.length){const i=qq.shift();for(const d of doors){if(d.ext||skip.has(d))continue;const j=d.a===i?d.b:d.b===i?d.a:-1;if(j>=0&&!seen.has(j)){seen.add(j);qq.push(j)}}}return seen.size===rooms.length};
  if(type!=='gallery'){for(const cand of rest.slice().sort((a,b)=>(b.depth-a.depth)||(a.w*a.h-b.w*b.h))){const vd=doors.filter(d=>!d.ext&&(d.a===cand.id||d.b===cand.id));let done=false;for(const keep of vd){const skip=new Set(vd.filter(d=>d!==keep));if(linked(skip)){vault=cand;for(const d of skip){T[at(d.x,d.y)]=2;d.dead=true}keep.lock='vault';done=true;break}}if(done)break}}
  security=rest.filter(rm=>rm!==vault).sort((a,b)=>a.w*a.h-b.w*b.h)[0];
  lobby.kind='lobby';if(vault)vault.kind='vault';security.kind='security';
  const others=rest.filter(rm=>!rm.kind).sort((a,b)=>b.w*b.h-a.w*a.h);
  others.forEach((rm,i)=>{rm.kind=type==='gallery'?(i<2?'gallery':i===2?'office':pick(r,['office','storage'])):type==='jewel'?(i<2?'display':pick(r,['office','office','storage'])):(i<1?'office':pick(r,['office','office','storage']))});
  // a vault keeps exactly one door, and it's the heavy one
  for(const d of doors){if(d.dead||d.ext||d.lock==='vault')continue;if(vault&&(d.a===vault.id||d.b===vault.id))continue;const ks=[d.a,d.b].map(i=>rooms[i].kind);if(ks.includes('security'))d.lock='card';else if(r()<.28)d.lock='key'}
  const D2=doors.filter(d=>!d.dead);D2.forEach((d,i)=>d.id=i);
  // back door on the top wall (locked)
  const top=rest.filter(rm=>rm.y===BY0+1&&rm.kind!=='vault'&&rm.kind!=='security');if(top.length){const rm=pick(r,top),bx=rm.x+1+Math.floor(r()*(rm.w-2));T[at(bx,BY0)]=3;D2.push({id:D2.length,x:bx,y:BY0,vert:false,a:rm.id,b:-1,lock:'key',ext:true})}
  // furniture, loot, terminals
  const furn=[],loot=[],terms=[];
  const doorNear=(x,y)=>D2.some(d=>Math.abs(d.x-x)+Math.abs(d.y-y)<=1.5);
  const free=(x,y)=>T[at(x,y)]===1&&!SOLID[at(x,y)]&&!doorNear(x,y);
  const walkT=i=>(T[i]===1||T[i]===3)&&!SOLID[i];
  let walkCount=0;for(let i=0;i<MW*MH;i++)if(walkT(i))walkCount++;
  const allReach=()=>{const seen=new Uint8Array(MW*MH),s0=at(front.x,front.y),qq=[s0];seen[s0]=1;let n=1;while(qq.length){const c=qq.pop(),cx=c%MW,cy=(c-cx)/MW;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const i=at(nx,ny);if(!seen[i]&&walkT(i)){seen[i]=1;n++;qq.push(i)}}}return n===walkCount};
  const put=(t,x,y,w,h,solid,tall,extra)=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(!free(xx,yy))return null;
    if(solid){for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)SOLID[at(xx,yy)]=1;walkCount-=w*h;
      if(!allReach()){for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)SOLID[at(xx,yy)]=0;walkCount+=w*h;return null}
      if(tall)for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)TALL[at(xx,yy)]=1}
    const f=Object.assign({t,x,y,w,h},extra||{});furn.push(f);return f};
  const addLoot=(kind,x,y,cont,extra)=>{const l=Object.assign({id:loot.length,kind,x,y,cont,v:Math.round(LOOT[kind].v*(.8+r()*.4)/100)*100},extra||{});loot.push(l);return l};
  for(const rm of rooms){
    const{x,y,w,h}=rm;
    const along=(t,n,solid,tall,ex)=>{let k=0;for(let i=0;i<40&&k<n;i++){const side=Math.floor(r()*4);let px,py;if(side===0){px=x+Math.floor(r()*w);py=y}else if(side===1){px=x+Math.floor(r()*w);py=y+h-1}else if(side===2){px=x;py=y+Math.floor(r()*h)}else{px=x+w-1;py=y+Math.floor(r()*h)}if(put(t,px,py,1,1,solid,tall,Object.assign({side},ex||{})))k++}};
    if(rm.kind==='lobby'){
      put('rug',x+Math.floor(w/2)-2,y+Math.floor(h/2)-1,4,3,false);
      if(type==='bank'){for(let xx=x+2;xx<x+w-2;xx++)put('counter',xx,y+1,1,1,true,false)}
      if(type==='jewel'){for(let i=0;i<4;i++){const cx=x+2+Math.floor(r()*(w-4)),cy=y+1+Math.floor(r()*(h-3));const f=put('case',cx,cy,1,1,true,false);if(f)addLoot('jewels',cx+.5,cy+.5,'case',{f})}}
      along('plant',3,true,true);along('bench',2,true,false);
    }else if(rm.kind==='office'){
      for(let i=0;i<4;i++){const dx=x+1+Math.floor(r()*Math.max(1,w-3)),dy=y+1+Math.floor(r()*Math.max(1,h-3));put('desk',dx,dy,2,1,true,false,{chair:r()<.5?1:-1})}
      along('cabinet',2,true,true);along('plant',1,true,true);
      if(r()<.75){for(let i=0;i<10;i++){const sx=x+Math.floor(r()*w),sy=y;const f=put('safe',sx,sy,1,1,true,true);if(f){addLoot('cash',sx+.5,sy+.5,'safe',{f});break}}}
    }else if(rm.kind==='security'){
      for(let i=0;i<10;i++){const tx=x+Math.floor(r()*w),ty=y;const f=put('console',tx,ty,1,1,true,false);if(f){terms.push({id:terms.length,x:tx+.5,y:ty+.5,main:true,f});break}}
      along('locker',3,true,true);
    }else if(rm.kind==='vault'){
      for(let i=0;i<14;i++){const gx=x+1+Math.floor(r()*Math.max(1,w-2)),gy=y+1+Math.floor(r()*Math.max(1,h-2));const kind=r()<.55?'gold':'cash';const f=put(kind==='gold'?'pallet':'cart',gx,gy,1,1,false,false);if(f)addLoot(kind,gx+.5,gy+.5,kind==='gold'?'pallet':'cart',{f})}

// ═══════════════════════ world state ═══════════════════════
// G is the live heist. The host (or a solo player) simulates it; guests mirror it from snapshots.
let G=null,M=null,ME=null,mode='title',NETROLE='solo',quiet=false;
const PRAD=.3;
function newWorld(seed,type,diff,crew){
  M=genHeist(seed,type,diff);

  crew.forEach((c,i)=>{G.players[c.cid]={cid:c.cid,name:c.name,hue:c.hue,role:c.role,x:M.spawn[0]+(i-1.5)*.8,y:M.spawn[1],d:-Math.PI/2,carry:[],down:false,esc:false,det:0,sn:false,mv:0,smokeCD:0}});
}
const has=(p,role)=>p.role===role||p.role==='all';
const cap=p=>has(p,'muscle')?2:1;
const isSolidAt=(x,y)=>{const tx=Math.floor(x),ty=Math.floor(y);if(tx<0||ty<0||tx>=MW||ty>=MH)return true;const t=M.T[M.at(tx,ty)];if(t===2)return true;if(t===3){const d=doorAt(tx,ty);return !d||!G.doors[d.id].open}return !!M.SOLID[M.at(tx,ty)]};
function doorAt(x,y){for(const d of M.doors)if(d.x===x&&d.y===y)return d;return null}
function blocksSight(tx,ty){if(tx<0||ty<0||tx>=MW||ty>=MH)return true;const t=M.T[M.at(tx,ty)];if(t===2)return true;if(t===3){const d=doorAt(tx,ty);return !d||!G.doors[d.id].open}return !!M.TALL[M.at(tx,ty)]}
// line of sight: walk the tiles between two points
function los(x0,y0,x1,y1){

}

const GUARD_HALF=.72,GUARD_RANGE=6.5,CAM_HALF=.55,CAM_RANGE=7,CIV_HALF=1.2,CIV_RANGE=5;

function startAlarm(why){if(G.alarm>=0||G.phase!=='play')return;G.alarm=M.police;G.alarmWhy=why;G.everAlarm=true;for(const g of G.guards)if(g.st!=='ko')g.st='alert';hmsg('🚨 ALARM — '+why+'. Police in '+M.police+'s.','bad');sfx('alarm')}

// what a player can do, and how long it takes (seconds held)
function interactions(p){
  const out=[];if(!p||p.down||p.esc)return out;

  for(const d of M.doors){const s=G.doors[d.id];if(s.lock==='none'||!near(d.x+.5,d.y+.5,1.5))continue;
    if(s.lock==='key')out.push(has(p,'locksmith')?{a:'pick',id:d.id,t:1.5,txt:'Pick the lock'}:{a:'crowbar',id:d.id,t:4,txt:'Crowbar the door (loud)',loud:6});
    else if(s.lock==='card')out.push(has(p,'hacker')?{a:'hackdoor',id:d.id,t:2,txt:'Hack the keycard reader'}:{a:'none',txt:'Keycard lock: needs the hacker',dd:dist(p.x,p.y,d.x+.5,d.y+.5)});
    else if(s.lock==='vault')out.push(G.timeLock?{a:'vault',id:d.id,t:2.5,txt:'Spin the vault door open'}:{a:'none',txt:'Vault time-lock is engaged',dd:dist(p.x,p.y,d.x+.5,d.y+.5)});}

    if(l.cont==='safe')out.push(has(p,'locksmith')?{a:'grab',id:l.id,t:3,txt:'Crack the safe'}:{a:'grab',id:l.id,t:9,txt:'Drill the safe (loud)',loud:7});
    else if(l.cont==='case')out.push({a:'grab',id:l.id,t:has(p,'locksmith')?1:2,txt:'Cut the glass case',loud:has(p,'locksmith')?0:2});

  for(const q of Object.values(G.players)){if(q===p||!q.down||!near(q.x,q.y,1.1))continue;out.push({a:'revive',id:q.cid,t:2.5,txt:'Get '+q.name+' back up'})}

function dropBag(p){if(!p||!p.carry.length||p.down)return false;const b=p.carry.pop();G.bagsLying.push({x:p.x,y:p.y,kind:b.kind,v:b.v});sfx('thud');return true}

// ── the simulation (host / solo) ──
function simStep(dt){
  if(!G||G.phase!=='play')return;

  if(G.loopT>0)G.loopT=Math.max(0,G.loopT-dt);
  for(const s of G.smokes)s.t-=dt;G.smokes=G.smokes.filter(s=>s.t>0);
  const pls=Object.values(G.players);

  // doors: unlocked doors swing open for anyone close, and close again behind them
  M.doors.forEach((d,i)=>{const s=G.doors[i];if(s.lock!=='none')return;const cx=d.x+.5,cy=d.y+.5;const someone=pls.some(p=>!p.down&&!p.esc&&dist(p.x,p.y,cx,cy)<1.25)||G.guards.some(g=>g.st!=='ko'&&dist(g.x,g.y,cx,cy)<1.25)||G.civs.some(c=>dist(c.x,c.y,cx,cy)<1.2);
    if(someone){s.open=1;s.openT=Math.max(s.openT,2)}else if(s.openT<1e8){s.openT-=dt;if(s.openT<=0)s.open=0}});

      if(tgt){g.seen={x:tgt.x,y:tgt.y};g.lost=6;if(bd<.62){tgt.down=true;tgt.carry.forEach(b=>G.bagsLying.push({x:tgt.x,y:tgt.y,kind:b.kind,v:b.v}));tgt.carry=[];hmsg('🚔 '+tgt.name+' got tackled and cuffed!','bad');sfx('down')}}

      if(!g.path||g.repath<=0){g.path=M.pathTo(Math.floor(g.x),Math.floor(g.y),Math.floor(goal.x),Math.floor(goal.y))||[];g.repath=.5}g.repath-=dt;
      const nx=g.path[0];if(nx){tx=nx[0];ty=nx[1];if(dist(g.x,g.y,tx,ty)<.15)g.path.shift()}else{tx=goal.x;ty=goal.y}
    }else if(g.st==='investigate'){
      if(!g.path){g.path=M.pathTo(Math.floor(g.x),Math.floor(g.y),Math.floor(g.tx),Math.floor(g.ty))||[]}
      const nx=g.path[0];if(nx){tx=nx[0];ty=nx[1];if(dist(g.x,g.y,tx,ty)<.15)g.path.shift()}else{g.lost-=dt;g.d+=dt*1.6*Math.sin(G.t*1.3);if(g.lost<=0){g.st='return';g.path=null}}
    }else if(g.st==='return'){
      const rp=M.guards[g.id].route[g.ri];if(!g.path)g.path=M.pathTo(Math.floor(g.x),Math.floor(g.y),Math.floor(rp.x),Math.floor(rp.y))||[];
      const nx=g.path[0];if(nx){tx=nx[0];ty=nx[1];if(dist(g.x,g.y,tx,ty)<.15)g.path.shift()}else{g.st='patrol';g.path=null}
    }else{
      const route=M.guards[g.id].route,wp=route[g.ri];
      if(g.wait>0){g.wait-=dt;g.d+=Math.sin(G.t*1.1+g.id)*dt*1.2}
      else{tx=wp.x;ty=wp.y;if(dist(g.x,g.y,tx,ty)<.12){if(wp.wait)g.wait=wp.wait;g.ri=(g.ri+1)%route.length}}
    }
    if(tx!=null){const a=Math.atan2(ty-g.y,tx-g.x),d=dist(g.x,g.y,tx,ty),s=Math.min(d,fast*dt);g.x+=Math.cos(a)*s;g.y+=Math.sin(a)*s;if(d>.02)g.d+=angDiff(a,g.d)*Math.min(1,dt*8)}

  }

    const a=Math.atan2(c.ty-c.y,c.tx-c.x),d=dist(c.x,c.y,c.tx,c.ty);if(d>.2){const nx=c.x+Math.cos(a)*Math.min(d,.7*dt),ny=c.y+Math.sin(a)*Math.min(d,.7*dt);if(!isSolidAt(nx,ny)){c.x=nx;c.y=ny;c.d+=angDiff(a,c.d)*Math.min(1,dt*5)}else c.t=0}
  }

  for(const p of pls){

// smooth the mirrored guards/civilians/teammates between snapshots

    Object.values(G.players).forEach((p,i)=>{const f=free[i]||free[0];p.x=f[0]+.5;p.y=f[1]+.5;p.d=Math.atan2(l.y-p.y,l.x-p.x)});G.entered=true;
    G.players.p3.carry=[{kind:'cash',v:4200}];G.players.p1.det=.45;
    CAMX=G.players.p1.x;CAMY=G.players.p1.y;
    if(HASH==='#demoalarm'){G.alarm=47;G.everAlarm=true;G.guards.forEach(g=>g.st='alert')}
    if(HASH==='#demoend'){G.secured=26400;endHeist('escaped')}
    HOLDING={a:'grab',id:l.id,t:1.2,need:3,txt:'Crack the safe'};KEYS.KeyE=true;
    setTimeout(()=>{KEYS.KeyE=false},50);
  }
}

// ═══════════════════════ #smoke self-test ═══════════════════════
if(HASH==='#smoke')addEventListener('DOMContentLoaded',()=>{
  DEMO=true;SOUND=false;quiet=true;const out=[];let pass=0,fail=0;
  const ok=(c,n)=>{if(c)pass++;else{fail++;out.push('FAIL '+n)}};
  try{
    // 1. every generated building is playable: the front door reaches every room, every bit of loot and the van
    let good=0,n=0;const kinds=new Set();
    for(const type of Object.keys(HEISTS))for(const diff of Object.keys(DIFFS))for(let s=1;s<=40;s++){
      newWorld(s*131+type.length,type,diff,[{cid:'a',name:'A',hue:0,role:'all'}]);n++;
      const reach=new Uint8Array(MW*MH),q=[[M.front.x,M.front.y]];reach[M.at(M.front.x,M.front.y)]=1;
      while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const i=M.at(nx,ny);if(reach[i])continue;const t=M.T[i];if((t===1||t===3)&&!M.SOLID[i]){reach[i]=1;q.push([nx,ny])}}}
      const roomsOK=M.rooms.every(rm=>{for(let y=rm.y;y<rm.y+rm.h;y++)for(let x=rm.x;x<rm.x+rm.w;x++)if(reach[M.at(x,y)])return true;return false});
      const lootOK=M.loot.every(l=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=Math.floor(l.x)+dx,y=Math.floor(l.y)+dy;if(x>=0&&y>=0&&reach[M.at(x,y)])return true}return false});
      const termOK=M.terms.every(t=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=Math.floor(t.x)+dx,y=Math.floor(t.y)+dy;if(reach[M.at(x,y)])return true}return false});
      M.loot.forEach(l=>kinds.add(l.kind));
      const vaultOne=M.rooms.filter(r=>r.kind==='vault').every(r=>M.doors.filter(d=>d.a===r.id||d.b===r.id).length===1);
      if(roomsOK&&lootOK&&termOK&&vaultOne&&M.guards.length>=1&&M.loot.length>=3)good++;else out.push(type+'/'+diff+' seed '+s+' rooms '+roomsOK+' loot '+lootOK+' term '+termOK+' vault '+vaultOne+' guards '+M.guards.length+' loot# '+M.loot.length);
    }
    ok(good===n,'every building is fully reachable with loot, a guard route and a one-door vault ('+good+'/'+n+')');
    ok(['cash','gold','jewels','art'].every(k=>kinds.has(k)),'all four kinds of loot show up');
    newWorld(99,'bank','normal',[{cid:'a',name:'A',hue:0,role:'all'}]);const s1=JSON.stringify([M.rooms,M.loot,M.cams]);newWorld(99,'bank','normal',[{cid:'a',name:'A',hue:0,role:'all'}]);ok(s1===JSON.stringify([M.rooms,M.loot,M.cams]),'same seed → same building (every player builds it locally)');
    // 2. sight lines
    newWorld(7,'bank','easy',[{cid:'a',name:'A',hue:0,role:'all'}]);
    const rm=M.rooms.find(r=>r.w>=6&&r.h>=5);ok(los(rm.x+.5,rm.y+.5,rm.x+rm.w-.5,rm.y+.5)||M.TALL.some(Boolean),'open floor is visible');
    const wl=[];for(let y=BY0;y<=BY1;y++)if(M.T[M.at(BX0,y)]===2)wl.push(y);ok(!los(BX0-1.5,wl[3]+.5,BX0+1.5,wl[3]+.5),'walls block sight');
    ok(sees(10,10,0,.7,6,14,10)===los(10,10,14,10)&&!sees(10,10,0,.7,6,6,10),'vision cones only look forward');
    // 3. roles
    newWorld(11,'bank','normal',[{cid:'h',name:'H',hue:0,role:'hacker'},{cid:'l',name:'L',hue:0,role:'locksmith'},{cid:'m',name:'M',hue:0,role:'muscle'},{cid:'o',name:'O',hue:0,role:'lookout'}]);
    const kd=M.doors.find(d=>d.lock==='key');if(kd){const L=G.players.l,O=G.players.o;L.x=O.x=kd.x+.5;L.y=O.y=kd.y+1.5;if(M.T[M.at(kd.x,kd.y+1)]!==1){L.y=O.y=kd.y-.5}
      ok(interactions(L).some(o=>o.a==='pick'&&o.t<2),'locksmith picks quietly');ok(interactions(O).some(o=>o.a==='crowbar'&&o.loud),'everyone else crowbars, loudly')}
    const cd=M.doors.find(d=>d.lock==='card');if(cd){const Hk=G.players.h,O=G.players.o;Hk.x=O.x=cd.x+.5;Hk.y=O.y=cd.y+1.5;ok(interactions(Hk).some(o=>o.a==='hackdoor'),'hacker opens keycard doors');ok(!interactions(O).some(o=>o.a==='hackdoor'),'others can\'t')}
    const tm=M.terms.find(t=>t.main);const Hk=G.players.h;Hk.x=tm.x;Hk.y=tm.y+1;ok(doAction(Hk,{a:'hack',id:tm.id})&&G.loopT>0&&G.timeLock&&G.sensorsOff,'hacking security loops cams, kills sensors, releases the vault');
    const vd=M.doors.find(d=>d.lock==='vault');if(vd){Hk.x=vd.x+.5;Hk.y=vd.y+1.5;if(M.T[M.at(vd.x,vd.y+1)]!==1)Hk.y=vd.y-.5;if(M.T[M.at(vd.x+1,vd.y)]===1&&M.T[M.at(vd.x,vd.y+1)]!==1&&M.T[M.at(vd.x,vd.y-1)]!==1){Hk.x=vd.x+1.5;Hk.y=vd.y+.5}ok(doAction(Hk,{a:'vault',id:vd.id})&&G.doors[vd.id].open,'vault opens after the time-lock')}
    const Mu=G.players.m;ok(cap(Mu)===2&&cap(Hk)===1,'muscle carries two bags');
    // takedown only from outside the guard's view
    const g=G.guards[0];Mu.x=g.x-Math.cos(g.d)*.8;Mu.y=g.y-Math.sin(g.d)*.8;ok(interactions(Mu).some(o=>o.a==='ko'),'muscle can take a guard down from behind');
    Mu.x=g.x+Math.cos(g.d)*.8;Mu.y=g.y+Math.sin(g.d)*.8;ok(!interactions(Mu).some(o=>o.a==='ko')||!los(g.x,g.y,Mu.x,Mu.y),'not when the guard is looking at you');
    // 4. detection → alarm → police
    newWorld(12,'bank','normal',[{cid:'a',name:'A',hue:0,role:'all'}]);const P=G.players.a,gd=G.guards[0];
    P.x=gd.x+Math.cos(gd.d)*2;P.y=gd.y+Math.sin(gd.d)*2;gd.wait=99;
    if(los(gd.x,gd.y,P.x,P.y)&&!isSolidAt(P.x,P.y)){for(let i=0;i<30;i++)simStep(.1);ok(G.alarm>=0&&G.everAlarm,'standing in front of a guard trips the alarm')}else ok(true,'(guard spot blocked)');
    G.alarm=.05;simStep(.1);ok(G.phase==='end'&&G.res.why==='caught','police arrival ends it');
    // painting sensors
    newWorld(13,'gallery','easy',[{cid:'a',name:'A',hue:0,role:'all'}]);G.guards.forEach(x=>x.st='ko');G.civs.forEach(c=>c.st='tied');const art=M.loot.find(x=>x.cont==='wall');
    if(art){const A=G.players.a;A.x=art.x;A.y=art.y+.9;ok(doAction(A,{a:'grab',id:art.id})&&G.alarm>=0,'lifting a wired painting sets off the alarm')}
    // securing loot + escape
    newWorld(14,'jewel','easy',[{cid:'a',name:'A',hue:0,role:'all'},{cid:'b',name:'B',hue:0,role:'all'}]);G.guards.forEach(x=>x.st='ko');G.civs.forEach(c=>c.st='tied');
    const A=G.players.a,Bp=G.players.b,cs=M.loot.find(x=>x.cont==='case');A.x=cs.x;A.y=cs.y+1;if(isSolidAt(A.x,A.y))A.y=cs.y-1;
    ok(doAction(A,{a:'grab',id:cs.id})&&A.carry.length===1&&G.loot[cs.id].taken,'cutting a case bags the jewels');
    ok(dropBag(A)&&G.bagsLying.length===1&&!A.carry.length,'drop a bag');Bp.x=A.x;Bp.y=A.y;ok(doAction(Bp,{a:'bag',id:0})&&Bp.carry.length===1,'a teammate picks it up');
    G.guards.forEach(x=>x.st='ko');
    G.entered=true;for(const p of[A,Bp]){p.x=M.van.x+1;p.y=M.van.y+1}simStep(.1);ok(G.secured===cs.v,'walking into the van secures the loot');
    for(let i=0;i<40;i++)simStep(.1);ok(G.phase==='end'&&G.res.why==='escaped'&&G.res.stealth,'whole crew in the van → clean getaway with the stealth bonus');
    newWorld(19,'bank','easy',[{cid:'a',name:'A',hue:0,role:'all'}]);G.guards.forEach(x=>x.st='ko');G.civs.forEach(c=>c.st='tied');for(let i=0;i<80;i++)simStep(.1);ok(G.phase==='play'&&!inVan(G.players.a),'standing at the spawn never counts as a getaway');
    // downed + revive
    newWorld(15,'bank','easy',[{cid:'a',name:'A',hue:0,role:'all'},{cid:'b',name:'B',hue:0,role:'all'}]);G.players.a.down=true;G.players.b.x=G.players.a.x;G.players.b.y=G.players.a.y;
    ok(interactions(G.players.b).some(o=>o.a==='revive'),'a cuffed teammate can be freed');doAction(G.players.b,{a:'revive',id:'a'});ok(!G.players.a.down,'freed');
    G.players.a.down=G.players.b.down=true;simStep(.1);ok(G.phase==='end'&&G.res.why==='downed','whole crew cuffed → over');
    // 5. movement + collision
    newWorld(16,'bank','easy',[{cid:'me',name:'Me',hue:0,role:'all'}]);ME='me';mode='play';NETROLE='solo';const me=G.players.me;const wx=BX0,wy=Math.floor((BY0+BY1)/2);
    me.x=wx-.8;me.y=wy+.5;KEYS.KeyD=true;for(let i=0;i<40;i++)moveLocal(.05);KEYS.KeyD=false;ok(me.x<wx-.25,'you can\'t walk through a wall');
    // 6. snapshots round-trip
    newWorld(17,'bank','normal',[{cid:'h',name:'H',hue:0,role:'hacker'},{cid:'g',name:'G',hue:0,role:'muscle'}]);for(let i=0;i<20;i++)simStep(.1);G.loot[0].taken=true;G.players.g.carry=[{kind:'gold',v:12000}];G.alarm=33;
    const sn=JSON.parse(JSON.stringify(snap()));const keep=G;newWorld(17,'bank','normal',[{cid:'h',name:'H',hue:0,role:'hacker'},{cid:'g',name:'G',hue:0,role:'muscle'}]);applySnap(sn);
    ok(G.loot[0].taken&&G.players.g.carry[0].v===12000&&Math.abs(G.alarm-33)<.2&&Math.abs(G.guards[0].tx2-keep.guards[0].x)<.02,'a guest rebuilds the same world from one snapshot');
    ok(JSON.stringify(sn).length<4000,'snapshots stay small ('+JSON.stringify(sn).length+' bytes)');
    // 7. host logic
    NET.mode='host';NETROLE='host';onNet({t:'created'});hostIn({t:'hi',cid:'g1',name:'Bo',hue:3});hostIn({t:'hi',cid:'g1',name:'Bo',hue:4});ok(HS.players.length===2,'repeat hello doesn\'t duplicate');
    ok(HS.players[0].role!==HS.players[1].role,'new players get a free role');hostIn({t:'role',cid:'g1',role:HS.players[0].role});ok(HS.players[1].role!==HS.players[0].role,'two people can\'t take the same job');
    ok(hostStart()&&mode==='play'&&G&&G.players[MYID]&&G.players.g1,'start builds the heist with the whole crew');
    hostDrop('g1');ok(G.players.g1.down,'a crew member who disconnects is left behind');
    NET.mode='off';NETROLE='solo';HS=null;
    // 8. drawing
    for(const type of Object.keys(HEISTS)){newWorld(21,type,'hard',[{cid:'me',name:'Me',hue:0,role:'lookout'}]);ME='me';mode='play';G.alarm=30;G.smokes.push({x:20,y:15,t:5});render()}ok(true,'every heist draws (alarm, smoke, lookout x-ray)');
    ok(!!document.querySelector('script[src="glitchbox-menu.js"]'),'quit button script present');
  }catch(e){fail++;out.push('EXCEPTION '+e.message+'\n'+e.stack)}
  quiet=false;
  const pre=document.createElement('pre');pre.id='smokeout';pre.textContent=(fail?'SMOKE FAIL':'SMOKE PASS')+' '+pass+'/'+(pass+fail)+'\n'+out.join('\n');
  pre.style.cssText='position:fixed;inset:0;z-index:99;background:#000;color:#0f0;margin:0;padding:10px;overflow:auto;font-size:12px';
  document.body.appendChild(pre);document.title=(fail?'SMOKE FAIL ':'SMOKE PASS ')+pass+'/'+(pass+fail);
});
