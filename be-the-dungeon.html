<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be the Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="glitchbox-save.js" data-pos="top-left"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07050a;--panel:#0f0b12;--panel2:#171019;--line:rgba(255,120,80,.13);--text:#eadfd6;--muted:#8a7a78;--gold:#ffc65a;--blood:#e0334a;--soul:#8fd6ff;--green:#7ee08a;--ember:#ff7a3a}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Alegreya Sans',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit}
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:100vh}
#main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:'Pirata One',serif;font-size:30px;letter-spacing:2px;color:#ffd9b0;text-shadow:0 0 18px #ff5a2a,0 2px 0 #000;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#speed{position:absolute;right:12px;top:12px;display:none;gap:6px}
#speed button{background:#1a1219e8;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-weight:800;cursor:pointer;font-size:13px}
#speed button.on{border-color:var(--ember);color:#fff}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#140d14ee;border:1px solid rgba(255,190,120,.35);border-radius:10px;padding:9px 16px;font-size:15px;max-width:min(680px,92%);text-align:center;line-height:1.35;pointer-events:none;transition:opacity .3s}
#hint b{color:var(--gold)}
/* toolbar */
#bar{display:flex;gap:6px;padding:8px 10px;background:linear-gradient(180deg,#0d090f,#09060b);border-top:1px solid var(--line);overflow-x:auto;min-height:84px;align-items:stretch}
#bar::-webkit-scrollbar{height:6px}#bar::-webkit-scrollbar-thumb{background:#2a1c25;border-radius:3px}
.grp{display:flex;gap:6px;padding-right:8px;border-right:1px solid var(--line)}
.grp:last-child{border-right:none}
.tool{position:relative;width:66px;min-width:66px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;transition:transform .08s,border-color .15s}
.tool:hover{border-color:rgba(255,160,90,.5);transform:translateY(-2px)}
.tool.on{border-color:var(--ember);background:#2a1418;box-shadow:0 0 16px rgba(255,90,40,.25)}
.tool.poor{opacity:.5}
.tool.locked{opacity:.4;filter:grayscale(1)}
.tool canvas{width:36px;height:36px}
.tool .nm{font-size:11px;font-weight:700;line-height:1;white-space:nowrap}
.tool .cs{font-size:11px;color:var(--gold);font-weight:700}
.tool .cs.s{color:var(--soul)}
.tool .hk{position:absolute;top:2px;left:5px;font-size:9px;color:var(--muted)}
/* side */
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
#side::-webkit-scrollbar{width:7px}#side::-webkit-scrollbar-thumb{background:#2a1c25;border-radius:3px}
.title{font-family:'Pirata One',serif;font-size:30px;text-align:center;padding:12px 0 2px;color:#ffd9b0;text-shadow:0 0 16px rgba(255,90,40,.5);letter-spacing:1px}
.sub{text-align:center;font-size:12px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 12px}
.res div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center}
.res b{display:block;font-size:20px;font-weight:800}
.res span{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
#hpbar{margin:8px 12px 0;height:16px;border-radius:8px;background:#200a10;border:1px solid #4a1520;position:relative;overflow:hidden}
#hpfill{height:100%;background:linear-gradient(90deg,#8a0f25,#e0334a);transition:width .3s}
#hptxt{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:800;line-height:15px;text-shadow:0 1px 2px #000}
.sec{margin:12px 12px 0;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.sec h3{font-family:'Pirata One',serif;font-size:19px;font-weight:400;letter-spacing:1px;color:#ffcfa0;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sec h3 small{font-family:'Alegreya Sans';font-size:11px;color:var(--muted);letter-spacing:1px;margin-left:auto}
.party{display:flex;flex-wrap:wrap;gap:5px}
.pm{display:flex;align-items:center;gap:5px;background:#0c080e;border:1px solid var(--line);border-radius:7px;padding:3px 7px 3px 3px;font-size:12px;font-weight:700}
.pm canvas{width:24px;height:24px}
.pm.hero{border-color:var(--gold);color:var(--gold)}
.intel{font-size:13px;line-height:1.4;color:#cdbdb3}
.intel li{margin-left:16px;margin-bottom:3px}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px;margin:2px 3px 0 0;background:#2a1418;border:1px solid #5a2430;color:#ffb0a0}
.btn{display:block;width:calc(100% - 24px);margin:10px 12px 0;padding:12px;border-radius:10px;border:1px solid #ff6a3a;background:linear-gradient(180deg,#8a2414,#5a120c);font-family:'Pirata One',serif;font-size:22px;letter-spacing:1px;cursor:pointer;color:#ffe8d0;text-shadow:0 1px 0 #000}
.btn:hover{filter:brightness(1.2)}
.btn.alt{background:linear-gradient(180deg,#1d2a40,#121a2a);border-color:#4a7ab0;font-size:18px;padding:9px}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.row2{display:flex;gap:8px;margin:8px 12px 0}
.row2 .btn{margin:0;width:auto;flex:1}
.mini{background:#0c080e;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;font-weight:700;cursor:pointer}
.mini.on{border-color:var(--soul);color:var(--soul)}
/* tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;max-width:280px;background:#120c12f4;border:1px solid rgba(255,160,90,.4);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.38;box-shadow:0 10px 40px #000c;display:none}
#tip h4{font-family:'Pirata One',serif;font-weight:400;font-size:18px;color:#ffd9b0}
#tip .c{color:var(--gold);font-weight:700}#tip .s{color:var(--soul);font-weight:700}
#tip .q{color:var(--muted);font-style:italic;margin-top:4px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(4,2,6,.84);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal.show{display:flex}
#mbox{background:#120c13;border:1px solid rgba(255,140,80,.35);border-radius:16px;padding:22px 24px;max-width:640px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 90px #000}
#mbox h2{font-family:'Pirata One',serif;font-weight:400;font-size:36px;color:#ffd9b0;text-shadow:0 0 18px rgba(255,90,40,.5);margin-bottom:6px}
#mbox p{line-height:1.5;color:#d5c5bb;margin-bottom:10px}
#mbox .btn{width:100%;margin:12px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{background:#1a1119;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:13px;line-height:1.35}
.rc:hover{border-color:var(--soul)}
.rc b{font-size:15px;display:block}
.rc .k{color:var(--soul);font-weight:800;margin-top:4px}
.rc.done{opacity:.5;cursor:default;border-color:#2a4a2a}
.rc.poor{opacity:.55}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stats div{background:#1a1119;border-radius:9px;padding:8px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.lesson{background:#1a0e12;border-left:3px solid var(--blood);padding:7px 10px;margin:6px 0;border-radius:0 8px 8px 0;font-size:14px;line-height:1.4}
.lesson.good{border-left-color:var(--green);background:#0f1a12}
@media (max-width:900px){
 #wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
 #side{max-height:38vh;border-left:none;border-top:1px solid var(--line)}
 .title{display:none}.sub{display:none}
 #banner{font-size:22px}
 #hint{font-size:13px;top:10px;bottom:auto;padding:7px 11px}
}
</style>
</head>
<body>
<div id="wrap">
 <div id="main">
  <div id="stage"><canvas id="cv"></canvas><div id="banner"></div>
   <div id="speed"><button data-sp="0">❚❚</button><button data-sp="1" class="on">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button></div>
   <div id="hint"></div>
  </div>
  <div id="bar"></div>
 </div>
 <aside id="side">
  <div class="title">Be the Dungeon</div><div class="sub">They are coming for your heart</div>
  <div class="res"><div><b id="rDay">1</b><span>Day</span></div><div><b id="rGold" style="color:var(--gold)">0</b><span>Gold</span></div><div><b id="rSoul" style="color:var(--soul)">0</b><span>Souls</span></div></div>
  <div id="hpbar"><div id="hpfill"></div><div id="hptxt"></div></div>
  <div class="sec"><h3>⚔️ Tonight's Raid <small id="partyN"></small></h3><div class="party" id="party"></div></div>
  <div class="sec"><h3>👁️ Guild Intel <small><button class="mini" id="intelBtn">Show on map (I)</button></small></h3><div class="intel" id="intel"></div></div>
  <button class="btn" id="goBtn">Open the Gates</button>
  <div class="row2"><button class="btn alt" id="resBtn">💀 Dark Rites</button><button class="btn alt" id="helpBtn" style="flex:.5">?</button></div>
  <div style="height:14px"></div>
 </aside>
</div>
<div id="tip"></div>
<div id="modal"><div id="mbox"></div></div>
<pre id="smokeout" style="display:none;position:fixed;top:0;left:0;z-index:99;background:#000;color:#0f0;padding:10px;max-height:100vh;overflow:auto"></pre>
<script>
'use strict';
/* ═══════════════════════════ CONSTANTS ═══════════════════════════ */
const COLS=21, ROWS=13, TS=48;
const ROCK=0, FLOOR=1, BED=2, GATE=3, HEART=4;
const GX=0, GY=6, HX=18, HY=6;
const LAST_DAY=30;
const CARVE_T=4;
const GLOOM=.01;   // share of max HP the dark drains from a raider for every tile walked — long tunnels kill   // seconds a raider spends hacking at the Heart before running with the shard
const idx=(x,y)=>y*COLS+x, tx=i=>i%COLS, ty=i=>(i/COLS)|0;
const GATE_I=idx(GX,GY), HEART_I=idx(HX,HY);

// ── traps: placed on floor, they never block a path ──
const TRAPS={
 spike:{n:'Spike Plate',cost:20,hidden:true, dmg:18,cd:1.4,cat:'trap', d:'Hidden. Stabs everyone on the tile. Re-arms fast.'},
 arrow:{n:'Arrow Turret',cost:45,hidden:false,dmg:10,cd:1,range:3.6,cat:'ranged',d:'Shoots the nearest intruder it can see.'},
 slime:{n:'Acid Puddle',cost:30,hidden:false,dps:5,slow:.45,cat:'trap',unlock:4,d:'Halves speed and burns whoever wades through.'},
 pit:  {n:'Pit Trap',cost:55,hidden:true, dmg:55,stun:2.2,cat:'trap',unlock:6,d:'Hidden. The first to step in falls hard. Springs once per raid.'},
 flame:{n:'Flame Vent',cost:70,hidden:false,dmg:26,cd:2.6,r:1.3,cat:'fire',unlock:10,d:'Erupts when intruders come near, burning everything around it.'},
 fear: {n:'Ward of Dread',cost:85,hidden:false,r:1.7,cd:7,flee:2.6,cat:'fear',unlock:16,d:'Terrifies intruders, sending them running back toward your traps.'},
 cage: {n:'Drop Cage',cost:35,hidden:true, cd:10,hold:4,cat:'trap',unlock:3,d:'Hidden. Drops an iron cage on the first raider in, pinning them for 4 seconds.'},
 door: {n:'Iron Door',cost:80,hidden:false,shut:18,hp:140,cat:'door',unlock:4,d:'Slams shut once enough raiders have walked through (click it with this tool to set 1–6), sealing them in with your monsters. The rest must bash it down.'},
 bell: {n:'Alarm Bell',cost:60,hidden:false,r:2.5,cd:25,rage:10,cat:'trap',unlock:6,d:'Rings when raiders come near. Every monster within 7 tiles goes berserk: faster, harder-hitting, and hunts farther.'},
 trapdoor:{n:'Trap Door',cost:120,hidden:true,dmg:40,cd:15,cat:'trap',unlock:8,d:'Hidden. Whoever steps on it drops into the oubliette and is gone. Re-arms after 15 seconds. Heroes catch the edge.'},
 cavein:{n:'Cave-in',cost:110,hidden:true,dmg:70,r:1.6,need:3,cat:'trap',unlock:13,d:'Hidden. Brings the ceiling down once 3 or more raiders bunch up beneath it. Once per raid.'},
};
// ── monsters: guard a home tile, chase within a leash, respawn after every raid ──
const MONS={
 goblin:{n:'Goblin',     cost:25, hp:65,  dmg:8, cd:.7, spd:2.3,range:.95,aggro:3.4,cat:'melee',d:'Cheap, fast and spiteful.'},
 skel:  {n:'Skeleton',   cost:45, hp:90,  dmg:13, cd:1,  spd:1.6,range:.95,aggro:3,  cat:'melee',rise:true,d:'Gets back up once.'},
 ooze:  {n:'Slime',      cost:40, hp:135, dmg:6, cd:1,  spd:1.1,range:.95,aggro:2.6,cat:'melee',split:true,slowHit:true,unlock:3,d:'Slows what it touches. Splits in two when it dies.'},
 orc:   {n:'Orc Brute',  cost:90, hp:270, dmg:22,cd:1.3,spd:1.4,range:1,  aggro:3,  cat:'melee',unlock:8,d:'A wall of muscle that hits like a falling door.'},
 mage:  {n:'Dark Mage',  cost:110,hp:70,  dmg:20,cd:1.6,spd:1.3,range:4,  aggro:4.4,cat:'magic',proj:'bolt',splash:.9,unlock:12,d:'Hurls exploding shadow bolts from range.'},
 wraith:{n:'Wraith',     cost:130,hp:130, dmg:18,cd:1,  spd:2.2,range:.95,aggro:4.2,cat:'melee',drain:.6,unlock:20,d:'Drains life to heal itself. Hard to pin down.'},
 dragon:{n:'Dragon',     cost:400,hp:1120,dmg:42,cd:2.2,spd:1.2,range:2.6,aggro:4,  cat:'fire',breath:true,max:1,unlock:45,d:'Breathes a cone of fire. You may only keep one.'},
};
// ── adventurers ──
const CLS={
 warrior:{n:'Warrior',hp:70, dmg:7, cd:1,  spd:1.6, range:.95,armor:1,col:'#c0392b'},
 rogue:  {n:'Rogue',  hp:44, dmg:6, cd:.7, spd:2.0, range:.95,detect:2.2,disarm:2.2,trapRes:.5,col:'#2e7d4f'},
 archer: {n:'Archer', hp:38, dmg:6, cd:1.2,spd:1.7, range:4,proj:'arrow',col:'#a8742c'},
 cleric: {n:'Cleric', hp:52, dmg:3, cd:1.2,spd:1.5, range:.95,heal:12,healCd:2.2,healR:3,col:'#e8e0c8'},
 mage:   {n:'Mage',   hp:34, dmg:10,cd:1.8,spd:1.5, range:3.5,proj:'fire',splash:.9,col:'#3a6fd8'},
 knight: {n:'Knight', hp:120,dmg:10,cd:1.2,spd:1.25,range:.95,armor:4,col:'#9aa6b4'},
};
const HEROES={
 5: {n:'Brannoc the Unbent',  base:'knight',hp:300,dmg:18,armor:6,title:'An unbreakable shield-knight'},
 10:{n:'Ysolde Lightbringer', base:'cleric',hp:300,dmg:8, heal:22,healR:3.6,title:'Her prayers mend the whole party'},
 15:{n:'Varek Ninefingers',   base:'rogue', hp:260,dmg:14,detect:4,disarm:1,spd:2.3,title:'Sees every trap. Disarms them in a blink'},
 20:{n:'Archmage Quill',      base:'mage',  hp:280,dmg:30,splash:1.5,range:4.2,title:'Fireballs that level whole rooms'},
 25:{n:'Sir Galen Dragonbane',base:'knight',hp:620,dmg:24,armor:7,title:'Has killed four dragons. Wants a fifth'},
 30:{n:'The Hero of Legend',  base:'warrior',hp:1300,dmg:30,armor:5,heal:15,healR:2,title:'The one the songs are about'},
};
const RITES=[
 {id:'heart', n:'Blood Heart',   ic:'❤️',max:5, k:l=>5+l*5,  d:'+60 Heart max HP (and heal it).'},
 {id:'lair',  n:'Deeper Lairs',  ic:'🕳️',max:6, k:l=>3+l*4,  d:'+3 monster capacity.'},
 {id:'sharp', n:'Serrated Steel',ic:'🗡️',max:4, k:l=>6+l*6,  d:'+20% trap damage.'},
 {id:'blood', n:'Bloodlust',     ic:'🩸',max:4, k:l=>6+l*6,  d:'+15% monster health and damage.'},
 {id:'tithe', n:'Dark Tithe',    ic:'🪙',max:3, k:l=>5+l*5,  d:'+15 gold every morning.'},
 {id:'regen', n:'Beating Stone', ic:'💓',max:2, k:l=>8+l*8,  d:'The Heart regenerates +25% more each night.'},
];
const ITEMS={
 frost:{n:'Frostweave Cloaks',d:'fire damage halved'},
 holy:{n:'Holy Water',d:'skeletons stay dead'},
 poles:{n:'Ten-Foot Poles',d:'pits found from 1.5 tiles'},
 shields:{n:'Tower Shields',d:'warriors and knights take 40% less from arrows and bolts'},
 salt:{n:'Salt Sacks',d:'slimes no longer split'},
 wards:{n:'Warding Charms',d:'magic damage −30%'},
 courage:{n:'Battle Hymns',d:'half the party ignores fear'},
 lanterns:{n:'Hooded Lanterns',d:'the gloom drains half as much'},
 crowbars:{n:'Crowbars',d:'iron doors go down twice as fast'},
 ropes:{n:'Climbing Ropes',d:'trap-door victims climb back out, hurt'},
};

/* ═══════════════════════════ STATE ═══════════════════════════ */
let G=null;      // persistent game
let R=null;      // the current raid
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function newGame(){
 const map=new Array(COLS*ROWS).fill(ROCK);
 for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(x===0||y===0||x===COLS-1||y===ROWS-1) map[idx(x,y)]=BED;
 for(let x=1;x<=16;x++) map[idx(x,GY)]=FLOOR;
 for(let y=5;y<=7;y++) for(let x=17;x<=19;x++) map[idx(x,y)]=FLOOR;
 map[GATE_I]=GATE; map[HEART_I]=HEART;
 G={ v:1, day:1, gold:200, souls:0, heartMax:300, heartHp:300, map, traps:{}, mons:{},
  unlocked:{spike:1,arrow:1,goblin:1,skel:1}, rites:{}, doorN:{}, seed:(Math.random()*1e9)|0,
  guild:{ danger:new Array(COLS*ROWS).fill(0), known:{}, cause:{trap:0,ranged:0,fire:0,melee:0,magic:0,fear:0,gloom:0}, killedBy:{}, items:{}, pitDeaths:0, fearRuns:0, seals:0, lessons:['The Adventurers\' Guild has heard of a new dungeon. They know nothing about it — yet.'], witnesses:0 },
  stats:{kills:0,escaped:0,raids:0,heroKills:0,goldEarned:0}, won:false, over:false };
 G.nextParty=makeParty(G.day);
 return G;
}

/* ═══════════════════════════ GRID / PATHING ═══════════════════════════ */
const walk=(i)=>{ const t=G.map[i]; return (t===FLOOR||t===GATE)&&!(G.phase==='raid'&&R&&R.shut[i]); };
function nbrs(i){ const x=tx(i),y=ty(i),o=[]; if(x>0)o.push(i-1); if(x<COLS-1)o.push(i+1); if(y>0)o.push(i-COLS); if(y<ROWS-1)o.push(i+COLS); return o; }
// Dijkstra over 4-neighbour tiles. cost(i) is the price of stepping onto i. Goal may be unwalkable (the Heart).
function findPath(from,goal,cost){
 const N=COLS*ROWS, dist=new Float64Array(N).fill(Infinity), prev=new Int32Array(N).fill(-1), done=new Uint8Array(N);
 dist[from]=0;
 for(;;){
  let u=-1,best=Infinity; for(let i=0;i<N;i++) if(!done[i]&&dist[i]<best){best=dist[i];u=i;}
  if(u<0) return null; if(u===goal) break; done[u]=1;
  for(const v of nbrs(u)){ if(v!==goal&&!walk(v)) continue; const d=best+(cost?cost(v):1)+heurTie(v); if(d<dist[v]){dist[v]=d;prev[v]=u;} }
 }
 const p=[]; for(let c=goal;c!==from;c=prev[c]){ p.push(c); if(prev[c]<0) return null; } p.reverse(); return p;
}
const heurTie=v=>((v*2654435761)>>>0)%97*1e-6;   // break ties deterministically, but not always the same direction
function connected(){ return !!findPath(GATE_I,HEART_I,null); }

/* ═══════════════════════════ BUILD ═══════════════════════════ */
const DIG_COST=6, FILL_COST=4;
function monCap(){ return 4+Math.floor(G.day/3)+3*(G.rites.lair|0); }   // the lair deepens a little every few days on its own
function monCount(){ return Object.keys(G.mons).length; }
function trapDmgMul(){ return 1+.2*(G.rites.sharp|0); }
function monMul(){ return 1+.15*(G.rites.blood|0); }
function inChamberCore(i){ return i===HEART_I; }
function canBuild(tool,i){
 const t=G.map[i], x=tx(i), y=ty(i);
 if(tool==='dig'){ if(t!==ROCK) return 'Only solid rock can be dug.'; if(!nbrs(i).some(n=>G.map[n]===FLOOR||G.map[n]===GATE)) return 'Dig next to an existing tunnel.'; if(G.gold<DIG_COST) return 'Not enough gold.'; return null; }
 if(tool==='fill'){ if(t!==FLOOR) return 'Only open floor can be walled up.'; if(G.traps[i]||G.mons[i]) return 'Clear the tile first.';
  if(G.gold<FILL_COST) return 'Not enough gold.';
  G.map[i]=ROCK; const ok=connected(); G.map[i]=FLOOR; return ok?null:'The path from the gate to the Heart must stay open.'; }
 if(tool==='sell'){ return (G.traps[i]||G.mons[i])?null:'Nothing to sell here.'; }
 if(TRAPS[tool]){ if(!G.unlocked[tool]) return 'Locked — unlock it with Dark Rites.'; if(t!==FLOOR) return 'Traps go on open floor.'; if(G.traps[i]||G.mons[i]) return 'Tile already occupied.';
  if(i===idx(1,GY)) return 'Too close to the gate.'; if(G.gold<TRAPS[tool].cost) return 'Not enough gold.'; return null; }
 if(MONS[tool]){ if(!G.unlocked[tool]) return 'Locked — unlock it with Dark Rites.'; if(t!==FLOOR) return 'Monsters need open floor.'; if(G.traps[i]||G.mons[i]) return 'Tile already occupied.';
  if(i===idx(1,GY)) return 'Too close to the gate.'; if(monCount()>=monCap()) return 'Lair is full ('+monCap()+'). Deepen it with Dark Rites.';
  if(MONS[tool].max&&Object.values(G.mons).filter(m=>m===tool).length>=MONS[tool].max) return 'Only one '+MONS[tool].n+' per dungeon.';
  if(G.gold<MONS[tool].cost) return 'Not enough gold.'; return null; }
 return 'Unknown tool.';
}
function build(tool,i){
 if(tool==='door'&&G.traps[i]==='door'){ G.doorN[i]=((G.doorN[i]||3)%6)+1; sfx('place'); fxText(tx(i)+.5,ty(i)+.3,'closes after '+G.doorN[i],'#ffd9b0'); return null; }
 const why=canBuild(tool,i); if(why) return why;
 if(tool==='dig'){ G.gold-=DIG_COST; G.map[i]=FLOOR; sfx('dig'); fxBurst((tx(i)+.5),(ty(i)+.5),'#6a5a60',10); }
 else if(tool==='fill'){ G.gold-=FILL_COST; G.map[i]=ROCK; sfx('dig'); }
 else if(tool==='sell'){ const k=G.traps[i]||G.mons[i]; const def=TRAPS[k]||MONS[k]; G.gold+=Math.floor(def.cost*.7); delete G.traps[i]; delete G.mons[i]; delete G.doorN[i]; sfx('coin'); }
 else if(TRAPS[tool]){ G.gold-=TRAPS[tool].cost; G.traps[i]=tool; if(tool==='door') G.doorN[i]=3; sfx('place'); }
 else if(MONS[tool]){ G.gold-=MONS[tool].cost; G.mons[i]=tool; sfx('place'); }
 mapDirty=true; previewDirty=true; ui();
 return null;
}

function shares(){ const c=G.guild.cause, t=Object.values(c).reduce((a,b)=>a+b,0)||1; const s={}; for(const k in c) s[k]=c[k]/t; s._total=t; return s; }
function knownTrapsValid(){ const k={}; for(const i in G.guild.known){ if(G.traps[i]===G.guild.known[i]) k[i]=G.guild.known[i]; } return k; }
function classWeights(day){
 const s=G.guild.seen?shares():{trap:0,ranged:0,fire:0,melee:0,magic:0,fear:0,gloom:0};
 const nKnown=Object.keys(knownTrapsValid()).length;
 return {
  warrior:3+4*s.melee,
  rogue:.5+7*(s.trap+s.fire*.5)+Math.min(3,nKnown*.5),
  archer:1.4+2.2*s.melee,
  cleric:day>=2?.7+3*(s.melee+s.magic+s.fire)+3.5*(s.gloom||0):0,
  mage:day>=3?.9+2*s.melee:0,
  knight:day>=4?.8+5*s.ranged+2.5*s.melee+2*s.magic:0,
 };
}
function partySize(day){ return Math.min(15,2+Math.floor((day-1)*.45)); }
function makeParty(day){
 const r=rng(G.seed+day*7919), w=classWeights(day), out=[];
 const n=partySize(day), keys=Object.keys(w);
 if(HEROES[day]) out.push('hero');
 // the guild always sends a rogue once it has mapped traps
 if(day>=3&&Object.keys(knownTrapsValid()).length>=2) out.push('rogue');
 // no party is all one thing: rogues cap at 30%, any other class at 40% (warriors are the filler)
 const cap=k=>Math.ceil(n*(k==='rogue'?.3:.4));
 while(out.length<n){ for(const k of keys) if(k!=='warrior'&&out.filter(x=>x===k).length>=cap(k)) w[k]=0; const tot=keys.reduce((a,k)=>a+w[k],0); let p=r()*tot; for(const k of keys){ p-=w[k]; if(p<=0){ out.push(k); break; } } if(p>0) out.push('warrior'); }
 // marching order: armour first, rogues scouting in front when traps are known, casters at the back
 const ord={hero:0,knight:1,rogue:Object.keys(G.guild.known).length?0.5:2,warrior:2,archer:4,mage:4,cleric:5};
 return out.sort((a,b)=>ord[a]-ord[b]);
}
function guildLearn(){
 const g=G.guild, lessons=[], witnesses=R.advs.filter(a=>a.state==='escaped');
 g.witnesses=witnesses.length;
 for(let i=0;i<g.danger.length;i++) g.danger[i]*=.55;
 // the dead are always found: bodies mark the tiles they died on, and wounds reveal the cause
 if(R.falls) lessons.push({t:`${R.falls} raider${R.falls>1?'s':''} vanished without a trace. The guild has no body to learn from.`,good:1});
 if(R.sealed) lessons.push({t:`Iron doors sealed the party ${R.sealed} time${R.sealed>1?'s':''}.`+(g.seals>=3&&!g.items.crowbars?' The guild is asking about crowbars.':'')});
 for(const d of R.deaths){ if(d.by==='trapdoor') continue; g.danger[d.tile]+=2.2; for(const n of nbrs(d.tile)) g.danger[n]+=.6; }
 for(const k in g.cause) g.cause[k]*=.6;
 for(const k in R.cause) g.cause[k]+=R.cause[k];
 g.seen=1;
 for(const k in R.killedBy) g.killedBy[k]=(g.killedBy[k]||0)+R.killedBy[k];
 // forget traps that are gone
 for(const i in g.known) if(G.traps[i]!==g.known[i]) delete g.known[i];
 if(witnesses.length){
  let newT=0; for(const i in R.known){ if(G.traps[i]&&!g.known[i]){ g.known[i]=G.traps[i]; newT++; } }
  for(let i=0;i<R.dmgMap.length;i++) g.danger[i]+=Math.min(3,R.dmgMap[i]/25);
  lessons.push({t:`${witnesses.length} survivor${witnesses.length>1?'s':''} crawled out. They mapped ${newT?newT+' new trap'+(newT>1?'s':''):'no new traps'}${newT?' and marked where it hurt':' but marked where it hurt'}.`});
 } else if(R.advs.length) lessons.push({t:'No one came back. The guild only knows where the bodies were found.',good:1});
 // what killed them shapes who they send
 const s=shares(), top=Object.entries(s).filter(e=>e[0][0]!=='_').sort((a,b)=>b[1]-a[1])[0];
 const why={trap:'traps — they will bring more Rogues',ranged:'arrows and bolts — they will bring armoured Knights',melee:'claws and blades — they will bring Warriors, Knights and Clerics',fire:'fire — expect Rogues and fire-proofing',magic:'dark magic — expect Knights and charms',fear:'terror',gloom:'the gloom of your long tunnels — expect Clerics and lanterns'};
 if(top&&top[1]>.3&&R.advs.length) lessons.push({t:'Most of their pain came from <b>'+why[top[0]]+'</b>.'});
 // equipment answers
 const deaths=R.deaths.length||0, it=g.items, before=Object.assign({},it);
 const on=(k,cond,off)=>{ if(cond) it[k]=1; else if(off) delete it[k]; };
 on('frost',s.fire>.3,s.fire<.12);
 on('holy',(g.killedBy.skel||0)>=4&&(g.killedBy.skel||0)/Math.max(1,G.stats.kills)>.2,false);
 on('poles',g.pitDeaths>=2,false);
 on('shields',s.ranged>.3,s.ranged<.12);
 on('salt',(g.killedBy.ooze||0)>=4,false);
 on('wards',s.magic>.28,s.magic<.1);
 on('courage',g.fearRuns>=8,false);
 on('lanterns',(s.gloom||0)>.3,(s.gloom||0)<.12);
 on('crowbars',g.seals>=4,false);
 on('ropes',(g.killedBy.trapdoor||0)>=4,false);
 for(const k in it) if(!before[k]) lessons.push({t:'The guild is issuing <b>'+ITEMS[k].n+'</b> — '+ITEMS[k].d+'.'});
 for(const k in before) if(!it[k]) lessons.push({t:'The guild stopped packing '+ITEMS[k].n+'.',good:1});
 g.lessons=lessons;
}
function guildSummary(){
 const g=G.guild, k=Object.keys(knownTrapsValid()).length, s=shares(), out=[];
 out.push(`They know <b>${k}</b> of your ${Object.keys(G.traps).length} traps.`);
 if(g.seen){ const parts=Object.entries(s).filter(e=>e[0][0]!=='_'&&e[1]>.08).sort((a,b)=>b[1]-a[1]).map(e=>e[0]+' '+Math.round(e[1]*100)+'%'); if(parts.length) out.push('Their wounds: '+parts.join(', ')+'.'); }
 if(G.day>1) out.push(g.witnesses?`${g.witnesses} witness${g.witnesses>1?'es':''} escaped last raid.`:'Nobody escaped last raid. 🤫');

function unitFrom(kind,def,x,y,lvl){ return Object.assign({kind,x,y,hp:def.hp,max:def.hp,cdT:0,state:'idle',path:null,pi:0,repath:0,face:0,flash:0,walk:Math.random()*6,slowT:0,stun:0,fleeT:0,tile:idx(x|0,y|0)},def,{lvl}); }
function startRaid(){
 if(G.over) return;
 // raiders get tougher every night, and much tougher in the last stretch
 const day=G.day, hpS=1+.06*(day-1)+.0065*(day-1)**2, dmS=1+.05*(day-1)+.001*(day-1)**2;
 R={ t:0, advs:[], mons:[], projs:[], spawnQ:G.nextParty.slice(), spawnT:.5, known:Object.assign({},knownTrapsValid()), knowV:0,
   dmgMap:new Array(COLS*ROWS).fill(0), deaths:[], cause:{trap:0,ranged:0,fire:0,melee:0,magic:0,fear:0,gloom:0}, killedBy:{},
   trapState:{}, heartDmg:0, gold:0, souls:0, ended:false, fleeing:false, total:G.nextParty.length, raidDanger:new Array(COLS*ROWS).fill(0) };
 R.hpS=hpS; R.dmS=dmS; R.trapS=1+.06*(day-1); R.shut={}; R.falls=0; R.sealed=0;
 // rogues only dismantle what the guild already mapped, or hidden plates they sniff out themselves
 R.disarmable=Object.assign({},R.known);
 for(const i in G.traps) R.trapState[i]={cd:0,sprung:false,fire:0,aim:0,seen:new Set(),count:0,need:G.doorN[i]||3};
 for(const i in G.mons){ const k=G.mons[i], d=MONS[k], m=unitFrom('mon',d,tx(+i)+.5,ty(+i)+.5); m.type=k; m.home=+i; m.hp=m.max=Math.round(d.hp*monMul()*(1+.05*(G.day-1)));   /* the dungeon grows with its age */ m.dmg=d.dmg*monMul(); m.state='home'; R.mons.push(m); }
 G.phase='raid'; sfx('horn'); banner('The gates open',2.2);
}
function spawnAdv(cls){
 const day=G.day; let def;
 if(cls==='hero'){ const h=HEROES[day]; def=Object.assign({},CLS[h.base],h,{hero:true}); }
 else def=Object.assign({},CLS[cls]);
 const a=unitFrom('adv',def,GX+.5,GY+.5);
 a.cls=cls==='hero'?HEROES[day].base:cls; a.isHero=cls==='hero'; a.name=def.n;
 a.hp=a.max=Math.round(def.hp*R.hpS*(a.isHero?1:1)); a.dmg=def.dmg*R.dmS; a.healT=0; a.state='move'; a.disT=0;
 // a third of each party ignores fear once the guild has hymns
 a.brave=a.isHero||(G.guild.items.courage&&Math.random()<.5);

}
function advCost(a){
 const hasRogue=R.advs.some(o=>o.cls==='rogue'&&o.hp>0&&o.state!=='escaped');
 return i=>{
  let c=1+Math.min(5,G.guild.danger[i]*1.1)+R.raidDanger[i]*2.5;
  if(R.known[i]) c+=R.known[i]==='door'?3:R.known[i]==='bell'?1.5:hasRogue?1.2:9;
  return c;
 };
}
function repath(u,goal,cost){ const p=findPath(u.tile,goal,cost); u.path=p||false; u.pi=0; }
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function los(x0,y0,x1,y1){
 const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*3);
 for(let k=1;k<n;k++){ const x=x0+(x1-x0)*k/n, y=y0+(y1-y0)*k/n, t=G.map[idx(x|0,y|0)]; if(t===ROCK||t===BED) return false; }
 return true;
}
function alive(u){ return u.hp>0&&u.state!=='escaped'&&u.state!=='dead'; }
function damage(target,amt,src){
 if(!alive(target)) return;
 let d=amt;
 if(target.kind==='adv'){
  const it=G.guild.items;
  if(src.cat==='fire'&&it.frost) d*=.5;
  if(src.cat==='magic'&&it.wards) d*=.7;
  if((src.cat==='ranged'||src.proj)&&it.shields&&(target.cls==='warrior'||target.cls==='knight')) d*=.6;
  if(src.kind==='trap'&&target.trapRes) d*=target.trapRes;
  if(target.armor&&src.cat!=='fire'&&src.cat!=='magic') d=Math.max(1,d-target.armor);
  R.dmgMap[target.tile]+=d; R.cause[src.cat]=(R.cause[src.cat]||0)+d;
 } else if(target.kind==='mon'){
  if(target.armor) d=Math.max(1,d-target.armor);
 }
 target.hp-=d; target.flash=.15; if(d>=3) fxText(target.x+(Math.random()-.5)*.3,target.y-.4,Math.round(d),target.kind==='adv'?'#ffd0a0':'#ff6a6a');
 fxBurst(target.x,target.y,target.kind==='adv'?'#b0102a':(target.type==='skel'?'#e8e2d0':target.type==='ooze'?'#5fd06a':'#6a0f1a'),4);

 else if(target.kind==='adv'&&!target.isHero&&target.cls!=='knight'&&target.hp<target.max*.2&&target.state!=='flee'){ target.state='flee'; target.path=null; fxText(target.x,target.y-.7,'flees!','#fff'); }

function die(u,src){

 if(u.kind==='adv'){

 } else {

  u.state='dead'; fxBurst(u.x,u.y,'#40303a',16); sfx('mdie');
  if(d.split&&!u.mini&&!G.guild.items.salt){ for(let k=0;k<2;k++){ const m=unitFrom('mon',Object.assign({},d,{hp:20,dmg:2}),u.x+(k?.2:-.2),u.y); m.type='ooze'; m.mini=true; m.home=u.home; m.state='home'; m.tile=u.tile; R.mons.push(m); } }
 }
}
function enterTile(u,i){
 u.prev=u.tile; u.tile=i;
 if(u.kind!=='adv') return;
 // the gloom: every step deeper in the dark costs a little life
 if(i!==GATE_I){ const g=u.max*GLOOM*(u.isHero?.5:1)*(G.guild.items.lanterns?.5:1); u.hp-=g; R.cause.gloom+=g; R.dmgMap[i]+=g*.3; if(!HEADLESS&&Math.random()<.5) parts.push({x:u.x,y:u.y-.2,vx:(Math.random()-.5)*.4,vy:-.5,l:.8,c:'rgba(120,60,160,.8)',s:3,g:0});

  if(!u.isHero&&u.cls!=='knight'&&u.hp<u.max*.2&&u.state!=='flee'){ u.state='flee'; u.path=null; } }

  if(u.isHero||G.guild.items.ropes){ damage(u,T.dmg*trapDmgMul()*R.trapS,{kind:'trap',type:'trapdoor',cat:'trap'}); if(alive(u)){ u.stun=2.5; fxText(u.x,u.y-.8,u.isHero?'catches the edge!':'climbs out','#fff'); } }
  else { R.cause.trap+=u.hp; u.fell=1; falls.push({x:u.x,y:u.y,t:0,col:CLS[u.cls].col}); R.falls++; die(u,{kind:'trap',type:'trapdoor',cat:'trap'}); fxText(u.x,u.y-.8,'into the oubliette','#c8a0ff',1); } }
}
function reveal(i){ if(!R.known[i]&&G.traps[i]){ R.known[i]=G.traps[i]; R.knowV++; fxText(tx(i)+.5,ty(i)+.2,'!','#ffe14a',1); } }
function advTarget(a){ return a.state==='flee'?GATE_I:HEART_I; }
function stepRaid(dt){

  st.cd-=dt; st.fire=Math.max(0,st.fire-dt);
  if(k==='arrow'&&st.cd<=0){ let best=null,bd=T.range; for(const a of advs) if(alive(a)){ const d=Math.hypot(a.x-cxp,a.y-cyp); if(d<bd&&los(cxp,cyp,a.x,a.y)){bd=d;best=a;} }
   if(best){ st.cd=T.cd; st.aim=Math.atan2(best.y-cyp,best.x-cxp); R.projs.push({x:cxp,y:cyp,tgt:best,spd:9,dmg:T.dmg*trapDmgMul()*R.trapS,kind:'arrow',src:{kind:'trap',type:'arrow',cat:'ranged',proj:1},from:'dun'}); reveal(+i); sfx('twang'); } }

  if(k==='fear'&&st.cd<=0){ const hit=advs.filter(a=>alive(a)&&!a.brave&&a.state!=='flee'&&Math.hypot(a.x-cxp,a.y-cyp)<T.r); if(hit.length){ st.cd=T.cd; st.fire=1; reveal(+i);
    for(const a of hit){ a.fleeT=T.flee; a.path=null; R.cause.fear+=4; G.guild.fearRuns++; fxText(a.x,a.y-.6,'!!','#c08aff'); } sfx('fear'); } }
  if(k==='slime'){ for(const a of advs) if(alive(a)&&a.tile===+i){ a.slowT=.3; damage(a,T.dps*trapDmgMul()*R.trapS*dt,{kind:'trap',type:'slime',cat:'trap'}); } }
