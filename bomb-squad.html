<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bomb Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Special+Elite&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="glitchbox-config.js"></script>
<script src="glitchbox-save.js" data-pos="top-left"></script>
<style>
:root{--bg:#0d0f10;--panel:#191c1e;--panel2:#22262a;--line:#33393e;--ink:#eef1f3;--dim:#949ca4;--acc:#ff5a2a;--green:#3ddc84;--red:#ff4d5e;--gold:#ffd23f;--paper:#efe7d4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{height:100dvh;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 112px;background:linear-gradient(#141617,#0b0c0d);border-bottom:1px solid var(--line);min-height:52px;z-index:2}
#top .logo{font-weight:800;font-size:18px;letter-spacing:.6px;white-space:nowrap}
#top .logo b{color:var(--acc)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-weight:700;font-size:15px;white-space:nowrap}
.stat.t{font-family:'JetBrains Mono',monospace;color:#ff6a5a;min-width:74px;text-align:center}
.stat.s{color:#ffb0b0}
#top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:18px}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px}
#main.solo{grid-template-columns:1fr minmax(320px,42%)}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#151718}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#manual{display:none;min-height:0;overflow:auto;background:#2a2723;padding:18px}
#main.expert #stage{display:none}#main.expert #manual{display:block}
#main.solo #manual{display:block;border-left:1px solid var(--line)}
#side{background:#0b0c0d;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#main.solo #side{display:none}
#players{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.pl{display:flex;gap:8px;align-items:center;font-size:14px}
.pl i{width:10px;height:10px;border-radius:50%}
.pl b{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:1px}
.pl.def b{color:var(--acc)}
#chat{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.cm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px;line-height:1.35}
.cm b{font-size:12px}
.cm.sys{background:none;border:0;color:var(--dim);font-size:12.5px;padding:2px 4px}
#quick{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px 0}
#quick button{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
#send{display:flex;gap:6px;padding:8px 10px 10px}
#send input{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#141618;color:var(--ink);font:inherit;font-size:14px}
#send button{padding:0 12px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:4;width:min(92%,520px)}
.tst{background:rgba(12,13,14,.93);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:500;font-size:15px;text-align:center;animation:tin .25s ease-out;transition:opacity .4s}
.tst.bad{border-color:var(--red);color:#ffc4ca}.tst.good{border-color:var(--green);color:#c8ffe0}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#mtabs{display:none}
/* the manual: a printed booklet */
.book{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page{background:var(--paper);color:#2a2620;border-radius:4px;padding:26px 30px 30px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 60px rgba(120,95,50,.18);font-family:'Special Elite','Courier New',monospace;font-size:15px;line-height:1.5;position:relative}
.page:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.015) 0 2px,transparent 2px 4px);pointer-events:none;border-radius:4px}
.page h1{font-size:30px;margin:0 0 6px;letter-spacing:2px;text-align:center}
.page h2{font-size:22px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid #2a2620;letter-spacing:1px}
.page h3{font-size:16px;margin:14px 0 6px;text-decoration:underline}
.page p{margin:6px 0}
.page ol,.page ul{margin:6px 0 6px 22px;padding:0}
.page li{margin:3px 0}
.page table{border-collapse:collapse;margin:8px 0;width:100%}
.page td,.page th{border:1.5px solid #2a2620;padding:4px 7px;text-align:center}
.page .stamp{position:absolute;top:16px;right:22px;border:3px solid #a3261c;color:#a3261c;padding:2px 8px;font-size:13px;transform:rotate(8deg);opacity:.75}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}
.cols div{border:1.5px solid #2a2620;display:flex;flex-direction:column;align-items:center;padding:4px 0;font-family:'Times New Roman',serif;font-size:24px;line-height:1.35}
.mazes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.mazes svg{width:100%;height:auto;background:#f6f0e0;border:1.5px solid #2a2620}
.morse{display:grid;grid-template-columns:repeat(6,1fr);gap:2px 10px;font-size:14px;margin:6px 0}
.words{display:grid;grid-template-columns:repeat(5,1fr);gap:4px 10px;margin:8px 0;text-transform:lowercase}
.ov{position:fixed;inset:0;background:rgba(4,5,6,.76);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.ov.on{display:flex}
.box{background:linear-gradient(#1c1f21,#161819);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.box h1{margin:0;font-size:44px;font-weight:800;letter-spacing:1px}
.box h1 b{color:var(--acc)}
.box h2{margin:0 0 8px;font-size:24px}
.box p,.sub{color:var(--dim);font-size:15px;line-height:1.45;margin:8px 0}
.big{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;font-size:18px;box-shadow:0 4px 0 #b13a14}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #b13a14}
.big.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.big.gr{background:var(--green);color:#052615;box-shadow:0 4px 0 #23985a}
.big:disabled{opacity:.45}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#121415;color:var(--ink);font:inherit;font-size:18px;text-align:center;margin-top:8px}
.code{font-size:46px;font-weight:800;letter-spacing:10px;color:var(--acc);margin:6px 0}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.prow{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}
.prow.me{border-color:#5a6066}
.prow.def{border-color:var(--acc)}
.prow span{flex:1}
.prow i{width:12px;height:12px;border-radius:50%}
.prow button{font-size:12px;padding:4px 8px;border-radius:8px;background:#3a2a20;border:1px solid #6a3a22;color:#ffc2a8}
.opt{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.opt button{padding:7px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.opt button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.err{color:var(--red);min-height:20px;margin-top:6px;font-size:14px}
.or{color:var(--dim);margin:12px 0 0;font-size:13px}
.tl{text-align:left;display:flex;flex-direction:column;gap:6px;margin:12px 0}
.tl div{display:flex;justify-content:space-between;background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:15px}
@media (max-width:820px){
  #top{padding-left:104px;gap:6px}
  #top .logo{display:none}
  .stat{font-size:13px;padding:3px 7px}
  #main,#main.solo{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,34vh)}
  #main.solo{grid-template-rows:auto minmax(0,1fr)}
  #main.solo #mtabs{display:flex;gap:6px;padding:6px 8px;background:#0b0c0d;border-bottom:1px solid var(--line)}
  #mtabs button{flex:1;padding:8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
  #mtabs button.on{border-color:var(--acc);color:var(--acc)}
  #main.solo.mb #stage{display:none}#main.solo:not(.mb) #manual{display:none}
  #main.solo #manual{border-left:0}
  #side{border-left:0;border-top:1px solid var(--line)}
  .page{padding:18px 16px;font-size:14px}
  .cols div{font-size:19px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="logo">💣 BOMB <b>SQUAD</b></div>
    <div class="stat t" id="sTime">–:––</div>
    <div class="stat s" id="sStrikes">✖ 0</div>
    <div class="stat" id="sMods">0/0</div>
    <div class="sp"></div>
    <button class="ib" id="bSnd" title="Sound">🔊</button>
  </div>
  <div id="main">
    <div id="mtabs"><button id="tBomb" class="on">💣 Bomb</button><button id="tMan">📖 Manual</button></div>
    <div id="stage"><canvas id="cv"></canvas><div id="toast"></div></div>
    <div id="manual"></div>
    <div id="side"><div id="players"></div><div id="chat"></div>
      <div id="quick"></div>
      <div id="send"><input id="chatIn" maxlength="140" placeholder="Say something…" autocomplete="off"><button id="chatGo">Send</button></div></div>
  </div>
</div>

<div class="ov on" id="titleOv"><div class="box">
  <h1>BOMB <b>SQUAD</b></h1>
  <p>One of you is alone with a ticking bomb. Everyone else has the manual — but can't see the bomb. Talk it through before the timer hits zero.</p>
  <button class="big" id="playOnline">👥 Play with friends (online)</button>
  <button class="big alt" id="playSolo">🧪 Practice alone (bomb + manual)</button>
  <p style="font-size:13px">Best with voice chat. There's a text chat in the game too.</p>
</div></div>
<div class="ov" id="mpOv"><div class="box" id="mpCard"></div></div>
<div class="ov" id="sheetOv"><div class="box" id="sheet"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const HASH=location.hash.replace(/-debug$/,'');
let DEMO=false;
function rngOf(seed){let s=seed>>>0||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ═══════════════════════ edgework ═══════════════════════
const IND_LABELS=['ARC','BLD','CRX','DMZ','EKO','FLX','GRV','HUB','JET','KLN','LYR'];
const PORTS=['USB','HDMI','RJ45','AUX','DC'];
const VOWELS='AEIOU';
const hasVowel=B=>[...B.serial].some(c=>VOWELS.includes(c));
const lastDigit=B=>+B.serial[B.serial.length-1];
const litInd=B=>B.inds.some(i=>i.lit);
function makeEdge(r){
  const L='ABCDEFGHIJKLMNPQRSTUVWXZ',D='0123456789';
  const serial=pick(r,L)+pick(r,L)+pick(r,D)+pick(r,L)+pick(r,L)+pick(r,D);
  const bats=Math.floor(r()*5);
  const inds=shuffle(r,IND_LABELS).slice(0,Math.floor(r()*4)).map(l=>({l,lit:r()<.5}));
  const ports=shuffle(r,PORTS).slice(0,Math.floor(r()*4));
  return{serial,bats,inds,ports};
}

// ═══════════════════════ modules: rules live here, the manual text is written from the same rules ═══════════════════════
const COLORS={red:'#d8322c',blue:'#2d5fd8',yellow:'#f0c428',white:'#ececec',black:'#1b1b1b',green:'#2e9e4c'};
const WIRE_COLORS=['red','blue','yellow','white','black','green'];
const count=(ws,c)=>ws.filter(w=>w.c===c).length;
const lastOf=(ws,c)=>{for(let i=ws.length-1;i>=0;i--)if(ws[i].c===c)return i;return -1};
const firstOf=(ws,c)=>ws.findIndex(w=>w.c===c);
const ordinal=['first','second','third','fourth','fifth','sixth'];
// each rule: [text, test(ws,B), answer(ws,B)] — the first rule whose test passes says which wire to cut
const WIRE_RULES={
  3:[['If there are no green wires, cut the first wire.',ws=>!count(ws,'green'),()=>0],
     ['Otherwise, if the serial number contains a vowel, cut the last green wire.',(ws,B)=>hasVowel(B),ws=>lastOf(ws,'green')],
     ['Otherwise, cut the second wire.',()=>true,()=>1]],
  4:[['If there is exactly one black wire, cut the black wire.',ws=>count(ws,'black')===1,ws=>firstOf(ws,'black')],
     ['Otherwise, if there are more red wires than blue wires, cut the second wire.',ws=>count(ws,'red')>count(ws,'blue'),()=>1],
     ['Otherwise, if the bomb has two or more batteries, cut the last wire.',(ws,B)=>B.bats>=2,ws=>ws.length-1],
     ['Otherwise, cut the third wire.',()=>true,()=>2]],
  5:[['If the last wire is yellow and the last digit of the serial number is even, cut the fourth wire.',(ws,B)=>ws[4].c==='yellow'&&lastDigit(B)%2===0,()=>3],
     ['Otherwise, if there are no white wires, cut the first wire.',ws=>!count(ws,'white'),()=>0],
     ['Otherwise, if there are exactly two red wires, cut the last red wire.',ws=>count(ws,'red')===2,ws=>lastOf(ws,'red')],
     ['Otherwise, cut the second wire.',()=>true,()=>1]],
  6:[['If the bomb has a lit indicator, cut the last wire.',(ws,B)=>litInd(B),ws=>ws.length-1],
     ['Otherwise, if there are more than two blue wires, cut the first blue wire.',ws=>count(ws,'blue')>2,ws=>firstOf(ws,'blue')],
     ['Otherwise, if the first and last wires are the same colour, cut the fifth wire.',ws=>ws[0].c===ws[ws.length-1].c,()=>4],
     ['Otherwise, cut the fourth wire.',()=>true,()=>3]],
};
function wireAnswer(ws,B){for(const[,test,ans]of WIRE_RULES[ws.length])if(test(ws,B))return ans(ws,B);return 0}

const BTN_COLORS=['red','blue','yellow','white'],BTN_LABELS=['HOLD','PRESS','ABORT','DETONATE'];
const BTN_RULES=[
  ['If the button says ABORT and the bomb has a lit indicator, press and release it right away.',(m,B)=>m.label==='ABORT'&&litInd(B),'tap'],
  ['Otherwise, if the button is red and says HOLD, hold it down.',m=>m.color==='red'&&m.label==='HOLD','hold'],
  ['Otherwise, if the bomb has three or more batteries, press and release it right away.',(m,B)=>B.bats>=3,'tap'],
  ['Otherwise, if the button is yellow, hold it down.',m=>m.color==='yellow','hold'],
  ['Otherwise, if the button is white and the serial number contains a 7 or a Z, press and release it right away.',(m,B)=>m.color==='white'&&/[7Z]/.test(B.serial),'tap'],
  ['Otherwise, if the button is blue and says DETONATE, press and release it right away.',m=>m.color==='blue'&&m.label==='DETONATE','tap'],
  ['Otherwise, hold it down.',()=>true,'hold'],
];
const STRIP={blue:'4',white:'1',yellow:'5',red:'2',green:'2'};
function btnAction(m,B){for(const[,t,a]of BTN_RULES)if(t(m,B))return a;return'hold'}

const GLYPHS=['Ϙ','Ѧ','ƛ','Ϟ','Ѭ','ϗ','Ͼ','Ӭ','Ҩ','Ψ','¿','©','Ѯ','Ҋ','Ω','Ѣ','ƀ','Ж','¶','Ӆ','ϡ','Ҿ','æ','Ѫ','ʘ','Ϫ','ψ','Ͽ'];
const KEY_COLS=(()=>{const r=rngOf(424242);return Array.from({length:6},()=>shuffle(r,GLYPHS).slice(0,7))})();

const SIMON=['red','blue','green','yellow'];
// mapping[vowel?1:0][min(strikes,2)][flash colour] = colour to press
const SIMON_MAP={
  1:[{red:'blue',blue:'yellow',green:'red',yellow:'green'},{red:'yellow',blue:'green',green:'blue',yellow:'red'},{red:'green',blue:'red',green:'yellow',yellow:'blue'}],
  0:[{red:'green',blue:'yellow',green:'blue',yellow:'red'},{red:'blue',blue:'red',green:'yellow',yellow:'green'},{red:'yellow',blue:'green',green:'red',yellow:'blue'}],
};

const MORSE={a:'.-',b:'-...',c:'-.-.',d:'-..',e:'.',f:'..-.',g:'--.',h:'....',i:'..',j:'.---',k:'-.-',l:'.-..',m:'--',n:'-.',o:'---',p:'.--.',q:'--.-',r:'.-.',s:'...',t:'-',u:'..-',v:'...-',w:'.--',x:'-..-',y:'-.--',z:'--..'};
const MORSE_WORDS=['flare','crane','lunar','pixel','quartz','radar','sonic','tango','vapor','wired','zebra','orbit','delta','ember','gravy','hyper'];
const FREQS=MORSE_WORDS.map((w,i)=>(3.505+i*.007).toFixed(3));

// mazes: nine 6×6 mazes, each recognised by its two marker circles
const MAZES=(()=>{
  const out=[],used=new Set();
  for(let k=0;out.length<9;k++){
    const r=rngOf(9000+k),walls={};const key=(x,y,d)=>x+','+y+','+d;
    for(let x=0;x<6;x++)for(let y=0;y<6;y++)for(const d of['r','d'])walls[key(x,y,d)]=true;
    const seen=new Set(['0,0']),stack=[[0,0]];
    while(stack.length){const[x,y]=stack[stack.length-1];const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[x+dx,y+dy,dx,dy]).filter(([a,b])=>a>=0&&b>=0&&a<6&&b<6&&!seen.has(a+','+b));
      if(!nb.length){stack.pop();continue}const[a,b,dx,dy]=pick(r,nb);
      if(dx===1)walls[key(x,y,'r')]=false;else if(dx===-1)walls[key(a,b,'r')]=false;else if(dy===1)walls[key(x,y,'d')]=false;else walls[key(a,b,'d')]=false;
      seen.add(a+','+b);stack.push([a,b])}
    // knock a few extra holes so there are loops
    for(let i=0;i<5;i++){const x=Math.floor(r()*5),y=Math.floor(r()*6);walls[key(x,y,'r')]=false}
    const m1=[Math.floor(r()*6),Math.floor(r()*6)],m2=[Math.floor(r()*6),Math.floor(r()*6)];
    const pk=[m1,m2].map(p=>p.join(',')).sort().join('|');
    if(m1[0]===m2[0]&&m1[1]===m2[1]||used.has(m1.join(','))||used.has(m2.join(',')))continue;
    used.add(m1.join(','));used.add(m2.join(','));
    out.push({walls,markers:[m1,m2],key:pk});
  }
  return out;
})();
function mazeOpen(mz,x,y,dx,dy){
  const w=MAZES[mz].walls,nx=x+dx,ny=y+dy;
  if(nx<0||ny<0||nx>5||ny>5)return false;
  if(dx===1)return !w[x+','+y+',r'];if(dx===-1)return !w[nx+','+ny+',r'];if(dy===1)return !w[x+','+y+',d'];return !w[nx+','+ny+',d'];
}
const PASSWORDS=['abort','bacon','cabin','dance','eagle','fable','giant','happy','index','joker','knife','lemon','magic','noble','ocean','piano','quiet','radio','sugar','table','under','vivid','water','xenon','yacht','zesty','clock','dream','flame','glass'];

// ── generation ──
const MOD_TYPES=['wires','button','keypad','simon','morse','maze','password'];
const MOD_NAME={wires:'Wires',button:'The Button',keypad:'Symbols',simon:'Signals',morse:'Frequency',maze:'Maze',password:'Password'};
function genModule(type,r,B){
  if(type==='wires'){const n=3+Math.floor(r()*4);const ws=Array.from({length:n},()=>({c:pick(r,WIRE_COLORS),cut:false,sag:(r()-.5)*8}));return{type,ws,ans:wireAnswer(ws,B)}}
  if(type==='button'){const m={type,color:pick(r,BTN_COLORS),label:pick(r,BTN_LABELS),strip:pick(r,['blue','white','yellow','red','green']),down:null};m.act=btnAction(m,B);return m}
  if(type==='keypad'){for(;;){const c=Math.floor(r()*6),col=KEY_COLS[c],ix=shuffle(r,[0,1,2,3,4,5,6]).slice(0,4),gl=ix.map(i=>col[i]);
    if(KEY_COLS.some((k,j)=>j!==c&&gl.every(g=>k.includes(g))))continue;

// Signals: flash the first `stage` colours, pause, repeat
function simonFlash(m){if(m.solved)return null;const n=m.stage,cyc=n*.75+1.6,t=((TIME-(m.t0||0))%cyc+cyc)%cyc;if(t>n*.75)return null;const k=Math.floor(t/.75);return t-k*.75<.45?m.seq[k]:null}
// Morse: dot .3s, dash .9s, gap .3s between marks, .9s between letters, 2.4s before repeating
function morseTimeline(word){const tl=[];let t=0;for(const ch of word){for(const s of MORSE[ch]){const d=s==='.'?.3:.9;tl.push([t,t+d]);t+=d+.3}t+=.6}return{tl,len:t+2.4}}
const MT={};
function morseOn(m){if(m.solved)return false;const w=MORSE_WORDS[m.word],mt=MT[w]||(MT[w]=morseTimeline(w));const t=(TIME+m.t0)%mt.len;return mt.tl.some(([a,b])=>t>=a&&t<b)}

  for(let i=0;i<total;i++){const[x,y]=slotXY(i);if(i===0)drawTimer(x,y);else if(B.mods[i-1])drawModule(B.mods[i-1],x,y);else{plate(x,y,MOD,MOD);T('— BLANK —',x+MOD/2,y+MOD/2+2,6,'rgba(255,255,255,.18)',800)}}
}

// ═══════════════════════ game flow ═══════════════════════
let mode='title',ROLE='def',TIME=0,ROUND=0;
function startSolo(diff){
  netClose();NET.mode='off';mode='solo';ROLE='def';$('main').className='solo';$('titleOv').classList.remove('on');
  B=makeBomb(1+Math.floor(Math.random()*1e9),diff||'easy');$('manual').innerHTML=manualHTML(null);$('manual').scrollTop=0;
  for(const m of B.mods)if(m.type==='simon')m.t0=TIME;
  hideSheet();msg('The timer is running. The manual is on the right.');
}
function endRound(){
  B.boomT=0;if(B.res==='boom'){for(let i=0;i<160;i++)FX.push({x:W/2,y:H/2,vx:(Math.random()-.5)*900,vy:(Math.random()-.5)*900,life:1+Math.random(),s:2+Math.random()*5,c:['#ffb020','#ff5a2a','#ffe9a0','#555'][i%4]});SHAKE=1}
  broadcastBomb(true);
  setTimeout(()=>showOver(),B.res==='boom'?1900:900);
}
function showOver(){
  if(!B)return;
  const win=B.res==='win',solved=solvedCount(B),left=Math.max(0,Math.ceil(B.left));
  if(win){try{if(!DEMO&&window.GLITCHBOX&&GLITCHBOX.score)GLITCHBOX.score(left*B.mods.length)}catch(e){}}
  const host=NET.mode==='host';
  showSheet(`<div style="font-size:64px;line-height:1">${win?'✅':'💥'}</div><h2>${win?'Bomb defused!':B.res==='left'?'The defuser left':'BOOM.'}</h2>
    <div class="tl"><div><span>Time left</span><b>${timerStr(B)}</b></div><div><span>Modules disarmed</span><b>${solved}/${B.mods.length}</b></div><div><span>Strikes</span><b>${B.strikes}</b></div></div>
    ${mode==='solo'?'<button class="big" id="again">🔁 New bomb</button><button class="big alt" id="toTitle">🏠 Title</button>':host?'<button class="big" id="nextRound">▶ Next bomb</button><button class="big alt" id="toLobby">🏠 Back to lobby</button>':'<div class="sub">Waiting for the host to start the next bomb…</div><button class="big alt" id="mpLeave">🚪 Leave</button>'}`);
}
function showSheet(h){$('sheet').innerHTML=h;$('sheetOv').classList.add('on')}
function hideSheet(){$('sheetOv').classList.remove('on')}
function goTitle(){netClose();NET.mode='off';HS=null;mode='title';B=null;$('main').className='';hideSheet();$('mpOv').classList.remove('on');$('titleOv').classList.add('on');renderHud()}

// ═══════════════════════ multiplayer ═══════════════════════
// The host runs the lobby and starts each round. The defuser's browser runs the bomb itself and
// broadcasts its state; the experts only ever get the manual plus the timer/strikes.
//   guest → host  {t:'hi',cid,name,hue} {t:'hb',cid} {t:'bye',cid}
//   host  → all   {t:'st',ph:lobby|play|over,h,def,diff,split,seed,round,pl:[[cid,name,hue]],res}
//   defuser → all {t:'bs',round,left,mult,strikes,max,solved,total,res}
//   anyone → all  {t:'chat',cid,name,hue,txt}
const MAXP=8,GONE=15000;
const CODE_A='ABCDEFGHJKMNPQRSTUVWXYZ';
const rcode=n=>Array.from({length:n},()=>CODE_A[Math.floor(Math.random()*CODE_A.length)]).join('');
const MY=rcode(8);
const NET={mode:'off',ws:null,code:'',st:null,lastHost:0,lastHb:0,bs:null,bsAt:0};
let HS=null,NAME='',HUE=Math.floor(Math.random()*360);
try{NAME=localStorage.getItem('bombsquad.name')||''}catch(e){}
function wsURL(room,role){const b=window.GLITCHBOX_WS&&!/PLACEHOLDER/i.test(window.GLITCHBOX_WS)?window.GLITCHBOX_WS:(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws';return b+'?room='+encodeURIComponent(room)+'&role='+role}
function netConnect(room,role){
  netClose();NET.code=room;NET.mode=role;NET.lastHost=Date.now();
  let ws;try{ws=new WebSocket(wsURL(room,role))}catch(e){mpHome('Couldn\'t reach the game server.');return}
  NET.ws=ws;
  ws.onopen=()=>ws.send(JSON.stringify(role==='host'?{t:'create',code:room,max:MAXP}:{t:'join',code:room}));
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onNet(m)};
  ws.onclose=()=>{if(NET.ws===ws){NET.ws=null;if(NET.mode!=='off')mpLost('Lost the connection to the game.')}};
}
function netSend(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o))}
function netClose(){const w=NET.ws;NET.ws=null;if(w){w.onclose=null;try{w.close()}catch(e){}}}
const myName=()=>(NAME||'Agent').slice(0,12);
function onNet(m){
  if(m.t==='created'){HS={ph:'lobby',players:[],def:MY,diff:'easy',split:false,seed:0,round:0,res:null,seen:{}};hostIn({t:'hi',cid:MY,name:myName(),hue:HUE});return}
  if(m.t==='joined'||m.t==='start'){if(NET.mode==='guest')netSend({t:'hi',cid:MY,name:myName(),hue:HUE});return}
  if(m.t==='error'){const t=m.msg||'That didn\'t work.';netClose();NET.mode='off';mpHome(t==='No game with that code.'?'No room with that code — check the letters.':t);return}
  if(m.t==='left')return;
  if(m.t==='chat'){addChat(m);return}
  if(m.t==='bs'){onBombState(m);if(NET.mode==='host')hostBomb(m);return}
  if(NET.mode==='host'){hostIn(m);return}
  if(m.to&&m.to!==MY)return;
  if(m.t==='st')clientState(m);
  else if(m.t==='full'){netClose();NET.mode='off';mpHome('That room is full (8 players).')}
}
const HP=cid=>HS.players.find(p=>p.cid===cid);
function hostIn(m){
  if(!HS)return;if(m.cid)HS.seen[m.cid]=Date.now();
  if(m.t==='hi'){const p=HP(m.cid);if(p){p.name=String(m.name||p.name).slice(0,12);p.hue=+m.hue||0}else{if(HS.players.length>=MAXP){netSend({t:'full',to:m.cid});return}HS.players.push({cid:m.cid,name:String(m.name||'Agent').slice(0,12),hue:+m.hue||0})}hostPush()}
  else if(m.t==='bye')hostDrop(m.cid);

function solveStep(m){
  if(m.solved)return false;
  if(m.type==='wires'){cutWire(m,wireAnswer(m.ws,B));return true}
  if(m.type==='button'){if(m.act==='tap'){buttonDown(m);buttonUp(m);return true}
    buttonDown(m);m.down-=1;const d=STRIP[m.strip];if(!timerStr(B).includes(d)){B.left=Math.floor(B.left/60)*60+(+d)*10+(+d)+.5;if(!timerStr(B).includes(d))B.left=(+d)*60+30.5}buttonUp(m);return true}
  if(m.type==='keypad'){pressKey(m,m.order[m.next]);return true}
  if(m.type==='simon'){pressSimon(m,simonWant(m,B));return true}
  if(m.type==='morse'){if(m.f<m.word)morseNudge(m,1);else if(m.f>m.word)morseNudge(m,-1);else morseTx(m);return true}
  if(m.type==='maze'){const path=mazePath(m.mz,m.pos,m.goal);mazeMove(m,path[0][0],path[0][1]);return true}
  if(m.type==='password'){for(let i=0;i<5;i++)if(m.cols[i][m.idx[i]]!==m.word[i]){pwCycle(m,i,1);return true}pwSubmit(m);return true}
}
function mazePath(mz,a,b){const q=[[a[0],a[1],[]]],seen=new Set([a.join(',')]);while(q.length){const[x,y,p]=q.shift();if(x===b[0]&&y===b[1])return p;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(mazeOpen(mz,x,y,dx,dy)&&!seen.has((x+dx)+','+(y+dy))){seen.add((x+dx)+','+(y+dy));q.push([x+dx,y+dy,p.concat([[dx,dy]])])}}return null}
if(/debug/.test(location.hash))window.__nextMazeMove=k=>{const m=B.mods[k];return mazePath(m.mz,m.pos,m.goal)[0]};
function solveBomb(lim){let n=0;while(n++<(lim||500)&&B&&!B.res){const m=B.mods.find(x=>!x.solved);if(!m)break;solveStep(m)}return B&&B.res}

    const mz=B.mods.find(m=>m.type==='maze');const blocked=[[1,0],[-1,0],[0,1],[0,-1]].find(([dx,dy])=>!mazeOpen(mz.mz,mz.pos[0],mz.pos[1],dx,dy));if(blocked){const s=B.strikes;mazeMove(mz,...blocked);ok(B.strikes===s+1,'walking into a wall → strike')}
    // password uniqueness
    for(let s=0;s<200;s++){const p=genModule('password',rngOf(s),Bx);ok(PASSWORDS.filter(wd=>[...wd].every((ch,i)=>p.cols[i].includes(ch))).length===1,'password '+s+' has one answer');if(fail)break}
    for(let s=0;s<200;s++){const k=genModule('keypad',rngOf(s),Bx);ok(KEY_COLS.filter(c=>k.gl.every(g=>c.includes(g))).length===1,'keypad '+s+' has one column');if(fail)break}
    // manual covers every rule
    const man=manualHTML(null);ok(WIRE_RULES[5].every(r=>man.includes(esc(r[0])))&&BTN_RULES.every(r=>man.includes(esc(r[0]))),'manual text comes from the rules');
    ok(MORSE_WORDS.every((w,i)=>man.includes(w)&&man.includes(FREQS[i])),'manual lists every word + frequency');
    ok(manualHTML(['wires']).split('class="page"').length===3,'split manual gives only your pages');
    // 4. drawing
    W=W||900;H=H||700;for(const d of['easy','normal','hard']){B=makeBomb(11,d);mode='play';ROLE='def';geom();render()}H=1000;W=500;geom();render();ok(LAY.port,'portrait layout on a tall screen');W=900;H=700;
    B.res='boom';B.boomT=.4;endRound();render();ok(true,'explosion draws');
    // 5. multiplayer
    quiet=true;NET.mode='host';onNet({t:'created'});hostIn({t:'hi',cid:'g1',name:'Bo',hue:4});hostIn({t:'hi',cid:'g1',name:'Bo',hue:5});ok(HS.players.length===2,'repeat hello doesn\'t duplicate');
    ok(hostStart()&&mode==='play'&&ROLE==='def'&&B,'host starts; host is the default defuser and builds the bomb');
    ok(NET.st.seed===B.seed,'the bomb comes from the shared seed');
    solveBomb();ok(HS.ph==='over'&&HS.res==='win','defuser wins → host ends the round');
    hostNext();ok(HS.def==='g1'&&ROLE==='exp'&&$('main').className==='expert','next round passes the bomb on; you get the manual');
    onNet({t:'bs',round:HS.round,left:10,mult:1,strikes:3,max:3,solved:1,total:3,res:'boom'});ok(HS.ph==='over'&&HS.res==='boom','defuser\'s boom ends it for everyone');
    hostDrop('g1');ok(HS.def===MY,'defuser leaving hands the bomb back to the host');
    NET.mode='off';HS=null;quiet=false;
    ok(wsURL('ABCD','host').indexOf('glitchbox-api')!==-1,'relay url');
    ok(!!document.querySelector('script[src="glitchbox-menu.js"]'),'quit button script present');
  }catch(e){fail++;out.push('EXCEPTION '+e.message+'\n'+e.stack)}
  quiet=false;
  const pre=document.createElement('pre');pre.id='smokeout';pre.textContent=(fail?'SMOKE FAIL':'SMOKE PASS')+' '+pass+'/'+(pass+fail)+'\n'+out.join('\n');
  pre.style.cssText='position:fixed;inset:0;z-index:99;background:#000;color:#0f0;margin:0;padding:10px;overflow:auto;font-size:12px';
  document.body.appendChild(pre);document.title=(fail?'SMOKE FAIL ':'SMOKE PASS ')+pass+'/'+(pass+fail);
});
</script>
<script src="glitchbox-menu.js" data-pos="top-left" defer></script>
